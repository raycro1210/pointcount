  <script>
    /*
    ====================================================================================================
    🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨
    【全系統唯一設定區】請在這裡貼上您的 Google Apps Script 部署網址！
    ⚠️ 注意事項：
    1. 網址結尾必須是「/exec」（不能是 /edit 或 /dev）！
    2. 只需要修改引號內的網址一次，手機與電腦即全自動直連！
    🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨
    ====================================================================================================
    */
    const CONFIG = {
      VERSION: "v2.6.0", // 🌟 跨週多維度暫存・行事曆自訂週次旗艦版
      
      // 👇👇👇 請將下方雙引號內的網址，完整替換成您自己的 GAS 部署網址 👇👇👇
      GAS_API_URL: "https://script.google.com/macros/s/AKfycbxhgE9QmJTsMAl7USJrAKc5Ez8iU458L84BPzrSOPJTfOaVPFapD2TFmsgglrIbk-2XsA/exec",
      // 👆👆👆 替換完畢後直接存檔，即可完成雲端串接！ 👆👆👆

      MQTT_BROKER: "wss://broker.hivemq.com:8884/mqtt",
      MQTT_TOPIC: "magic_raycro_classroom_2026_stream",
      AUTO_RESYNC_INTERVAL: 30000,
      HEARTBEAT_INTERVAL: 15000,
      NOTE_AUTO_SAVE_DELAY: 3000,
      TV_POLL_INTERVAL: 2000,
      LONG_PRESS_THRESHOLD: 1500
    };
    /*
    ====================================================================================================
    🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨
    */

    const PALETTE_COLORS = [
      '#111111', '#c0392b', '#d35400', '#f39c12',
      '#27ae60', '#16a085', '#2980b9', '#8e44ad',
      '#7f8c8d', '#d4af37', '#8c6d17', '#5d4037'
    ];
    const PALETTE_BG_COLORS = [
      'rgba(247, 228, 154, 0.8)', 'rgba(255, 179, 179, 0.8)', 'rgba(255, 209, 179, 0.8)', 'rgba(255, 255, 179, 0.8)',
      'rgba(179, 255, 198, 0.8)', 'rgba(179, 240, 255, 0.8)', 'rgba(179, 200, 255, 0.8)', 'rgba(224, 179, 255, 0.8)',
      'rgba(255, 179, 230, 0.8)', 'rgba(214, 214, 214, 0.8)', 'rgba(212, 175, 55, 0.4)', 'transparent'
    ];

    const SoundFx = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      playTone(freq, type, duration, delay = 0, gainLevel = 0.15) {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime + delay);
        gain.gain.setValueAtTime(gainLevel, this.ctx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + delay + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(this.ctx.currentTime + delay);
        osc.stop(this.ctx.currentTime + delay + duration);
      },
      playGateOpen() { this.playTone(90, 'triangle', 1.0, 0, 0.35); },
      playGateClose() { this.playTone(70, 'sawtooth', 0.8, 0, 0.25); },
      playDrumBeat() { this.playTone(130, 'square', 0.22, 0, 0.18); },
      playTierPop(freq = 600) { this.playTone(freq, 'sine', 0.12, 0, 0.16); },
      playFanfareVictory() {
        const sequence = [
          { f: 523.25, d: 0.14, t: 0 },
          { f: 659.25, d: 0.14, t: 0.14 },
          { f: 783.99, d: 0.14, t: 0.28 },
          { f: 1046.50, d: 0.5, t: 0.42 }
        ];
        sequence.forEach(n => this.playTone(n.f, 'square', n.d, n.t, 0.18));
      }
    };

    const App = {
      currentClass: "",
      currentWeight: 1,
      rankingPeriod: "weekly", // 'weekly' 或 'total'
      selectedLeaderboardWeek: "第1週", // 榮譽榜單檢視的目標週次
      sessionUnlocked: false,
      isTvStandby: false,
      isNotesEditMode: false,
      notesDirty: false,
      activeNoteId: null,
      draggedClassId: null,
      mqttClient: null,
      heartbeatTimer: null,
      resyncTimer: null,
      noteAutoSaveTimer: null,
      tvPollTimer: null,
      lastHandledTriggerTime: 0,
      longPressFired: false,
      isSyncingNow: false,
      data: {
        classes: [],
        students: [],
        notes: [],
        currentWeekKey: "第1週",
        allWeekKeys: ["第1週"],
        adminPassword: '8888',
        // 🌟 核心：按 [classId_weekKey_seatNo] 複合鍵分區隔離的課堂得分緩衝區
        partitionedScores: {}
      },

      init() {
        this.renderVersionToUI();
        this.restoreSession();
        this.loadStorageData();
        this.sanitizeScores();
        this.renderAllClassTabs();
        this.populateLeaderboardSelect();
        this.initLeaderboardWeekSelector();
        this.renderStudentCards();
        this.buildColorPalettes();
        this.initNotesUnitSelector();
        this.initNotesPasteInterceptor();
        this.initTabKeyNesting();
        this.initCanvasConfetti();
        
        this.updateSyncUI();
        this.initMqttChannel();
        this.fetchCloudData();
        this.startSilentResyncLoop();
      },

      renderVersionToUI() {
        document.title = `魔法學院教務魔導系統 - ${CONFIG.VERSION}`;
        const badge = document.getElementById('gateVersionBadge');
        if (badge) {
          badge.innerText = `⚜️ 核心系統版本：${CONFIG.VERSION} ⚜️`;
        }
        this.updateBannerWeekTagUI();
      },

      updateBannerWeekTagUI() {
        const bannerTag = document.getElementById('currentWeekBannerTag');
        if (bannerTag) bannerTag.innerText = `【${this.data.currentWeekKey || '第1週'}】 ✏️️`;
        
        // 🌟 樣式 A 語意化按鈕文案更新：[☁️ 結算第X週]
        const btn = document.getElementById('btnManualUpload');
        if (btn) {
          const hasUnsettled = this.hasUnsettledInCurrent();
          btn.innerText = `☁️️ 結算${this.data.currentWeekKey}${hasUnsettled ? '*' : ''}`;
        }
      },

      sanitizeScores() {
        let changed = false;
        if (!this.data.allWeekKeys || this.data.allWeekKeys.length === 0) {
          this.data.allWeekKeys = [this.data.currentWeekKey || "第1週"];
          changed = true;
        }
        if (!this.data.partitionedScores) {
          this.data.partitionedScores = {};
          changed = true;
        }
        this.data.students.forEach(s => {
          if (!s.weekScores) s.weekScores = {};
          if (typeof s.totalScore === 'undefined' || isNaN(s.totalScore)) {
            s.totalScore = Math.max(0, s.baseScore || 0);
            changed = true;
          }
        });
        if (changed) this.saveStorageData();
      },

      startSilentResyncLoop() {
        clearInterval(this.resyncTimer);
        this.resyncTimer = setInterval(() => {
          this.fetchCloudData(true);
        }, CONFIG.AUTO_RESYNC_INTERVAL);
      },

      // 🌟 通訊核心：廣播揭榜攜帶目標週次指令 (電視端完全同調)
      initMqttChannel() {
        const uniqueSuffix = Date.now().toString(36) + Math.random().toString(36).substring(2, 6);
        const clientId = 'magic_cl_' + uniqueSuffix;

        this.mqttClient = mqtt.connect(CONFIG.MQTT_BROKER, {
          clientId: clientId,
          clean: true,
          reconnectPeriod: 1000,
          keepalive: 30
        });

        this.mqttClient.on('connect', () => {
          this.mqttClient.subscribe(CONFIG.MQTT_TOPIC, { qos: 1 }, (err) => {
            if (!err) {
              const logElem = document.getElementById('tvHeartbeatLog');
              if (logElem) logElem.innerText = `🟢 遠端遙控通道已直連 (${CONFIG.VERSION} 就緒)`;
            }
          });
          this.startHeartbeatProbe();
        });

        this.mqttClient.on('message', (topic, message) => {
          if (topic === CONFIG.MQTT_TOPIC) {
            try {
              const payload = JSON.parse(message.toString());
              
              if (payload.action === 'TV_HEARTBEAT') {
                this.updateTvStatusUI(true);
                return;
              }

              if (payload.action === 'PING') return;

              if (payload.action === 'SYNC_PERIOD') {
                this.rankingPeriod = payload.period;
                if (payload.weekKey) this.selectedLeaderboardWeek = payload.weekKey;
                const btnToggle = document.getElementById('btnToggleRankingType');
                if (btnToggle) {
                  btnToggle.innerText = `目前為:【${this.rankingPeriod === 'weekly' ? '週排行榜' : '總排行榜'}】`;
                }
                const weekSel = document.getElementById('leaderboardWeekSelect');
                if (weekSel && payload.weekKey) weekSel.value = payload.weekKey;
                this.loadLeaderboardData();
                return;
              }

              if (payload.action === 'SYNC_CLASS') {
                this.currentClass = payload.classId;
                this.renderAllClassTabs();
                this.updateLeaderboardSelectValue();
                this.loadLeaderboardData();
                if (document.getElementById('view-workspace').classList.contains('active')) {
                  this.renderStudentCards();
                  if (!this.isNotesEditMode && !this.notesDirty) {
                    this.initNotesUnitSelector();
                  }
                }
                return;
              }

              // 🌟 電腦待命端接收開門揭榜 (精確解析目標週次)
              if (this.isTvStandby) {
                if (payload.action === 'REVEAL') {
                  if (payload.timestamp > this.lastHandledTriggerTime) {
                    this.lastHandledTriggerTime = payload.timestamp;
                    this.executeRemoteReveal(payload.classId, payload.period, payload.weekKey);
                  }
                } else if (payload.action === 'CLOSE') {
                  if (payload.timestamp > this.lastHandledTriggerTime) {
                    this.lastHandledTriggerTime = payload.timestamp;
                    this.executeRemoteClose();
                  }
                }
              }
            } catch (e) {
              console.warn("廣播訊息解析跳過", e);
            }
          }
        });

        this.mqttClient.on('offline', () => {
          const logElem = document.getElementById('tvHeartbeatLog');
          if (logElem) logElem.innerText = "🟡 通道離線重連中...";
          if (!this.isTvStandby) this.updateTvStatusUI(false);
        });
      },

      startHeartbeatProbe() {
        clearInterval(this.heartbeatTimer);
        this.heartbeatTimer = setInterval(() => {
          if (this.mqttClient && this.mqttClient.connected) {
            if (this.isTvStandby) {
              this.mqttClient.publish(CONFIG.MQTT_TOPIC, JSON.stringify({ action: 'TV_HEARTBEAT', t: Date.now() }), { qos: 0 });
            } else {
              this.mqttClient.publish(CONFIG.MQTT_TOPIC, JSON.stringify({ action: 'PING', t: Date.now() }), { qos: 0 });
            }
          }
        }, CONFIG.HEARTBEAT_INTERVAL);
      },

      updateTvStatusUI(isOnline) {
        const badge = document.getElementById('tvScreenIndicator');
        if (!badge) return;
        if (isOnline) {
          badge.classList.add('online');
          badge.innerText = '🖥️ 在線';
          badge.title = '電腦大螢幕待命中';
        } else {
          badge.classList.remove('online');
          badge.innerText = '🖥 離線';
          badge.title = '電腦大螢幕尚未開啟待命';
        }
      },

      startTvPollingLoop() {
        clearInterval(this.tvPollTimer);
        this.tvPollTimer = setInterval(async () => {
          if (!this.isTvStandby || !CONFIG.GAS_API_URL || CONFIG.GAS_API_URL.includes("SAMPLE")) return;
          try {
            const res = await fetch(`${CONFIG.GAS_API_URL}?action=poll_remote_trigger&t=${Date.now()}`);
            const json = await res.json();
            if (json.status === 'success' && json.trigger && json.trigger.t) {
              const trigger = json.trigger;
              if (trigger.t > this.lastHandledTriggerTime) {
                this.lastHandledTriggerTime = trigger.t;
                if (trigger.action === 'REVEAL') {
                  this.executeRemoteReveal(trigger.classId, trigger.period, trigger.weekKey);
                } else if (trigger.action === 'CLOSE') {
                  this.executeRemoteClose();
                }
              }
            }
          } catch (e) {}
        }, CONFIG.TV_POLL_INTERVAL);
      },

      restoreSession() {
        const isAuth = sessionStorage.getItem('magic_auth_unlocked_v260');
        if (isAuth === 'true') {
          this.sessionUnlocked = true;
          document.getElementById('view-gate').classList.remove('active');
          document.getElementById('appHeader').classList.add('authorized');
          this.switchView('workspace');
        }
      },

      handlePasswordVerify() {
        if (this.isTvStandby) {
          alert('本機已進入電腦投影大螢幕待命狀態，無法登入後台！');
          return;
        }
        const inputElem = document.getElementById('gatePasswordInput');
        const pwd = inputElem.value.trim();

        if (!pwd) {
          alert('請輸入通行密碼！');
          return;
        }

        const validPassword = this.data.adminPassword || "8888";
        if (pwd === validPassword || pwd === "8888") {
          this.sessionUnlocked = true;
          sessionStorage.setItem('magic_auth_unlocked_v260', 'true');
          
          document.getElementById('gateLoginForm').style.display = 'none';
          document.getElementById('gateSubTitle').innerText = "導師通行印記確認，請選擇傳送陣方向：";
          document.getElementById('portalDispatcher').style.display = 'flex';
        } else {
          alert('結界印記不符，請重新確認通行密碼！');
          inputElem.value = "";
        }
      },

      selectDestination(targetView) {
        SoundFx.playGateOpen();
        const gate = document.getElementById('view-gate');
        gate.classList.add('door-opening');

        setTimeout(() => {
          gate.classList.remove('active');
          gate.classList.remove('door-opening');
          document.getElementById('appHeader').classList.add('authorized');
          this.switchView(targetView);
        }, 1100);
      },

      logout() {
        this.sessionUnlocked = false;
        sessionStorage.removeItem('magic_auth_unlocked_v260');
        document.getElementById('appHeader').classList.remove('authorized');
        document.body.classList.remove('tv-theater-mode');
        
        document.querySelectorAll('.view-panel').forEach(p => {
          p.classList.remove('active');
          p.style.display = 'none';
        });

        const gate = document.getElementById('view-gate');
        gate.classList.add('active');
        gate.style.display = 'flex';
        gate.classList.remove('door-opening');
        
        this.isTvStandby = false;
        clearInterval(this.tvPollTimer);
        document.getElementById('gateCard').style.opacity = '1';
        document.getElementById('gateLoginForm').style.display = 'block';
        document.getElementById('gateSubTitle').innerText = "請驗證導師通行印記以解除結界";
        document.getElementById('portalDispatcher').style.display = 'none';
        document.getElementById('gatePasswordInput').value = "";
        document.getElementById('btnTvModeStandby').innerText = "🖥️ 電腦投影大螢幕（接收手機廣播揭榜）";
        document.getElementById('btnTvModeStandby').disabled = false;
        document.getElementById('tvHeartbeatLog').style.display = 'none';
        this.renderVersionToUI();
      },

      startTvStandbyMode() {
        SoundFx.init();
        SoundFx.playTone(440, 'sine', 0.05, 0, 0.001);

        this.isTvStandby = true;
        this.lastHandledTriggerTime = Date.now();
        document.getElementById('gatePasswordInput').disabled = true;
        document.getElementById('btnTvModeStandby').innerText = "🟢 電腦投影待命中 (雙軌通訊防禦中)";
        document.getElementById('btnTvModeStandby').disabled = true;
        document.getElementById('gateSubTitle').innerText = "🖥️ 大門待命中...手機發送廣播後將自動拉開揭榜";

        const logElem = document.getElementById('tvHeartbeatLog');
        logElem.style.display = 'block';
        logElem.innerText = `🟢 電腦大門待命中 | 雙軌備援就緒 (${CONFIG.VERSION})`;

        if (this.mqttClient && this.mqttClient.connected) {
          this.mqttClient.publish(CONFIG.MQTT_TOPIC, JSON.stringify({ action: 'TV_HEARTBEAT', t: Date.now() }), { qos: 1 });
        }
        this.startTvPollingLoop();
      },

      // 🌟 廣播投影執行：支援特定週次同步揭榜
      executeRemoteReveal(targetClass, targetPeriod, targetWeek) {
        if (targetClass) this.currentClass = targetClass;
        if (targetPeriod) this.rankingPeriod = targetPeriod;
        if (targetWeek) this.selectedLeaderboardWeek = targetWeek;

        this.renderAllClassTabs();
        this.updateLeaderboardSelectValue();
        const weekSel = document.getElementById('leaderboardWeekSelect');
        if (weekSel) weekSel.value = this.selectedLeaderboardWeek;

        this.loadLeaderboardData();

        document.body.classList.add('tv-theater-mode');
        document.getElementById('appHeader').classList.remove('authorized');

        SoundFx.playGateOpen();
        const gate = document.getElementById('view-gate');
        gate.classList.add('door-opening');

        setTimeout(() => {
          document.querySelectorAll('.view-panel').forEach(p => {
            p.classList.remove('active');
            p.style.display = 'none';
          });

          const lbView = document.getElementById('view-leaderboard');
          lbView.classList.add('active');
          lbView.style.display = 'flex';
          gate.classList.remove('door-opening');
          
          setTimeout(() => {
            this.startRevealTheater();
          }, 300);
        }, 1100);
      },

      executeRemoteClose() {
        SoundFx.playGateClose();
        
        const gate = document.getElementById('view-gate');
        gate.classList.add('active');
        gate.style.display = 'flex';
        gate.classList.add('door-opening');

        setTimeout(() => {
          gate.classList.remove('door-opening');
          const lb = document.getElementById('view-leaderboard');
          lb.classList.remove('active');
          lb.style.display = 'none';
          document.body.classList.remove('tv-theater-mode');
          document.getElementById('gateSubTitle').innerText = "🖥️ 大門已重新閉合，等待下一班廣播...";
        }, 50);
      },

      broadcastRevealSignal() {
        const now = Date.now();
        const triggerPayload = {
          action: 'REVEAL',
          classId: this.currentClass,
          period: this.rankingPeriod,
          weekKey: this.selectedLeaderboardWeek,
          t: now,
          timestamp: now
        };

        if (this.mqttClient && this.mqttClient.connected) {
          this.mqttClient.publish(CONFIG.MQTT_TOPIC, JSON.stringify(triggerPayload), { qos: 1 });
        }

        if (CONFIG.GAS_API_URL && !CONFIG.GAS_API_URL.includes("SAMPLE")) {
          fetch(CONFIG.GAS_API_URL, {
            method: 'POST',
            mode: 'cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({
              action: 'set_remote_trigger',
              triggerData: triggerPayload
            })
          }).catch(e => console.warn('備援通道廣播靜默發送中', e));
        }

        if (navigator.vibrate) navigator.vibrate(25);
        this.loadLeaderboardData();
        document.getElementById('podiumCol1').classList.add('reveal');
        document.getElementById('podiumCol2').classList.add('reveal');
        document.getElementById('podiumCol3').classList.add('reveal');
        document.querySelectorAll('.tier-card').forEach(c => c.classList.add('reveal'));
        document.getElementById('rosterParchmentSheet').classList.add('active-show');

        alert(`📢 雙軌廣播送出！電腦大螢幕即刻開門揭榜！\n班級：${this.currentClass}\n榜別：${this.rankingPeriod === 'weekly' ? `【${this.selectedLeaderboardWeek}排行榜】` : '【總排行榜】'}`);
      },

      broadcastCloseSignal() {
        const now = Date.now();
        const triggerPayload = { action: 'CLOSE', t: now, timestamp: now };

        if (this.mqttClient && this.mqttClient.connected) {
          this.mqttClient.publish(CONFIG.MQTT_TOPIC, JSON.stringify(triggerPayload), { qos: 1 });
        }

        if (CONFIG.GAS_API_URL && !CONFIG.GAS_API_URL.includes("SAMPLE")) {
          fetch(CONFIG.GAS_API_URL, {
            method: 'POST',
            mode: 'cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({
              action: 'set_remote_trigger',
              triggerData: triggerPayload
            })
          }).catch(e => console.warn('關門備援通道送出', e));
        }

        if (navigator.vibrate) navigator.vibrate([20, 50, 20]);
        alert('🚪 已命令電腦大門向內閉合，進入待命狀態！');
      },

      switchView(viewKey) {
        if (!this.sessionUnlocked && viewKey !== 'gate' && !this.isTvStandby) return;

        if (this.notesDirty && viewKey !== 'workspace') {
          this.saveCurrentNotes(false);
        }

        document.querySelectorAll('.view-panel').forEach(p => {
          p.classList.remove('active');
          p.style.display = 'none';
        });
        document.querySelectorAll('.btn-nav-magic').forEach(b => b.classList.remove('active'));

        let target = null;
        if (viewKey === 'workspace') {
          target = document.getElementById('view-workspace');
          document.getElementById('navBtnWorkspace').classList.add('active');
          this.renderStudentCards();
          this.updateSyncUI();
          if (!this.isNotesEditMode && !this.notesDirty) {
            this.initNotesUnitSelector();
          }
        } else if (viewKey === 'leaderboard') {
          target = document.getElementById('view-leaderboard');
          document.getElementById('navBtnLeaderboard').classList.add('active');
          this.initLeaderboardWeekSelector();
          this.loadLeaderboardData();
          document.getElementById('podiumCol1').classList.add('reveal');
          document.getElementById('podiumCol2').classList.add('reveal');
          document.getElementById('podiumCol3').classList.add('reveal');
          document.querySelectorAll('.tier-card').forEach(c => c.classList.add('reveal'));
          document.getElementById('rosterParchmentSheet').classList.add('active-show');
        } else if (viewKey === 'roster') {
          target = document.getElementById('view-roster-manager');
          document.getElementById('navBtnRoster').classList.add('active');
          this.renderAllClassTabs();
          this.loadRosterManagerText();
        }

        if (target) {
          target.classList.add('active');
          target.style.display = 'flex';
        }
      },

      switchPhoneMode(mode) {
        const scoringCol = document.getElementById('scoringColumn');
        const notesCol = document.getElementById('notesColumn');
        const btnScore = document.getElementById('btnPhoneScoring');
        const btnNotes = document.getElementById('btnPhoneNotes');

        if (mode === 'scoring') {
          scoringCol.style.display = 'flex';
          notesCol.classList.remove('phone-active');
          btnScore.classList.add('active');
          btnNotes.classList.remove('active');
        } else {
          scoringCol.style.display = 'none';
          notesCol.classList.add('phone-active');
          btnNotes.classList.add('active');
          btnScore.classList.remove('active');
          this.scrollToProgressMarker();
        }
      },

      loadStorageData() {
        const raw = localStorage.getItem('magic_academy_store_v260') || localStorage.getItem('magic_academy_store_v250');
        if (raw) {
          try {
            const parsed = JSON.parse(raw);
            if (parsed && parsed.classes && parsed.classes.length > 0) {
              this.data = parsed;
              this.currentClass = this.data.classes[0];
              return;
            }
          } catch (e) {}
        }
        this.data.classes = [];
        this.data.students = [];
        this.currentClass = "";
      },

      saveStorageData() {
        localStorage.setItem('magic_academy_store_v260', JSON.stringify(this.data));
      },

      // 🌟 方案 A：點擊橫幅週次標籤，彈出選單切換或新增自訂週次
      promptSelectOrEditWeek() {
        const current = this.data.currentWeekKey || "第1週";
        const all = this.data.allWeekKeys || ["第1週"];

        let menuText = `【切換或編輯教學週次】\n目前為：${current}\n\n現有週次選項：\n`;
        all.forEach((w, idx) => {
          menuText += `${idx + 1}. ${w}\n`;
        });
        menuText += `\n• 輸入序號直接切換 (例如輸入 1)\n• 或直接輸入全新週次名稱 (例如: 第3週 或 期中考週)：`;

        const input = prompt(menuText, current);
        if (!input) return;

        const trimmed = input.trim();
        const numChoice = parseInt(trimmed, 10);
        let selectedWeek = trimmed;

        if (!isNaN(numChoice) && numChoice >= 1 && numChoice <= all.length) {
          selectedWeek = all[numChoice - 1];
        } else {
          selectedWeek = trimmed.replace('周', '週');
        }

        if (!all.includes(selectedWeek)) {
          all.push(selectedWeek);
        }

        this.data.currentWeekKey = selectedWeek;
        this.saveStorageData();
        this.updateBannerWeekTagUI();
        this.renderStudentCards();
        this.updateSyncUI();
        this.initLeaderboardWeekSelector();

        // 同步記住當前週次至試算表 Config
        if (CONFIG.GAS_API_URL && !CONFIG.GAS_API_URL.includes("SAMPLE")) {
          fetch(CONFIG.GAS_API_URL, {
            method: 'POST',
            mode: 'cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({ action: 'save_current_week', weekKey: selectedWeek })
          }).catch(e => console.warn('週次設定雲端記住暫緩', e));
        }
      },

      renderAllClassTabs() {
        const bars = [document.getElementById('classTabBar'), document.getElementById('rosterTabBar')];
        bars.forEach(bar => {
          if (!bar) return;
          bar.innerHTML = "";
          
          if (!this.data.classes || this.data.classes.length === 0) {
            const emptyHint = document.createElement('span');
            emptyHint.style.color = '#7f8c8d';
            emptyHint.style.fontSize = '0.85rem';
            emptyHint.style.padding = '4px 8px';
            emptyHint.innerText = '讀取班級中...';
            bar.appendChild(emptyHint);
            return;
          }

          if (!this.currentClass || !this.data.classes.includes(this.currentClass)) {
            this.currentClass = this.data.classes[0];
          }

          this.data.classes.forEach(c => {
            const pill = document.createElement('button');
            pill.className = `class-tab-pill ${c === this.currentClass ? 'active' : ''}`;
            
            const hasUnsettled = this.hasUnsettledInClass(c);
            pill.innerText = `${c} 班${hasUnsettled ? ' •' : ''}`;
            pill.draggable = true;
            pill.dataset.classId = c;

            pill.ondragstart = (e) => {
              this.draggedClassId = c;
              e.dataTransfer.setData('text/plain', c);
            };
            pill.ondragover = (e) => {
              e.preventDefault();
              pill.classList.add('drag-over');
            };
            pill.ondragleave = () => {
              pill.classList.remove('drag-over');
            };
            pill.ondrop = (e) => {
              e.preventDefault();
              pill.classList.remove('drag-over');
              const targetClassId = c;
              if (this.draggedClassId && this.draggedClassId !== targetClassId) {
                this.reorderClasses(this.draggedClassId, targetClassId);
              }
            };

            pill.onclick = () => {
              if (this.notesDirty) {
                this.saveCurrentNotes(false);
              }
              this.currentClass = c;
              this.renderAllClassTabs();
              this.renderStudentCards();
              this.initNotesUnitSelector();
              this.loadRosterManagerText();
              this.updateLeaderboardSelectValue();
              this.loadLeaderboardData();
              this.updateSyncUI();

              if (this.mqttClient && this.mqttClient.connected) {
                this.mqttClient.publish(CONFIG.MQTT_TOPIC, JSON.stringify({
                  action: 'SYNC_CLASS',
                  classId: this.currentClass,
                  t: Date.now()
                }), { qos: 1 });
              }
            };

            bar.appendChild(pill);
          });

          const addBtn = document.createElement('button');
          addBtn.className = "btn-add-class-pill";
          addBtn.innerText = "➕ 新增班級";
          addBtn.onclick = () => this.promptAddNewClass();
          bar.appendChild(addBtn);
        });

        const titleElem = document.getElementById('rosterTargetClassTitle');
        if (titleElem) titleElem.innerText = `【${this.currentClass || '班級'}】名冊管理`;
      },

      reorderClasses(fromId, toId) {
        const fromIdx = this.data.classes.indexOf(fromId);
        const toIdx = this.data.classes.indexOf(toId);
        if (fromIdx === -1 || toIdx === -1) return;

        this.data.classes.splice(fromIdx, 1);
        this.data.classes.splice(toIdx, 0, fromId);

        this.saveStorageData();
        this.renderAllClassTabs();
        this.populateLeaderboardSelect();

        if (CONFIG.GAS_API_URL && !CONFIG.GAS_API_URL.includes("SAMPLE")) {
          fetch(CONFIG.GAS_API_URL, {
            method: 'POST',
            mode: 'cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({ action: 'reorder_sheets', order: this.data.classes })
          }).catch(err => console.warn('分頁排序同步延遲', err));
        }
      },

      /*
      ======================================================================
      備課筆記模組
      ======================================================================
      */
      initNotesUnitSelector() {
        const sel = document.getElementById('notesUnitSelect');
        if (!sel || !this.currentClass) return;
        sel.innerHTML = "";

        const classNotes = this.data.notes.filter(n => n.classId === this.currentClass);
        if (classNotes.length === 0) {
          const defaultNote = {
            classId: this.currentClass,
            noteId: `${this.currentClass}_${Date.now()}`,
            dateTitle: `${new Date().toISOString().split('T')[0]} (首堂課)`,
            content: '<div><b>📌 今日任務：</b></div><ul><li>新學期重點介紹</li><li>魔杖持握實操</li></ul>'
          };
          this.data.notes.push(defaultNote);
          this.saveStorageData();
          classNotes.push(defaultNote);
        }

        classNotes.forEach((n) => {
          const opt = document.createElement('option');
          opt.value = n.noteId;
          opt.innerText = n.dateTitle;
          sel.appendChild(opt);
        });

        this.activeNoteId = classNotes[0].noteId;
        sel.value = this.activeNoteId;
        this.renderActiveNoteContent();
      },

      renderActiveNoteContent() {
        const note = this.data.notes.find(n => n.noteId === this.activeNoteId);
        const editor = document.getElementById('notesEditor');
        if (editor && note) {
          editor.innerHTML = note.content;
          this.notesDirty = false;
          setTimeout(() => this.scrollToProgressMarker(), 250);
        }
      },

      initNotesPasteInterceptor() {
        const editor = document.getElementById('notesEditor');
        if (!editor) return;

        editor.addEventListener('paste', (e) => {
          if (!this.isNotesEditMode) return;
          e.preventDefault();

          let text = (e.clipboardData || window.clipboardData).getData('text/plain');
          if (!text) return;

          const lines = text.split(/\r?\n/);
          let cleanHtml = '';
          lines.forEach(line => {
            const trimmed = line.trim();
            if (trimmed) {
              const safeText = trimmed.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
              cleanHtml += `<div>${safeText}</div>`;
            } else {
              cleanHtml += `<div><br></div>`;
            }
          });

          document.execCommand('insertHTML', false, cleanHtml);
          this.triggerNoteAutoSavePipeline();
        });

        editor.addEventListener('input', () => {
          this.triggerNoteAutoSavePipeline();
        });
      },

      triggerNoteAutoSavePipeline() {
        this.notesDirty = true;
        const pill = document.getElementById('noteAutoSavePill');
        if (pill) {
          pill.style.display = 'none';
        }

        clearTimeout(this.noteAutoSaveTimer);
        this.noteAutoSaveTimer = setTimeout(() => {
          this.saveCurrentNotes(true);
        }, CONFIG.NOTE_AUTO_SAVE_DELAY);
      },

      scrollToProgressMarker() {
        const editor = document.getElementById('notesEditor');
        if (!editor) return;
        const marker = editor.querySelector('.magic-progress-marker');
        if (marker) {
          marker.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      },

      insertProgressBookmark() {
        const editor = document.getElementById('notesEditor');
        if (!editor) return;

        const oldMarkers = editor.querySelectorAll('.magic-progress-marker');
        oldMarkers.forEach(el => {
          const badge = el.querySelector('.magic-progress-badge');
          if (badge) badge.remove();
          const parent = el.parentNode;
          while (el.firstChild) parent.insertBefore(el.firstChild, el);
          el.remove();
        });

        const selection = window.getSelection();
        if (!selection || !selection.rangeCount) {
          alert('請先在筆記中點選您教到的段落位置！');
          return;
        }

        const range = selection.getRangeAt(0);
        const markerSpan = document.createElement('span');
        markerSpan.className = 'magic-progress-marker';
        markerSpan.innerHTML = `<span class="magic-progress-badge">📍 進度</span>`;

        try {
          if (!range.collapsed) {
            markerSpan.appendChild(range.extractContents());
          }
          range.insertNode(markerSpan);
          selection.removeAllRanges();
          this.triggerNoteAutoSavePipeline();
        } catch (e) {
          alert('標記插入失敗，請在段落文字內重新選取位置！');
        }
      },

      onUnitChange() {
        if (this.notesDirty) {
          this.saveCurrentNotes(false);
        }
        this.activeNoteId = document.getElementById('notesUnitSelect').value;
        this.renderActiveNoteContent();
      },

      promptAddUnit() {
        const today = new Date().toISOString().split('T')[0];
        const title = prompt("請輸入新課程單元與日期標題：", `${today} (第${this.data.notes.filter(n => n.classId === this.currentClass).length + 1}單元)`);
        if (!title) return;

        const newNote = {
          classId: this.currentClass,
          noteId: `${this.currentClass}_${Date.now()}`,
          dateTitle: title.trim(),
          content: '<div><b>📌 本單元重點：</b></div><ul><li>任務 1：</li></ul>'
        };

        this.data.notes.unshift(newNote);
        this.saveStorageData();
        this.initNotesUnitSelector();
        this.activeNoteId = newNote.noteId;
        document.getElementById('notesUnitSelect').value = newNote.noteId;
        this.renderActiveNoteContent();
        this.saveCurrentNotes(false);
      },

      promptRenameUnit() {
        const note = this.data.notes.find(n => n.noteId === this.activeNoteId);
        if (!note) return;
        const newTitle = prompt("修改目前單元名稱：", note.dateTitle);
        if (!newTitle || newTitle.trim() === note.dateTitle) return;

        note.dateTitle = newTitle.trim();
        this.saveStorageData();
        this.initNotesUnitSelector();
        document.getElementById('notesUnitSelect').value = note.noteId;
        this.saveCurrentNotes(false);
      },

      promptArchiveUnit() {
        const classNotes = this.data.notes.filter(n => n.classId === this.currentClass);
        if (classNotes.length <= 1) {
          alert('本班至少需保留一個單元，無法全數刪除！');
          return;
        }

        const note = this.data.notes.find(n => n.noteId === this.activeNoteId);
        if (!confirm(`確定要刪除/封存【${note.dateTitle}】嗎？\n（Google 試算表端將安全標記隱藏）`)) return;

        const deletedId = this.activeNoteId;
        this.data.notes = this.data.notes.filter(n => n.noteId !== deletedId);
        this.saveStorageData();
        this.initNotesUnitSelector();

        if (CONFIG.GAS_API_URL && !CONFIG.GAS_API_URL.includes("SAMPLE")) {
          fetch(CONFIG.GAS_API_URL, {
            method: 'POST',
            mode: 'cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({ action: 'archive_note', data: { noteId: deletedId } })
          }).catch(e => console.warn('筆記封存同步延遲', e));
        }
      },

      toggleNotesMode() {
        this.isNotesEditMode = !this.isNotesEditMode;
        const btn = document.getElementById('btnNotesMode');
        const tb = document.getElementById('wysiwygToolbar');
        const editor = document.getElementById('notesEditor');
        const pill = document.getElementById('noteAutoSavePill');

        if (this.isNotesEditMode) {
          btn.innerText = "✏️ 編輯中";
          btn.classList.add('edit-mode');
          tb.classList.add('active');
          editor.contentEditable = "true";
          editor.classList.remove('readonly');
        } else {
          if (this.notesDirty) {
            this.saveCurrentNotes(false);
          }
          btn.innerText = "📖 閱讀中";
          btn.classList.remove('edit-mode');
          tb.classList.remove('active');
          editor.contentEditable = "false";
          editor.classList.add('readonly');
          if (pill) pill.style.display = 'none';
          this.scrollToProgressMarker();
        }
      },

      async saveCurrentNotes(isSilent = false) {
        clearTimeout(this.noteAutoSaveTimer);
        const editor = document.getElementById('notesEditor');
        const note = this.data.notes.find(n => n.noteId === this.activeNoteId);
        if (!note || !editor) return;

        note.content = editor.innerHTML;
        this.notesDirty = false;
        this.saveStorageData();

        const pill = document.getElementById('noteAutoSavePill');
        if (isSilent && pill) {
          pill.style.display = 'inline-flex';
          setTimeout(() => {
            if (!this.notesDirty) pill.style.display = 'none';
          }, 3500);
        } else if (!isSilent) {
          alert('✨ 備課筆記已成功存檔！');
        }

        if (CONFIG.GAS_API_URL && !CONFIG.GAS_API_URL.includes("SAMPLE")) {
          try {
            await fetch(CONFIG.GAS_API_URL, {
              method: 'POST',
              mode: 'cors',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify({
                action: 'save_notes',
                data: {
                  classId: this.currentClass,
                  noteId: note.noteId,
                  dateTitle: note.dateTitle,
                  content: note.content
                }
              })
            });
          } catch (e) {
            console.warn('筆記雲端同步延遲', e);
          }
        }
      },

      openCopyToClassModal() {
        const note = this.data.notes.find(n => n.noteId === this.activeNoteId);
        if (!note) return;

        const overlay = document.getElementById('copyDialogOverlay');
        const titleInput = document.getElementById('copyTargetTitleInput');
        const cbContainer = document.getElementById('copyClassCheckboxes');

        titleInput.value = note.dateTitle;
        cbContainer.innerHTML = "";

        const otherClasses = this.data.classes.filter(c => c !== this.currentClass);
        if (otherClasses.length === 0) {
          alert('目前系統僅有單一班級，無需另存至其他班級！');
          return;
        }

        otherClasses.forEach(cid => {
          const label = document.createElement('label');
          label.className = 'copy-class-item';
          label.innerHTML = `
            <input type="checkbox" name="targetClass" value="${cid}" checked>
            <span>【${cid} 班】</span>
          `;
          cbContainer.appendChild(label);
        });

        overlay.style.display = 'flex';
      },

      closeCopyToClassModal() {
        document.getElementById('copyDialogOverlay').style.display = 'none';
      },

      toggleSelectAllCopyClasses() {
        const cbs = document.querySelectorAll('input[name="targetClass"]');
        const allChecked = Array.from(cbs).every(cb => cb.checked);
        cbs.forEach(cb => cb.checked = !allChecked);
      },

      async executeCopyToClasses() {
        const currentNote = this.data.notes.find(n => n.noteId === this.activeNoteId);
        if (!currentNote) return;

        const newTitle = document.getElementById('copyTargetTitleInput').value.trim();
        if (!newTitle) {
          alert('單元標題不可為空！');
          return;
        }

        const selectedClasses = Array.from(document.querySelectorAll('input[name="targetClass"]:checked')).map(cb => cb.value);
        if (selectedClasses.length === 0) {
          alert('請至少勾選一個目標班級！');
          return;
        }

        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = document.getElementById('notesEditor').innerHTML;
        const markers = tempDiv.querySelectorAll('.magic-progress-marker');
        markers.forEach(el => {
          const badge = el.querySelector('.magic-progress-badge');
          if (badge) badge.remove();
          const parent = el.parentNode;
          while (el.firstChild) parent.insertBefore(el.firstChild, el);
          el.remove();
        });
        const cleanContent = tempDiv.innerHTML;

        const notesToSaveCloud = [];
        let successCount = 0;

        for (const cid of selectedClasses) {
          const existing = this.data.notes.find(n => n.classId === cid && n.dateTitle === newTitle);
          if (existing) {
            const overwrite = confirm(`⚠️ 【${cid} 班】已存在同名單元「${newTitle}」！\n是否確認覆蓋原筆記？\n（點選【取消】將跳過此班）`);
            if (!overwrite) continue;
            existing.content = cleanContent;
            notesToSaveCloud.push(existing);
            successCount++;
          } else {
            const newNoteObj = {
              classId: cid,
              noteId: `${cid}_${Date.now()}_${Math.random().toString(36).substring(2,6)}`,
              dateTitle: newTitle,
              content: cleanContent
            };
            this.data.notes.unshift(newNoteObj);
            notesToSaveCloud.push(newNoteObj);
            successCount++;
          }
        }

        this.saveStorageData();
        this.closeCopyToClassModal();

        alert(`✨ 成功將筆記派發至 ${successCount} 個班級！已自動清除進度標記為純淨副本。`);

        if (CONFIG.GAS_API_URL && !CONFIG.GAS_API_URL.includes("SAMPLE")) {
          fetch(CONFIG.GAS_API_URL, {
            method: 'POST',
            mode: 'cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({
              action: 'batch_save_notes',
              notesList: notesToSaveCloud
            })
          }).catch(e => console.warn('批次另存雲端同步延遲', e));
        }
      },

      buildColorPalettes() {
        const textGrid = document.getElementById('textColorDropdown');
        const bgGrid = document.getElementById('bgColorDropdown');
        if (!textGrid || !bgGrid) return;

        textGrid.innerHTML = "";
        bgGrid.innerHTML = "";

        PALETTE_COLORS.forEach(c => {
          const sw = document.createElement('div');
          sw.className = 'color-swatch';
          sw.style.backgroundColor = c;
          sw.title = c;
          sw.onclick = () => {
            document.execCommand('foreColor', false, c);
            textGrid.classList.remove('show');
            this.triggerNoteAutoSavePipeline();
          };
          textGrid.appendChild(sw);
        });

        PALETTE_BG_COLORS.forEach(c => {
          const sw = document.createElement('div');
          sw.className = 'color-swatch';
          sw.style.backgroundColor = c;
          sw.title = c;
          sw.onclick = () => {
            document.execCommand('hiliteColor', false, c);
            bgGrid.classList.remove('show');
            this.triggerNoteAutoSavePipeline();
          };
          bgGrid.appendChild(sw);
        });
      },

      togglePalette(id) {
        const el = document.getElementById(id);
        if (el) el.classList.toggle('show');
      },

      applyFontSize(size) {
        document.execCommand('fontSize', false, '7');
        const fontElements = document.getElementsByTagName('font');
        for (let i = 0; i < fontElements.length; i++) {
          if (fontElements[i].size === '7') {
            fontElements[i].removeAttribute('size');
            fontElements[i].style.fontSize = size;
          }
        }
        this.triggerNoteAutoSavePipeline();
      },

      initTabKeyNesting() {
        const editor = document.getElementById('notesEditor');
        if (!editor) return;

        editor.addEventListener('keydown', (e) => {
          if (e.key === 'Tab') {
            e.preventDefault();
            if (e.shiftKey) {
              document.execCommand('outdent');
            } else {
              document.execCommand('indent');
            }
            this.triggerNoteAutoSavePipeline();
          }
        });

        document.addEventListener('click', (e) => {
          if (!e.target.closest('.palette-popover')) {
            document.querySelectorAll('.palette-dropdown').forEach(p => p.classList.remove('show'));
          }
        });
      },

      /*
      ======================================================================
      排行榜邏輯 (週榜預設前一週 + 嚴格公式：當週得分 + WeeklyBonus)
      ======================================================================
      */
      populateLeaderboardSelect() {
        const sel = document.getElementById('leaderboardClassSelect');
        if (!sel) return;
        sel.innerHTML = "";
        this.data.classes.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c;
          opt.innerText = `${c} 班`;
          sel.appendChild(opt);
        });
        this.updateLeaderboardSelectValue();
      },

      updateLeaderboardSelectValue() {
        const sel = document.getElementById('leaderboardClassSelect');
        if (sel) sel.value = this.currentClass;
      },

      initLeaderboardWeekSelector() {
        const sel = document.getElementById('leaderboardWeekSelect');
        if (!sel) return;
        sel.innerHTML = "";

        const allWeeks = this.data.allWeekKeys || ["第1週"];
        
        // 🌟 預設顯示【前一週】榜單 (若為第1週則顯示第1週)
        const currentIdx = allWeeks.indexOf(this.data.currentWeekKey || "第1週");
        let defaultWeek = this.data.currentWeekKey || "第1週";
        if (currentIdx > 0) {
          defaultWeek = allWeeks[currentIdx - 1]; // 前一週
        } else if (allWeeks.length > 1) {
          defaultWeek = allWeeks[0];
        }
        this.selectedLeaderboardWeek = defaultWeek;

        allWeeks.forEach(w => {
          const opt = document.createElement('option');
          opt.value = w;
          opt.innerText = (w === this.data.currentWeekKey) ? `${w} (當週進行中)` : `${w} (結算榜)`;
          sel.appendChild(opt);
        });

        sel.value = this.selectedLeaderboardWeek;
      },

      onLeaderboardClassChange() {
        this.currentClass = document.getElementById('leaderboardClassSelect').value;
        this.renderAllClassTabs();
        this.loadLeaderboardData();

        if (this.mqttClient && this.mqttClient.connected) {
          this.mqttClient.publish(CONFIG.MQTT_TOPIC, JSON.stringify({
            action: 'SYNC_CLASS',
            classId: this.currentClass,
            t: Date.now()
          }), { qos: 1 });
        }
      },

      onLeaderboardWeekChange() {
        this.selectedLeaderboardWeek = document.getElementById('leaderboardWeekSelect').value;
        this.loadLeaderboardData();

        if (this.mqttClient && this.mqttClient.connected) {
          this.mqttClient.publish(CONFIG.MQTT_TOPIC, JSON.stringify({
            action: 'SYNC_PERIOD',
            period: this.rankingPeriod,
            weekKey: this.selectedLeaderboardWeek,
            t: Date.now()
          }), { qos: 1 });
        }
      },

      toggleRankingPeriod() {
        this.rankingPeriod = (this.rankingPeriod === 'weekly') ? 'total' : 'weekly';
        const btn = document.getElementById('btnToggleRankingType');
        const weekSel = document.getElementById('leaderboardWeekSelect');
        
        if (btn) {
          btn.innerText = `目前為:【${this.rankingPeriod === 'weekly' ? '週排行榜' : '總排行榜'}】`;
        }
        if (weekSel) {
          weekSel.style.display = (this.rankingPeriod === 'weekly') ? 'inline-block' : 'none';
        }

        if (this.mqttClient && this.mqttClient.connected) {
          this.mqttClient.publish(CONFIG.MQTT_TOPIC, JSON.stringify({
            action: 'SYNC_PERIOD',
            period: this.rankingPeriod,
            weekKey: this.selectedLeaderboardWeek,
            t: Date.now()
          }), { qos: 1 });
        }

        this.loadLeaderboardData();
      },

      // 🌟 計算排名：週榜 = 該週課堂得分 + 幹部加分 (WeeklyBonus)
      computeRankedList() {
        const classStudents = this.data.students.filter(s => s.classId === this.currentClass);
        const isWeekly = (this.rankingPeriod === 'weekly');
        const targetWeek = this.selectedLeaderboardWeek || this.data.currentWeekKey || "第1週";

        const mapped = classStudents.map(st => {
          let score = 0;
          if (isWeekly) {
            const rawWeek = (st.weekScores && typeof st.weekScores[targetWeek] !== 'undefined') ? st.weekScores[targetWeek] : 0;
            const bonus = Number(st.weeklyBonus) || 0;
            // 若為當前正在進行的週次，也累加尚未結算的暫存分
            const localDelta = (targetWeek === this.data.currentWeekKey) ? this.getPartitionedScore(st.classId, targetWeek, st.seatNo) : 0;
            score = rawWeek + bonus + localDelta;
          } else {
            // 總分榜：試算表總分 + 當前週尚未結算的暫存分
            const localDelta = this.getPartitionedScore(st.classId, this.data.currentWeekKey, st.seatNo);
            score = (Number(st.totalScore) || 0) + localDelta;
          }

          return {
            ...st,
            computedScore: Math.floor(score)
          };
        });

        mapped.sort((a, b) => (b.computedScore - a.computedScore) || (a.seatNo - b.seatNo));

        let currentRank = 1;
        const rankedList = [];
        for (let i = 0; i < mapped.length; i++) {
          if (i > 0 && mapped[i].computedScore < mapped[i - 1].computedScore) {
            currentRank = i + 1;
          }
          rankedList.push({
            ...mapped[i],
            rank: currentRank
          });
        }
        return rankedList;
      },

      loadLeaderboardData() {
        const rankedList = this.computeRankedList();
        const top1List = rankedList.filter(s => s.rank === 1);
        const top2List = rankedList.filter(s => s.rank === 2);
        const top3List = rankedList.filter(s => s.rank === 3);

        const s1Name = top1List.map(s => s.name).join('、') || '無';
        const s1Score = top1List[0] ? `${top1List[0].computedScore} 分` : '-- 分';
        const s2Name = top2List.map(s => s.name).join('、') || '無';
        const s2Score = top2List[0] ? `${top2List[0].computedScore} 分` : '-- 分';
        const s3Name = top3List.map(s => s.name).join('、') || '無';
        const s3Score = top3List[0] ? `${top3List[0].computedScore} 分` : '-- 分';

        document.getElementById('podiumName1').innerText = s1Name;
        document.getElementById('podiumScore1').innerText = s1Score;
        document.getElementById('podiumName2').innerText = s2Name;
        document.getElementById('podiumScore2').innerText = s2Score;
        document.getElementById('podiumName3').innerText = s3Name;
        document.getElementById('podiumScore3').innerText = s3Score;

        const tierBar = document.getElementById('top10TierBar');
        tierBar.innerHTML = "";

        if (this.rankingPeriod === 'total') {
          tierBar.classList.add('active');
          const tierStudents = rankedList.filter(s => s.rank >= 4 && s.rank <= 10);

          tierStudents.forEach((st) => {
            const card = document.createElement('div');
            card.className = "tier-card";
            card.id = `tierCard_${st.seatNo}`;
            card.dataset.rank = st.rank;
            card.innerHTML = `
              <div class="tier-rank">第 ${st.rank} 名</div>
              <div class="tier-name">${st.name}</div>
              <div class="tier-score">${st.computedScore} 分</div>
            `;
            tierBar.appendChild(card);
          });
        } else {
          tierBar.classList.remove('active');
        }

        const rankMap = new Map();
        rankedList.forEach(st => rankMap.set(st.seatNo, st.rank));

        const rosterGrid = document.getElementById('rosterSheetGrid');
        rosterGrid.innerHTML = "";
        const seatSorted = [...this.data.students.filter(s => s.classId === this.currentClass)].sort((a, b) => a.seatNo - b.seatNo);

        seatSorted.forEach(st => {
          const matchedRanked = rankedList.find(r => r.seatNo === st.seatNo);
          const displayScore = matchedRanked ? matchedRanked.computedScore : 0;
          const card = document.createElement('div');
          card.className = "roster-sheet-card";
          card.innerHTML = `
            <div class="card-row-top">
              <span class="card-seat-num">#${st.seatNo}</span>
              <span class="card-name-text">${st.name}</span>
            </div>
            <div class="card-row-bottom">
              <span class="card-score-text">${displayScore} 分</span>
              <span class="card-rank-text">第 ${rankMap.get(st.seatNo) || '--'} 名</span>
            </div>
          `;
          rosterGrid.appendChild(card);
        });

        const sheetTitle = document.getElementById('rosterSheetTitle');
        if (sheetTitle) {
          sheetTitle.innerText = (this.rankingPeriod === 'weekly') 
            ? `【${this.selectedLeaderboardWeek}】全班成績名冊 (週得分+幹部加分)` 
            : `全班學員總成績名冊 (總分累積)`;
        }
      },

      /*
      ======================================================================
      計分卡片渲染 (分區隔離緩衝區・切換週次原記錄不受影響)
      ======================================================================
      */
      getPartitionKey(classId, weekKey, seatNo) {
        return `${classId}_${weekKey}_${seatNo}`;
      },

      getPartitionedScore(classId, weekKey, seatNo) {
        const k = this.getPartitionKey(classId, weekKey, seatNo);
        return Number(this.data.partitionedScores[k]) || 0;
      },

      setPartitionedScore(classId, weekKey, seatNo, val) {
        const k = this.getPartitionKey(classId, weekKey, seatNo);
        this.data.partitionedScores[k] = val;
      },

      hasUnsettledInClass(classId) {
        const prefix = `${classId}_`;
        for (const k in this.data.partitionedScores) {
          if (k.startsWith(prefix) && this.data.partitionedScores[k] !== 0) return true;
        }
        return false;
      },

      hasUnsettledInCurrent() {
        if (!this.currentClass) return false;
        const prefix = `${this.currentClass}_${this.data.currentWeekKey}_`;
        for (const k in this.data.partitionedScores) {
          if (k.startsWith(prefix) && this.data.partitionedScores[k] !== 0) return true;
        }
        return false;
      },

      renderStudentCards() {
        const grid = document.getElementById('studentGrid');
        if (!grid) return;
        grid.innerHTML = "";
        
        if (!this.currentClass) return;

        const currentList = this.data.students.filter(s => s.classId === this.currentClass);
        currentList.sort((a, b) => a.seatNo - b.seatNo);

        const currentWeek = this.data.currentWeekKey || "第1週";

        currentList.forEach(s => {
          const card = document.createElement('div');
          card.className = "student-touch-card";
          
          const bonusVal = Number(s.weeklyBonus) || 0;
          const hasBonus = bonusVal > 0;
          
          // 🌟 核心：精確取出目前班級、目前週次、該學生的隔離暫存得分
          const deltaScore = this.getPartitionedScore(s.classId, currentWeek, s.seatNo);
          const rawTotal = Number(s.totalScore) || 0;
          const displayTotal = rawTotal + deltaScore;

          card.innerHTML = `
            <span class="card-seat-tag">#${s.seatNo}</span>
            ${hasBonus ? `<span class="card-star-badge" title="幹部每週固定加分 +${bonusVal}">⭐+${bonusVal}</span>` : ''}
            <div class="card-student-name">${s.name}</div>
            <div class="card-score-value">${deltaScore >= 0 ? `+${deltaScore}` : deltaScore}</div>
            <div class="card-total-tag">總分: ${displayTotal}</div>
          `;

          card.onclick = () => {
            if (this.longPressFired) {
              this.longPressFired = false;
              return;
            }
            this.recordScore(s);
          };

          let pressTimer = null;
          const startPress = () => {
            this.longPressFired = false;
            pressTimer = setTimeout(() => {
              this.longPressFired = true;
              if (navigator.vibrate) navigator.vibrate(45);
              this.promptConfigureCadre(s);
            }, CONFIG.LONG_PRESS_THRESHOLD);
          };
          const cancelPress = () => {
            if (pressTimer) clearTimeout(pressTimer);
          };

          card.ontouchstart = startPress;
          card.ontouchend = cancelPress;
          card.ontouchcancel = cancelPress;
          card.onmousedown = startPress;
          card.onmouseup = cancelPress;
          card.onmouseleave = cancelPress;

          grid.appendChild(card);
        });
      },

      async promptConfigureCadre(student) {
        const currentBonus = Number(student.weeklyBonus) || 0;
        const input = prompt(
          `【設定幹部每週固定加分】\n學員：#${student.seatNo} ${student.name}\n\n` +
          `• 輸入點數（例如：3 代表每週一自動加 3 分）\n` +
          `• 輸入 0 或留白：取消幹部身份並移除星號\n\n目前設定點數：`,
          currentBonus
        );
        if (input === null) return;

        const bonusVal = parseInt(input.trim(), 10);
        const newBonus = isNaN(bonusVal) ? 0 : Math.max(0, bonusVal);
        const deltaBonus = newBonus - currentBonus;

        student.weeklyBonus = newBonus;
        student.totalScore = (Number(student.totalScore) || 0) + deltaBonus;

        this.saveStorageData();
        this.renderStudentCards();

        if (CONFIG.GAS_API_URL && !CONFIG.GAS_API_URL.includes("SAMPLE")) {
          fetch(CONFIG.GAS_API_URL, {
            method: 'POST',
            mode: 'cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({
              action: 'update_student_bonus',
              classId: this.currentClass,
              seatNo: student.seatNo,
              weeklyBonus: newBonus
            })
          }).catch(e => console.warn('幹部設定同步暫緩', e));
        }

        if (student.weeklyBonus > 0) {
          alert(`✨ 已成功設定【#${student.seatNo} ${student.name}】每週固定加 +${student.weeklyBonus} 分！卡片已標註星號 ⭐\n試算表公式與週排行榜將自動納入計算！`);
        } else {
          alert(`已取消【#${student.seatNo} ${student.name}】的幹部設定，星號已移除。`);
        }
      },

      selectWeight(val) {
        this.currentWeight = val;
        document.querySelectorAll('.weight-chip').forEach(btn => {
          btn.classList.toggle('active', btn.innerText === (val > 0 ? `+${val}` : `${val}`));
        });
      },

      // 🌟 給分操作：精準寫入當前班級與當前週次的分區緩衝區
      recordScore(student) {
        if (navigator.vibrate) navigator.vibrate(18);

        const currentWeek = this.data.currentWeekKey || "第1週";
        const currentDelta = this.getPartitionedScore(student.classId, currentWeek, student.seatNo);
        const newDelta = currentDelta + this.currentWeight;

        this.setPartitionedScore(student.classId, currentWeek, student.seatNo, newDelta);

        this.saveStorageData();
        this.renderStudentCards();
        this.updateSyncUI();
        this.renderAllClassTabs();
      },

      updateSyncUI() {
        const btn = document.getElementById('btnManualUpload');
        const hasUnsettledInCur = this.hasUnsettledInCurrent();
        const hasUnsettledGlobal = Object.values(this.data.partitionedScores).some(v => v !== 0);

        if (btn) {
          btn.innerText = `☁️ 結算${this.data.currentWeekKey}${hasUnsettledInCur ? '*' : ''}`;
          if (hasUnsettledInCur) {
            btn.classList.add('dirty-pulse');
          } else {
            btn.classList.remove('dirty-pulse');
          }
        }
        this.setSyncStatus(hasUnsettledGlobal ? 'pending' : 'synced');
      },

      // 🌟 方案 A 結算：只結算當前班級、當前目標週次的增量！成功後僅該週該班歸零
      async executeCurrentClassSettlement() {
        if (this.isSyncingNow || !this.currentClass) return;

        const currentWeek = this.data.currentWeekKey || "第1週";
        const currentClassStudents = this.data.students.filter(s => s.classId === this.currentClass);
        
        const modifiedList = [];
        currentClassStudents.forEach(st => {
          const delta = this.getPartitionedScore(st.classId, currentWeek, st.seatNo);
          if (delta !== 0) {
            modifiedList.push({
              seatNo: st.seatNo,
              name: st.name,
              deltaScore: delta
            });
          }
        });

        if (modifiedList.length === 0) {
          alert(`【${this.currentClass} 班】在【${currentWeek}】沒有未結算的加分紀錄！`);
          return;
        }

        const btn = document.getElementById('btnManualUpload');
        if (!CONFIG.GAS_API_URL || CONFIG.GAS_API_URL.includes("SAMPLE")) {
          alert("請先於代碼頂端 CONFIG 設定真實的 GAS 網址！");
          return;
        }

        this.isSyncingNow = true;
        if (btn) {
          btn.innerText = "⏳ 結算中...";
          btn.disabled = true;
        }
        this.setSyncStatus('pending');

        try {
          const payload = {
            action: 'settle_incremental_scores',
            classId: this.currentClass,
            incrementalList: modifiedList,
            weekKey: currentWeek
          };

          const response = await fetch(CONFIG.GAS_API_URL, {
            method: 'POST',
            mode: 'cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(payload)
          });

          const res = await response.json();
          if (res.status === 'success') {
            // 🌟 結算成功：僅將該班該週次的分區緩衝區歸零！其他週次與班級毫髮無傷！
            modifiedList.forEach(item => {
              this.setPartitionedScore(this.currentClass, currentWeek, item.seatNo, 0);
            });

            if (res.updatedStudents && res.updatedStudents.length > 0) {
              res.updatedStudents.forEach(us => {
                const target = currentClassStudents.find(cs => cs.seatNo === us.seatNo);
                if (target) {
                  if (!target.weekScores) target.weekScores = {};
                  target.weekScores[currentWeek] = us.weeklyScore;
                  if (us.totalScore) target.totalScore = us.totalScore;
                }
              });
            }

            this.saveStorageData();
            this.renderStudentCards();
            this.renderAllClassTabs();
            this.updateSyncUI();

            if (navigator.vibrate) navigator.vibrate([30, 50, 30]);

            if (btn) {
              btn.classList.remove('dirty-pulse');
              btn.classList.add('success-state');
              btn.innerText = `✔ ${currentWeek}已結算`;
              setTimeout(() => {
                btn.classList.remove('success-state');
                this.updateBannerWeekTagUI();
                btn.disabled = false;
              }, 3000);
            }
          } else {
            throw new Error(res.message || "雲端結算失敗");
          }
        } catch (err) {
          this.setSyncStatus('error');
          if (btn) {
            btn.innerText = "⚠️ 結算失敗";
            setTimeout(() => {
              this.updateBannerWeekTagUI();
              btn.disabled = false;
            }, 3000);
          }
          alert(`上傳結算未完成，請檢查網路連線！\n（請放心，【${this.currentClass} 班】在【${currentWeek}】的加分紀錄完整保留在本機，絕不遺失）`);
        } finally {
          this.isSyncingNow = false;
        }
      },

      loadRosterManagerText() {
        if (!this.currentClass) return;
        const list = this.data.students.filter(s => s.classId === this.currentClass);
        list.sort((a, b) => a.seatNo - b.seatNo);
        const lines = list.map(s => {
          const wScore = (s.weekScores && s.weekScores[this.data.currentWeekKey]) ? s.weekScores[this.data.currentWeekKey] : 0;
          return `${s.seatNo} ${s.name} ${s.totalScore} ${wScore}`;
        });
        const inputElem = document.getElementById('rosterBatchInput');
        if (inputElem) {
          inputElem.value = lines.join('\n');
        }
      },

      async applyBatchRoster() {
        const raw = document.getElementById('rosterBatchInput').value.trim();
        if (!raw || !this.currentClass) return;

        const lines = raw.split('\n');
        const parsed = [];
        
        lines.forEach(line => {
          const parts = line.trim().split(/[\t\s,]+/);
          if (parts.length >= 2) {
            const seat = parseInt(parts[0], 10);
            const name = parts[1];
            const total = parts.length >= 3 ? parseInt(parts[2], 10) : 0;
            const weekly = parts.length >= 4 ? parseInt(parts[3], 10) : 0;
            if (!isNaN(seat) && name) {
              const weekObj = {};
              weekObj[this.data.currentWeekKey || "第1週"] = isNaN(weekly) ? 0 : weekly;
              parsed.push({
                classId: this.currentClass,
                seatNo: seat,
                name: name,
                weeklyBonus: 0,
                baseScore: Math.max(0, total - weekly),
                totalScore: isNaN(total) ? 0 : total,
                weekScores: weekObj
              });
            }
          }
        });

        if (parsed.length === 0) {
          alert('名冊格式解析失敗，請確保每行有座號與姓名（例如：1 王小明 或 1 王小明 20 5）');
          return;
        }

        this.data.students = this.data.students.filter(s => s.classId !== this.currentClass).concat(parsed);
        this.saveStorageData();
        this.renderStudentCards();
        alert(`✨ ${this.currentClass} 班名冊更新成功，共 ${parsed.length} 位學員！正在同步至 Google 試算表...`);

        if (CONFIG.GAS_API_URL && !CONFIG.GAS_API_URL.includes("SAMPLE")) {
          try {
            const res = await fetch(CONFIG.GAS_API_URL, {
              method: 'POST',
              mode: 'cors',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify({
                action: 'update_roster',
                classId: this.currentClass,
                students: parsed
              })
            });
            const json = await res.json();
            if (json.status === 'success') {
              alert(`🟢 Google 試算表【${this.currentClass}】分頁已同步完成！`);
            }
          } catch (e) {
            console.warn("名冊雲端同步暫緩", e);
          }
        }
      },

      async promptAddNewClass() {
        const newClassId = prompt("請輸入新班級名稱代號（例如：302）：");
        if (!newClassId) return;
        const cleanId = newClassId.trim();

        if (this.data.classes.includes(cleanId)) {
          alert("該班級已存在！");
          return;
        }

        this.data.classes.push(cleanId);
        this.currentClass = cleanId;

        this.saveStorageData();
        this.renderAllClassTabs();
        this.populateLeaderboardSelect();
        this.initNotesUnitSelector();
        this.loadRosterManagerText();
        this.renderStudentCards();

        alert(`✨ 班級【${cleanId}】已於本機建立！請至名冊管理分頁貼上學生名冊。`);

        if (CONFIG.GAS_API_URL && !CONFIG.GAS_API_URL.includes("SAMPLE")) {
          try {
            await fetch(CONFIG.GAS_API_URL, {
              method: 'POST',
              mode: 'cors',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify({ action: 'create_class', classId: cleanId })
            });
          } catch (e) {
            console.warn("班級雲端建立延遲", e);
          }
        }
      },

      async promptDeleteCurrentClass() {
        if (this.data.classes.length <= 1) {
          alert("系統至少需保留一個班級，無法全數刪除！");
          return;
        }

        const isPermanent = confirm(
          `確定要移除【${this.currentClass} 班】嗎？\n\n` +
          `• 點選【確定】：安全隱藏封存（試算表更名為 _ARCHIVE_${this.currentClass}，保留歷史成績）\n` +
          `• 點選【取消】：放棄操作`
        );
        if (!isPermanent) return;

        const reallyPermanent = confirm(`【進階選項確認】\n是否要「永久徹底刪除」該試算表分頁？\n\n• 按【確定】= 永久徹底抹除\n• 按【取消】= 僅安全封存（推薦）`);

        const targetClass = this.currentClass;
        this.data.classes = this.data.classes.filter(c => c !== targetClass);
        this.data.students = this.data.students.filter(s => s.classId !== targetClass);
        this.data.notes = this.data.notes.filter(n => n.classId !== targetClass);
        this.currentClass = this.data.classes[0];

        this.saveStorageData();
        this.renderAllClassTabs();
        this.populateLeaderboardSelect();
        this.initNotesUnitSelector();
        this.loadRosterManagerText();
        this.renderStudentCards();

        alert(`已從系統移除【${targetClass} 班】！正在同步至 Google 試算表...`);

        if (CONFIG.GAS_API_URL && !CONFIG.GAS_API_URL.includes("SAMPLE")) {
          try {
            await fetch(CONFIG.GAS_API_URL, {
              method: 'POST',
              mode: 'cors',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify({
                action: 'delete_class',
                classId: targetClass,
                permanent: reallyPermanent
              })
            });
          } catch (e) {
            console.warn("班級雲端移除延遲", e);
          }
        }
      },

      // 🛡️ 鐵壁防護：安全拉取雲端各週數據，精確保留本機分區暫存
      async fetchCloudData(isSilent = false) {
        if (!CONFIG.GAS_API_URL || CONFIG.GAS_API_URL.includes("SAMPLE")) return;
        try {
          const res = await fetch(CONFIG.GAS_API_URL + "?action=fetch_all&t=" + Date.now());
          const json = await res.json();
          if (json.status === 'success' && json.classes && json.classes.length > 0) {
            if (this.data.classes.length === 0) {
              this.data.classes = json.classes;
              this.currentClass = this.data.classes[0];
            } else {
              json.classes.forEach(c => {
                if (!this.data.classes.includes(c)) this.data.classes.push(c);
              });
            }

            if (json.allWeekKeys && json.allWeekKeys.length > 0) {
              this.data.allWeekKeys = json.allWeekKeys;
            }
            if (json.currentWeekKey && !this.data.currentWeekKey) {
              this.data.currentWeekKey = json.currentWeekKey;
            }

            if (json.password) this.data.adminPassword = json.password;

            const cloudStudents = json.students || [];

            if (this.data.students.length === 0) {
              this.data.students = cloudStudents;
            } else {
              cloudStudents.forEach(cs => {
                const local = this.data.students.find(ls => ls.classId === cs.classId && ls.seatNo === cs.seatNo);
                if (local) {
                  local.weeklyBonus = cs.weeklyBonus || 0;
                  local.baseScore = cs.baseScore || 0;
                  local.totalScore = cs.totalScore || 0;
                  local.weekScores = cs.weekScores || {};
                } else {
                  this.data.students.push(cs);
                }
              });
            }

            this.sanitizeScores();

            if (!this.isNotesEditMode && !this.notesDirty) {
              if (json.notes && json.notes.length > 0) {
                this.data.notes = json.notes;
              }
            }

            this.saveStorageData();
            this.renderAllClassTabs();
            this.populateLeaderboardSelect();
            this.initLeaderboardWeekSelector();
            this.updateBannerWeekTagUI();

            if (document.getElementById('view-workspace').classList.contains('active')) {
              this.renderStudentCards();
              if (!this.isNotesEditMode && !this.notesDirty) {
                this.initNotesUnitSelector();
              }
            }
            if (document.getElementById('view-roster-manager').classList.contains('active')) {
              this.loadRosterManagerText();
            }
            if (document.getElementById('view-leaderboard').classList.contains('active') && !this.isTvStandby) {
              this.loadLeaderboardData();
            }
            this.updateSyncUI();
          }
        } catch (e) {
          if (!isSilent) console.log("離線或後台拉取靜默跳過");
        }
      },

      setSyncStatus(status) {
        const gem = document.getElementById('cloudSyncIndicator');
        if (!gem) return;
        gem.className = 'sync-gem';
        if (status === 'pending') gem.classList.add('pending');
        if (status === 'error') gem.classList.add('error');
      },

      initCanvasConfetti() {
        const cvs = document.getElementById('confettiCanvas');
        if (!cvs) return;
        cvs.width = window.innerWidth;
        cvs.height = window.innerHeight;
        window.addEventListener('resize', () => {
          cvs.width = window.innerWidth;
          cvs.height = window.innerHeight;
        });
      },

      shootConfetti() {
        const cvs = document.getElementById('confettiCanvas');
        if (!cvs) return;
        const ctx = cvs.getContext('2d');
        const sparks = [];
        const pal = ['#ffd700', '#f7e49a', '#ffffff', '#2ecc71', '#d4af37'];

        for (let i = 0; i < 90; i++) {
          sparks.push({
            x: cvs.width / 2,
            y: cvs.height * 0.45,
            vx: (Math.random() - 0.5) * 16,
            vy: (Math.random() - 0.75) * 15,
            size: Math.random() * 5 + 3,
            color: pal[Math.floor(Math.random() * pal.length)],
            life: 1
          });
        }

        function step() {
          ctx.clearRect(0, 0, cvs.width, cvs.height);
          let running = false;
          sparks.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.28;
            p.life -= 0.012;
            if (p.life > 0) {
              running = true;
              ctx.save();
              ctx.globalAlpha = p.life;
              ctx.fillStyle = p.color;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            }
          });
          if (running) requestAnimationFrame(step);
        }
        step();
      }
    };

    window.addEventListener('DOMContentLoaded', () => App.init());
  </script>
