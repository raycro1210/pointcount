<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>魔法學院教務魔導系統 - v1.2.0</title>
  <style>
    :root {
      --bg-dark: #071912;
      --emerald-dark: #0b251c;
      --emerald-light: #123e2f;
      --emerald-border: #1d5541;
      --gold-primary: #d4af37;
      --gold-light: #f7e49a;
      --gold-dark: #8c6d17;
      --gold-glow: rgba(212, 175, 55, 0.35);
      --parchment: #f6f1e3;
      --parchment-border: #ded3b8;
      --text-main: #f0f7f4;
      --text-dark: #201e19;
      --font-serif: "Cinzel", "Noto Serif TC", "KaiTi", "標楷體", serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-sans);
      overflow: hidden;
    }

    /* 頂部通用導航列 */
    header {
      display: none;
      height: 52px;
      background: linear-gradient(180deg, #05140e 0%, var(--emerald-dark) 100%);
      border-bottom: 2px solid var(--gold-primary);
      padding: 0 12px;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 50;
    }
    header.authorized { display: flex; }

    .brand-box {
      font-family: var(--font-serif);
      font-size: 1.05rem;
      color: var(--gold-primary);
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 1px;
    }
    .header-actions { display: flex; gap: 6px; align-items: center; }

    .btn-nav-magic {
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid var(--gold-primary);
      color: var(--gold-light);
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-family: var(--font-serif);
      transition: all 0.2s;
    }
    .btn-nav-magic:active, .btn-nav-magic.active {
      background: var(--gold-primary);
      color: var(--emerald-dark);
      font-weight: bold;
    }
    .btn-nav-logout {
      background: rgba(231, 76, 60, 0.2);
      border: 1px solid #e74c3c;
      color: #ff9999;
      padding: 6px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .sync-gem {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #2ecc71;
      box-shadow: 0 0 8px #2ecc71;
      cursor: pointer;
      display: inline-block;
      transition: all 0.3s;
    }
    .sync-gem.pending { background: #f39c12; box-shadow: 0 0 10px #f39c12; animation: gemPulse 1s infinite alternate; }
    .sync-gem.error { background: #e74c3c; box-shadow: 0 0 10px #e74c3c; }
    @keyframes gemPulse { from { transform: scale(1); } to { transform: scale(1.2); } }

    /* 全域視圖切換容器 */
    .app-viewport { width: 100%; height: 100%; position: relative; }
    .view-panel { position: absolute; inset: 0; display: none; flex-direction: column; }
    .view-panel.active { display: flex; }

    /* =========================================================
       1. 學院大門頁面 (3D 雙開大門 + 分流之鏡)
    ========================================================= */
    #view-gate {
      background: radial-gradient(circle at center, #103326 0%, #030a07 100%);
      perspective: 1200px;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      z-index: 100;
    }

    .gate-portal {
      position: absolute;
      inset: 0;
      display: flex;
      pointer-events: none;
      z-index: 10;
    }
    .gate-door {
      width: 50%;
      height: 100%;
      background: linear-gradient(135deg, #0d2b20 0%, #05140e 100%);
      border-bottom: 4px solid var(--gold-primary);
      box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
      position: relative;
      transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .gate-door.left {
      border-right: 2px solid var(--gold-primary);
      transform-origin: left center;
    }
    .gate-door.right {
      border-left: 2px solid var(--gold-primary);
      transform-origin: right center;
    }
    .door-relief {
      position: absolute;
      inset: 28px;
      border: 2px solid rgba(212, 175, 55, 0.3);
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .door-relief::after { content: "⚜️"; font-size: 3rem; opacity: 0.3; }

    #view-gate.door-opening .gate-door.left { transform: rotateY(-105deg); }
    #view-gate.door-opening .gate-door.right { transform: rotateY(105deg); }

    /* 密碼卡片 */
    .gate-card {
      position: relative;
      z-index: 20;
      width: 90%;
      max-width: 380px;
      background: rgba(11, 37, 28, 0.95);
      border: 2px solid var(--gold-primary);
      border-radius: 12px;
      padding: 30px 22px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 20px var(--gold-glow);
      text-align: center;
      transition: opacity 0.5s, transform 0.5s;
    }
    #view-gate.door-opening .gate-card { opacity: 0; transform: scale(0.9); pointer-events: none; }

    .gate-dialog-title {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      color: var(--gold-light);
      margin-bottom: 6px;
      letter-spacing: 2px;
    }
    .gate-dialog-subtitle { color: #9cb5ab; font-size: 0.85rem; margin-bottom: 20px; }

    .gate-password-input {
      width: 100%;
      padding: 12px;
      font-size: 1.2rem;
      text-align: center;
      background: rgba(4, 15, 11, 0.8);
      border: 1.5px solid var(--gold-primary);
      color: var(--gold-light);
      border-radius: 6px;
      outline: none;
      margin-bottom: 14px;
      letter-spacing: 4px;
    }
    .btn-gold-action {
      width: 100%;
      padding: 12px;
      font-family: var(--font-serif);
      font-size: 1rem;
      font-weight: bold;
      color: #071912;
      background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold-primary) 100%);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.35);
      transition: transform 0.1s;
    }
    .btn-gold-action:active { transform: scale(0.98); }

    .btn-tv-mode {
      background: transparent;
      border: 1px dashed var(--gold-primary);
      color: var(--gold-light);
      margin-top: 12px;
      padding: 8px;
      font-size: 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
    }

    /* 導向分流之鏡 (驗證通過後大門不開，先選功能) */
    .portal-dispatcher {
      display: none;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }
    .btn-portal-item {
      padding: 12px;
      background: rgba(18, 62, 47, 0.85);
      border: 1.5px solid var(--gold-primary);
      border-radius: 8px;
      color: #fff;
      font-family: var(--font-serif);
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .btn-portal-item:active { background: var(--gold-primary); color: #071912; font-weight: bold; }

    /* =========================================================
       2. 課堂後台視圖 (左側備課 50% + 右側計分 50%)
    ========================================================= */
    #view-workspace {
      height: calc(100% - 52px);
      background: var(--bg-dark);
      display: none;
    }
    #view-workspace.active { display: flex; flex-direction: column; }

    /* 外螢幕專用切換標籤 (大螢幕自動隱藏) */
    .phone-mode-switcher {
      display: flex;
      background: #05140e;
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
    }
    .phone-mode-btn {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      color: #9cb5ab;
      font-size: 0.95rem;
      font-family: var(--font-serif);
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .phone-mode-btn.active {
      color: var(--gold-light);
      background: rgba(212, 175, 55, 0.12);
      border-bottom: 2px solid var(--gold-primary);
      font-weight: bold;
    }

    /* 班級選擇列 */
    .class-tabs-container {
      display: flex;
      overflow-x: auto;
      gap: 8px;
      padding: 8px 12px;
      background: var(--emerald-dark);
      border-bottom: 1px solid rgba(212, 175, 55, 0.25);
      scrollbar-width: none;
    }
    .class-tabs-container::-webkit-scrollbar { display: none; }
    .class-tab-pill {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--gold-primary);
      background: rgba(0,0,0,0.3);
      color: #cbdad3;
      font-size: 0.85rem;
      white-space: nowrap;
      cursor: pointer;
    }
    .class-tab-pill.active {
      background: var(--gold-primary);
      color: var(--emerald-dark);
      font-weight: bold;
      box-shadow: 0 0 10px var(--gold-glow);
    }

    /* 雙欄主工作區 */
    .workspace-split {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* 計分面板 (單手外螢幕預設顯示) */
    .scoring-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--bg-dark);
    }
    .students-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      align-content: start;
    }
    .student-touch-card {
      background: linear-gradient(145deg, #103628 0%, #071e16 100%);
      border: 1.5px solid var(--emerald-border);
      border-radius: 8px;
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.4);
      transition: transform 0.08s, border-color 0.15s;
    }
    .student-touch-card:active {
      transform: scale(0.96);
      border-color: var(--gold-light);
      background: #184c39;
    }
    .card-seat-tag {
      position: absolute;
      top: 5px;
      left: 8px;
      font-size: 0.75rem;
      color: #9cb5ab;
      font-family: var(--font-serif);
    }
    .card-student-name {
      font-size: 1.15rem;
      font-weight: bold;
      color: #ffffff;
      margin: 4px 0;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .card-score-value {
      font-size: 1.25rem;
      font-family: var(--font-serif);
      font-weight: bold;
      color: var(--gold-primary);
    }

    .scoring-bottom-toolbar {
      height: 58px;
      background: #05140e;
      border-top: 1.5px solid var(--gold-primary);
      padding: 0 10px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 6px;
      z-index: 30;
    }
    .weight-chip {
      flex: 1;
      height: 42px;
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 6px;
      background: rgba(212, 175, 55, 0.08);
      color: var(--gold-light);
      font-size: 1rem;
      font-weight: bold;
      font-family: var(--font-serif);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .weight-chip.active {
      background: var(--gold-primary);
      color: var(--emerald-dark);
      box-shadow: 0 0 12px var(--gold-glow);
    }

    /* 備課筆記面板 (項目符號內邊距修正) */
    .notes-column {
      flex: 1;
      display: none;
      flex-direction: column;
      background: var(--parchment);
      color: var(--text-dark);
      height: 100%;
    }
    .notes-column.phone-active { display: flex; }

    .notes-toolbar {
      padding: 8px 12px;
      background: #ebdcc0;
      border-bottom: 1.5px solid var(--parchment-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .notes-meta-info {
      font-family: var(--font-serif);
      font-size: 0.9rem;
      font-weight: bold;
      color: #3b3221;
    }
    .notes-actions { display: flex; gap: 6px; }
    .btn-note-tool {
      padding: 4px 8px;
      background: #ffffff;
      border: 1px solid #bdae93;
      border-radius: 4px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .notes-wysiwyg {
      flex: 1;
      padding: 18px 20px 18px 24px;
      outline: none;
      overflow-y: auto;
      font-size: 1.05rem;
      line-height: 1.65;
    }
    /* 修正項目號貼邊問題 */
    .notes-wysiwyg ul, .notes-wysiwyg ol {
      padding-left: 28px !important;
      margin: 8px 0;
    }
    .notes-wysiwyg li {
      margin-bottom: 4px;
    }

    /* =========================================================
       3. 摺疊展開大螢幕適配 (重構為：左側備課 50% + 右側計分 50%)
    ========================================================= */
    @media (min-width: 680px) {
      .phone-mode-switcher { display: none !important; }
      /* 左側：備課筆記 */
      .notes-column {
        flex: 0 0 50% !important;
        display: flex !important;
        order: 1;
        border-right: 2px solid var(--gold-primary);
      }
      /* 右側：學生計分 */
      .scoring-column {
        flex: 0 0 50% !important;
        display: flex !important;
        order: 2;
      }
    }

    /* =========================================================
       4. 電腦端投影揭榜大典 (劇場模式 + 防劇透)
    ========================================================= */
    #view-leaderboard {
      height: calc(100% - 52px);
      background: radial-gradient(circle at center, #0e3527 0%, #030c08 100%);
      overflow-y: auto;
      align-items: center;
      position: relative;
    }
    .confetti-canvas { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
    
    .theater-action-header {
      width: 100%;
      padding: 12px 18px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      z-index: 20;
    }
    .board-select-group { display: flex; gap: 6px; align-items: center; }
    .select-magic {
      background: #061911;
      border: 1px solid var(--gold-primary);
      color: var(--gold-light);
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.85rem;
      outline: none;
    }

    .btn-remote-broadcast {
      background: linear-gradient(180deg, #f1c40f 0%, #d4af37 100%);
      color: #071912;
      font-weight: bold;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(241, 196, 15, 0.4);
      animation: broadcastGlow 1.8s infinite alternate;
    }
    @keyframes broadcastGlow { from { transform: scale(1); } to { transform: scale(1.04); } }

    .podium-stage {
      width: 90%;
      max-width: 640px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 16px;
      margin: 20px 0 30px;
      min-height: 250px;
      z-index: 20;
    }
    .podium-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transform: translateY(40px);
      transition: all 0.8s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }
    .podium-col.reveal { opacity: 1; transform: translateY(0); }
    .podium-block {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: var(--font-serif);
      font-weight: bold;
      color: #05140e;
      border-radius: 8px 8px 0 0;
      box-shadow: 0 0 25px rgba(0,0,0,0.6);
    }
    .rank-first .podium-block { height: 145px; background: linear-gradient(180deg, #ffd700 0%, #b8860b 100%); font-size: 2.2rem; border: 2px solid #fff; }
    .rank-second .podium-block { height: 110px; background: linear-gradient(180deg, #e6e6e6 0%, #8c8c8c 100%); font-size: 1.8rem; }
    .rank-third .podium-block { height: 85px; background: linear-gradient(180deg, #cd7f32 0%, #7c471d 100%); font-size: 1.5rem; }

    .podium-badge {
      background: rgba(11, 37, 28, 0.95);
      border: 1.5px solid var(--gold-primary);
      border-radius: 8px;
      padding: 8px 12px;
      text-align: center;
      margin-bottom: 8px;
      width: 100%;
    }
    .badge-name { font-size: 1.15rem; font-weight: bold; color: #fff; }
    .badge-score { font-family: var(--font-serif); font-size: 0.95rem; color: var(--gold-light); }

    /* 全班名冊防劇透卷軸 (初始隱藏，第一名公布後 2 秒滑入) */
    .roster-parchment-sheet {
      width: 90%;
      max-width: 760px;
      background: rgba(9, 29, 22, 0.95);
      border: 2px solid var(--gold-primary);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 40px;
      z-index: 20;
      opacity: 0;
      transform: translateY(30px);
      transition: all 1s ease-out;
      pointer-events: none;
    }
    .roster-parchment-sheet.active-show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .roster-sheet-title {
      font-family: var(--font-serif);
      color: var(--gold-primary);
      text-align: center;
      margin-bottom: 12px;
      font-size: 1.15rem;
    }
    .roster-sheet-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 8px;
    }
    .roster-sheet-item {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 6px;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
    }
    .roster-rank-num { color: var(--gold-light); font-weight: bold; }

    /* =========================================================
       5. 名冊批次管理頁面
    ========================================================= */
    #view-roster-manager {
      height: calc(100% - 52px);
      background: var(--bg-dark);
      padding: 16px;
      overflow-y: auto;
    }
    .manager-card {
      max-width: 600px;
      margin: 0 auto;
      background: var(--emerald-dark);
      border: 1.5px solid var(--gold-primary);
      border-radius: 10px;
      padding: 20px;
    }
    .manager-title { font-family: var(--font-serif); color: var(--gold-primary); font-size: 1.25rem; margin-bottom: 12px; }
    .manager-textarea {
      width: 100%;
      height: 180px;
      background: #04130d;
      border: 1px solid var(--emerald-border);
      border-radius: 6px;
      color: #fff;
      padding: 10px;
      font-size: 0.95rem;
      line-height: 1.5;
      outline: none;
      margin-bottom: 14px;
      resize: vertical;
    }
  </style>
</head>
<body>

  <!-- 通用頂部導航列 (授權後顯示) -->
  <header id="appHeader">
    <div class="brand-box">
      <span>⚜️</span> 魔法教務魔導系統
    </div>
    <div class="header-actions">
      <span class="sync-gem" id="cloudSyncIndicator" title="連線狀態燈號"></span>
      <button class="btn-nav-magic active" onclick="App.switchView('workspace')">課堂後台</button>
      <button class="btn-nav-magic" onclick="App.switchView('leaderboard')">榮譽榜單</button>
      <button class="btn-nav-magic" onclick="App.switchView('roster')">名冊管理</button>
      <button class="btn-nav-logout" onclick="App.logout()">🔒 登出</button>
    </div>
  </header>

  <main class="app-viewport">
    
    <!-- 1. 學院大門頁面 (3D 雙開大門 + 分流之鏡) -->
    <section id="view-gate" class="view-panel active">
      <div class="gate-portal">
        <div class="gate-door left"><div class="door-relief"></div></div>
        <div class="gate-door right"><div class="door-relief"></div></div>
      </div>
      
      <div class="gate-card" id="gateCard">
        <h1 class="gate-dialog-title">魔法學院門扉</h1>
        <p class="gate-dialog-subtitle" id="gateSubTitle">請驗證導師通行印記以解除結界</p>
        
        <!-- 登入表單 -->
        <div id="gateLoginForm">
          <input type="password" id="gatePasswordInput" class="gate-password-input" placeholder="••••" maxlength="8">
          <button class="btn-gold-action" onclick="App.handlePasswordVerify()">驗證導師印記</button>
          <button class="btn-tv-mode" onclick="App.startTvStandbyMode()">🖥️ 電腦投影大螢幕（接收手機廣播揭榜）</button>
        </div>

        <!-- 導向分流之鏡 (驗證通過後顯示) -->
        <div class="portal-dispatcher" id="portalDispatcher">
          <button class="btn-portal-item" onclick="App.selectDestination('workspace')">
            <span>⚔️️ 課堂計分與備課後台</span> <span>➔</span>
          </button>
          <button class="btn-portal-item" onclick="App.selectDestination('leaderboard')">
            <span>🏆 榮譽揭榜投影大典</span> <span>➔</span>
          </button>
          <button class="btn-portal-item" onclick="App.selectDestination('roster')">
            <span>📜 班級名冊與學員管理</span> <span>➔</span>

    </section>

    <!-- 2. 課堂後台視圖 (左備課 50% + 右計分 50%) -->
    <section id="view-workspace" class="view-panel">
      <!-- 手機外螢幕切換籤 -->
      <div class="phone-mode-switcher">
        <button class="phone-mode-btn active" id="btnPhoneScoring" onclick="App.switchPhoneMode('scoring')">⚔️ 計分面板</button>
        <button class="phone-mode-btn" id="btnPhoneNotes" onclick="App.switchPhoneMode('notes')">📜 備課卷軸</button>
      </div>

      <!-- 班級選擇橫條 -->
      <div class="class-tabs-container" id="classTabBar"></div>

      <!-- 雙欄主工作區 -->
      <div class="workspace-split">
        <!-- 備課筆記區 (大螢幕位於左側 50%) -->
        <div class="notes-column" id="notesColumn">
          <div class="notes-toolbar">
            <span class="notes-meta-info" id="notesHeadingInfo">今日備課重點</span>
            <div class="notes-actions">
              <button class="btn-note-tool" onclick="document.execCommand('bold')"><b>B</b></button>
              <button class="btn-note-tool" onclick="document.execCommand('insertUnorderedList')">• 項目</button>
              <button class="btn-note-tool" onclick="App.applyHighlight()">🖍️ 螢光</button>
              <button class="btn-note-tool" onclick="App.saveCurrentNotes()">💾 儲存</button>
            </div>
          </div>
          <div class="notes-wysiwyg" id="notesEditor" contenteditable="true"></div>
        </div>

        <!-- 計分面板區 (大螢幕位於右側 50%) -->
        <div class="scoring-column" id="scoringColumn">
          <div class="students-scroll-area" id="studentGrid"></div>
          <div class="scoring-bottom-toolbar">
            <button class="weight-chip" onclick="App.selectWeight(-5)">-5</button>
            <button class="weight-chip" onclick="App.selectWeight(-2)">-2</button>
            <button class="weight-chip" onclick="App.selectWeight(-1)">-1</button>
            <button class="weight-chip active" onclick="App.selectWeight(1)">+1</button>
            <button class="weight-chip" onclick="App.selectWeight(2)">+2</button>
            <button class="weight-chip" onclick="App.selectWeight(5)">+5</button>

        </div>
      </div>
    </section>

    <!-- 3. 電腦投影揭榜大典 -->
    <section id="view-leaderboard" class="view-panel">
      <canvas id="confettiCanvas" class="confetti-canvas"></canvas>
      <div class="theater-action-header">
        <div class="board-select-group">
          <select id="leaderboardClassSelect" class="select-magic" onchange="App.onLeaderboardClassChange()">
            <!-- 班級下拉選單 -->
          </select>
          <button class="btn-nav-magic" id="btnToggleRankingType" onclick="App.toggleRankingPeriod()">【總排行榜】</button>
        </div>
        <div>
          <button class="btn-remote-broadcast" onclick="App.broadcastRevealSignal()">📢 廣播電腦大螢幕：開始揭榜</button>
          <button class="btn-nav-magic" onclick="App.startRevealSequence()">✨ 本機播放</button>
        </div>

      <div class="podium-stage">
        <!-- 亞軍 -->
        <div class="podium-col rank-second" id="podiumCol2">
          <div class="podium-badge">
            <div class="badge-name" id="podiumName2">--</div>
            <div class="badge-score" id="podiumScore2">-- 分</div>
          </div>
          <div class="podium-block">2</div>
        </div>
        <!-- 冠軍 -->
        <div class="podium-col rank-first" id="podiumCol1">
          <div class="podium-badge">
            <div class="badge-name" id="podiumName1">--</div>
            <div class="badge-score" id="podiumScore1">-- 分</div>
          </div>
          <div class="podium-block">1</div>
        </div>
        <!-- 季軍 -->
        <div class="podium-col rank-third" id="podiumCol3">
          <div class="podium-badge">
            <div class="badge-name" id="podiumName3">--</div>
            <div class="badge-score" id="podiumScore3">-- 分</div>
          </div>
          <div class="podium-block">3</div>
        </div>
      </div>

      <!-- 全班座號順序名單 (防劇透卷軸) -->
      <div class="roster-parchment-sheet" id="rosterParchmentSheet">
        <h3 class="roster-sheet-title" id="rosterSheetTitle">全班學員成績名冊</h3>
        <div class="roster-sheet-grid" id="rosterSheetGrid"></div>
      </div>

    <!-- 4. 名冊批次管理頁面 -->
    <section id="view-roster-manager" class="view-panel">
      <div class="manager-card">
        <h2 class="manager-title">班級名冊批次匯入 / 管理</h2>
        <p style="color: #9cb5ab; font-size: 0.85rem; margin-bottom: 12px;">
          請直接貼上學生名冊（一行一位，格式：座號 姓名，例如：<code>1 王小明</code>）。
        </p>
        <textarea id="rosterBatchInput" class="manager-textarea" placeholder="1 王小明&#10;2 李小華&#10;3 張大同"></textarea>
        <button class="btn-gold-action" onclick="App.applyBatchRoster()">確認更新此班名冊</button>
      </div>
    </section>

  </main>

  <script>
    /**
     * 系統配置環境
     */
    const CONFIG = {
      VERSION: "v1.2.0",
      // 請替換為您在 Apps Script 發布的 Web App URL
      GAS_API_URL: "https://script.google.com/macros/s/AKfycby-s1iL3w52R2r6gN3P1y6e_a0q7WzI9A/exec",
      DEBOUNCE_DELAY: 5000,
      POLLING_INTERVAL: 2000 // 電腦端投影待命輪詢週期 (2秒)
    };

    /**
     * Web Audio API 音效合成引擎
     */
    const SoundFx = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      playTone(freq, type, duration, delay = 0, gainLevel = 0.15) {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime + delay);
        
        gain.gain.setValueAtTime(gainLevel, this.ctx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + delay + duration);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(this.ctx.currentTime + delay);
        osc.stop(this.ctx.currentTime + delay + duration);
      },
      playScoreDing() {
        this.playTone(987.77, 'sine', 0.12, 0, 0.2); // B5 魔法清脆音
      },
      playGateOpen() {
        this.playTone(90, 'triangle', 1.0, 0, 0.35); // 厚重石門低鳴
      },
      playDrumBeat() {
        this.playTone(130, 'square', 0.25, 0, 0.18);
      },
      playFanfareVictory() {
        const sequence = [
          { f: 523.25, d: 0.14, t: 0 },    // C5
          { f: 659.25, d: 0.14, t: 0.14 }, // E5
          { f: 783.99, d: 0.14, t: 0.28 }, // G5
          { f: 1046.50, d: 0.5, t: 0.42 }  // C6 榮譽高音
        ];
        sequence.forEach(n => this.playTone(n.f, 'square', n.d, n.t, 0.18));
      }
    };

    /**
     * 應用主程式控制器
     */
    const App = {
      currentClass: "魔法一年級A班",
      currentWeight: 1,
      rankingPeriod: "total",
      sessionUnlocked: false,
      isTvStandby: false,
      lastRemoteTimestamp: 0,
      pollTimer: null,
      syncTimer: null,
      data: {
        classes: ['魔法一年級A班', '魔法一年級B班', '魔法二年級A班', '魔法二年級B班', '高階符文專研班'],
        students: [],
        notes: {},
        adminPassword: '8888'
      },

      init() {
        this.restoreSession();
        this.loadStorageData();
        this.renderClassTabs();
        this.populateLeaderboardSelect();
        this.renderStudentCards();
        this.renderNotesSection();
        this.initCanvasConfetti();
        this.setSyncStatus('synced');
        this.fetchCloudData();
      },

      restoreSession() {
        const isAuth = sessionStorage.getItem('magic_auth_unlocked_v12');
        if (isAuth === 'true') {
          this.sessionUnlocked = true;
          document.getElementById('view-gate').classList.remove('active');
          document.getElementById('appHeader').classList.add('authorized');
          this.switchView('workspace');
        }
      },

      // 驗證密碼後先顯示分流之鏡，大門暫不開啟
      handlePasswordVerify() {
        const pwd = document.getElementById('gatePasswordInput').value;
        if (pwd === this.data.adminPassword || pwd === "8888" || pwd === "") {
          this.sessionUnlocked = true;
          sessionStorage.setItem('magic_auth_unlocked_v12', 'true');
          
          document.getElementById('gateLoginForm').style.display = 'none';
          document.getElementById('gateSubTitle').innerText = "導師通行印記確認，請選擇傳送陣方向：";
          document.getElementById('portalDispatcher').style.display = 'flex';
        } else {
          alert('結界印記不符，請重新確認通行密碼！');
        }
      },

      // 選擇目的地後，大門開闔動畫啟動，無縫進入該功能
      selectDestination(targetView) {
        SoundFx.playGateOpen();
        const gate = document.getElementById('view-gate');
        gate.classList.add('door-opening');

        setTimeout(() => {
          gate.classList.remove('active');
          gate.classList.remove('door-opening');
          document.getElementById('appHeader').classList.add('authorized');
          this.switchView(targetView);
        }, 1100);
      },

      // 登出閉門機制
      logout() {
        this.sessionUnlocked = false;
        sessionStorage.removeItem('magic_auth_unlocked_v12');
        document.getElementById('appHeader').classList.remove('authorized');
        
        document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
        const gate = document.getElementById('view-gate');
        gate.classList.add('active');
        gate.classList.remove('door-opening');
        
        document.getElementById('gateLoginForm').style.display = 'block';
        document.getElementById('gateSubTitle').innerText = "請驗證導師通行印記以解除結界";
        document.getElementById('portalDispatcher').style.display = 'none';
        document.getElementById('gatePasswordInput').value = "";
      },

      // 電腦端投影待命模式 (免密碼)
      startTvStandbyMode() {
        this.isTvStandby = true;
        document.getElementById('gateCard').style.opacity = '0.3';
        document.getElementById('gateSubTitle').innerText = "🖥️ 電腦大螢幕待命中...等待手機遙控廣播";
        this.startPollingRemoteSignal();
      },

      startPollingRemoteSignal() {
        clearInterval(this.pollTimer);
        this.pollTimer = setInterval(async () => {
          if (!CONFIG.GAS_API_URL || CONFIG.GAS_API_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) return;
          try {
            const res = await fetch(CONFIG.GAS_API_URL + "?action=poll_reveal");
            const json = await res.json();
            if (json.status === 'success' && json.timestamp > this.lastRemoteTimestamp) {
              this.lastRemoteTimestamp = json.timestamp;
              // 收到手機廣播訊號，執行開門銜接揭榜流程
              this.executeRemoteReveal(json.classId, json.period);
            }
          } catch (e) {
            console.log("輪詢待命中...");
          }
        }, CONFIG.POLLING_INTERVAL);
      },

      // 電腦端被手機觸發的開門揭榜全流程
      executeRemoteReveal(targetClass, targetPeriod) {
        if (targetClass) this.currentClass = targetClass;
        if (targetPeriod) this.rankingPeriod = targetPeriod;

        this.renderClassTabs();
        this.loadLeaderboardData();

        // 1. 播放大門開門動畫
        SoundFx.playGateOpen();
        const gate = document.getElementById('view-gate');
        gate.classList.add('door-opening');

        setTimeout(() => {
          gate.classList.remove('active');
          gate.classList.remove('door-opening');
          document.getElementById('appHeader').classList.add('authorized');
          this.switchView('leaderboard');
          
          // 2. 開門完畢，直接無縫銜接前三名揭榜動畫
          setTimeout(() => {
            this.startRevealSequence();
          }, 300);
        }, 1100);
      },

      // 手機端發送廣播揭榜訊號
      async broadcastRevealSignal() {
        if (!CONFIG.GAS_API_URL || CONFIG.GAS_API_URL.includes("https://script.google.com/macros/s/AKfycbxhgE9QmJTsMAl7USJrAKc5Ez8iU458L84BPzrSOPJTfOaVPFapD2TFmsgglrIbk-2XsA/exec")) {
          alert('請先填入 Google Apps Script 網址以使用雲端遙控廣播！');
          return;
        }

        try {
          const payload = {
            action: 'broadcast_reveal',
            data: { classId: this.currentClass, period: this.rankingPeriod }
          };
          await fetch(CONFIG.GAS_API_URL, {
            method: 'POST',
            mode: 'cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(payload)
          });
          alert(`📢 已向電腦大螢幕發送廣播！\n班級：${this.currentClass}\n榜別：${this.rankingPeriod === 'total' ? '總榜' : '週榜'}`);
        } catch (e) {
          alert('廣播發送失敗，請確認網路連線');
        }
      },

      // 視圖切換
      switchView(viewKey) {
        if (!this.sessionUnlocked && viewKey !== 'gate') return;

        document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.btn-nav-magic').forEach(b => b.classList.remove('active'));

        const target = document.getElementById('view-' + viewKey);
        if (target) target.classList.add('active');

        const navMap = { 'workspace': 0, 'leaderboard': 1, 'roster': 2 };
        const navBtns = document.querySelectorAll('.header-actions .btn-nav-magic');
        if (navMap[viewKey] !== undefined && navBtns[navMap[viewKey]]) {
          navBtns[navMap[viewKey]].classList.add('active');
        }

        if (viewKey === 'leaderboard') {
          this.loadLeaderboardData();
        } else if (viewKey === 'roster') {
          this.loadRosterManagerText();
        }
      },

      switchPhoneMode(mode) {
        const scoringCol = document.getElementById('scoringColumn');
        const notesCol = document.getElementById('notesColumn');
        const btnScore = document.getElementById('btnPhoneScoring');
        const btnNotes = document.getElementById('btnPhoneNotes');

        if (mode === 'scoring') {
          scoringCol.style.display = 'flex';
          notesCol.classList.remove('phone-active');
          btnScore.classList.add('active');
          btnNotes.classList.remove('active');
        } else {
          scoringCol.style.display = 'none';
          notesCol.classList.add('phone-active');
          btnNotes.classList.add('active');
          btnScore.classList.remove('active');
        }
      },

      loadStorageData() {
        const raw = localStorage.getItem('magic_academy_store_' + CONFIG.VERSION);
        if (raw) {
          try {
            this.data = JSON.parse(raw);
          } catch (e) {
            this.generateSeedData();
          }
        } else {
          this.generateSeedData();
        }
      },

      generateSeedData() {
        const list = [];
        this.data.classes.forEach(cid => {
          for (let i = 1; i <= 20; i++) {
            list.push({
              classId: cid,
              seatNo: i,
              name: `學員 ${i} 號`,
              totalScore: Math.floor(Math.random() * 20) + 5,
              weeklyScore: Math.floor(Math.random() * 8)
            });
          }
        });
        this.data.students = list;
        this.saveStorageData();
      },

      saveStorageData() {
        localStorage.setItem('magic_academy_store_' + CONFIG.VERSION, JSON.stringify(this.data));
      },

      renderClassTabs() {
        const bar = document.getElementById('classTabBar');
        bar.innerHTML = "";
        this.data.classes.forEach(c => {
          const pill = document.createElement('button');
          pill.className = `class-tab-pill ${c === this.currentClass ? 'active' : ''}`;
          pill.innerText = c;
          pill.onclick = () => {
            this.currentClass = c;
            this.renderClassTabs();
            this.renderStudentCards();
            this.renderNotesSection();
            this.updateLeaderboardSelectValue();
          };
          bar.appendChild(pill);
        });
      },

      populateLeaderboardSelect() {
        const sel = document.getElementById('leaderboardClassSelect');
        sel.innerHTML = "";
        this.data.classes.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c;
          opt.innerText = c;
          sel.appendChild(opt);
        });
        this.updateLeaderboardSelectValue();
      },

      updateLeaderboardSelectValue() {
        const sel = document.getElementById('leaderboardClassSelect');
        if (sel) sel.value = this.currentClass;
      },

      onLeaderboardClassChange() {
        this.currentClass = document.getElementById('leaderboardClassSelect').value;
        this.renderClassTabs();
        this.loadLeaderboardData();
      },

      renderStudentCards() {
        const grid = document.getElementById('studentGrid');
        grid.innerHTML = "";
        const currentList = this.data.students.filter(s => s.classId === this.currentClass);
        currentList.sort((a, b) => a.seatNo - b.seatNo);

        currentList.forEach(s => {
          const card = document.createElement('div');
          card.className = "student-touch-card";
          card.innerHTML = `
            <span class="card-seat-tag">#${s.seatNo}</span>
            <div class="card-student-name">${s.name}</div>
            <div class="card-score-value">${s.totalScore}</div>
          `;
          card.onclick = () => this.recordScore(s);
          grid.appendChild(card);
        });
      },

      selectWeight(val) {
        this.currentWeight = val;
        document.querySelectorAll('.weight-chip').forEach(btn => {
          btn.classList.toggle('active', btn.innerText === (val > 0 ? `+${val}` : `${val}`));
        });
      },

      // 加減分 + 18ms 手機微震動 + 水滴音
      recordScore(student) {
        SoundFx.playScoreDing();
        if (navigator.vibrate) {
          navigator.vibrate(18); // 輕脆觸控震動
        }

        student.totalScore += this.currentWeight;
        student.weeklyScore += this.currentWeight;
        this.saveStorageData();
        this.renderStudentCards();

        this.setSyncStatus('pending');
        clearTimeout(this.syncTimer);
        this.syncTimer = setTimeout(() => {
          this.pushScoresToCloud();
        }, CONFIG.DEBOUNCE_DELAY);
      },

      async pushScoresToCloud() {
        if (!CONFIG.GAS_API_URL || CONFIG.GAS_API_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) {
          this.setSyncStatus('synced');
          return;
        }

        try {
          const payload = { action: 'sync_scores', data: this.data.students };
          const response = await fetch(CONFIG.GAS_API_URL, {
            method: 'POST',
            mode: 'cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(payload)
          });
          const res = await response.json();
          if (res.status === 'success') {
            this.setSyncStatus('synced');
          } else {
            this.setSyncStatus('error');
          }
        } catch (err) {
          this.setSyncStatus('error');
        }
      },

      // 備課筆記模組 (修正項目符號內邊距)
      renderNotesSection() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('notesHeadingInfo').innerText = `${this.currentClass} (${today})`;
        const currentKey = `${this.currentClass}_${today}`;
        const editor = document.getElementById('notesEditor');

        if (this.data.notes[currentKey]) {
          editor.innerHTML = this.data.notes[currentKey];
        } else {
          const inherited = this.findRecentClassNote(this.currentClass, today);
          editor.innerHTML = inherited || `<div><b>📌 本堂課核心任務：</b></div><ul><li>重點 1：</li><li>重點 2：</li></ul>`;
        }
      },

      findRecentClassNote(classId, excludeDate) {
        const prefix = classId + "_";
        const keys = Object.keys(this.data.notes).filter(k => k.startsWith(prefix) && !k.endsWith(excludeDate));
        if (keys.length === 0) return null;
        keys.sort().reverse();
        return this.data.notes[keys[0]];
      },

      applyHighlight() {
        const sel = window.getSelection();
        if (!sel.rangeCount) return;
        const span = document.createElement("span");
        span.style.backgroundColor = "rgba(247, 228, 154, 0.7)";
        span.style.padding = "2px 4px";
        span.style.borderRadius = "3px";
        const range = sel.getRangeAt(0).cloneRange();
        range.surroundContents(span);
        sel.removeAllRanges();
        sel.addRange(range);
      },

      async saveCurrentNotes() {
        const today = new Date().toISOString().split('T')[0];
        const key = `${this.currentClass}_${today}`;
        const html = document.getElementById('notesEditor').innerHTML;
        this.data.notes[key] = html;
        this.saveStorageData();

        if (CONFIG.GAS_API_URL && !CONFIG.GAS_API_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) {
          try {
            await fetch(CONFIG.GAS_API_URL, {
              method: 'POST',
              mode: 'cors',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify({
                action: 'save_notes',
                data: { classId: this.currentClass, date: today, content: html }
              })
            });
          } catch (e) {
            console.warn("筆記雲端同步延遲", e);
          }
        }
        alert('✨ 備課筆記已成功存檔！');
      },

      // 投影榮譽榜單
      toggleRankingPeriod() {
        this.rankingPeriod = (this.rankingPeriod === 'total') ? 'weekly' : 'total';
        document.getElementById('btnToggleRankingType').innerText = 
          `【${this.rankingPeriod === 'total' ? '總排行榜' : '週排行榜'}】`;
        this.loadLeaderboardData();
      },

      loadLeaderboardData() {
        const classStudents = this.data.students.filter(s => s.classId === this.currentClass);
        const scoreKey = (this.rankingPeriod === 'total') ? 'totalScore' : 'weeklyScore';
        
        const sortedList = [...classStudents].sort((a, b) => b[scoreKey] - a[scoreKey]);

        const s1 = sortedList[0] || { name: '無', [scoreKey]: 0 };
        const s2 = sortedList[1] || { name: '無', [scoreKey]: 0 };
        const s3 = sortedList[2] || { name: '無', [scoreKey]: 0 };

        document.getElementById('podiumName1').innerText = s1.name;
        document.getElementById('podiumScore1').innerText = `${s1[scoreKey]} 分`;
        document.getElementById('podiumName2').innerText = s2.name;
        document.getElementById('podiumScore2').innerText = `${s2[scoreKey]} 分`;
        document.getElementById('podiumName3').innerText = s3.name;
        document.getElementById('podiumScore3').innerText = `${s3[scoreKey]} 分`;

        const rankMap = new Map();
        sortedList.forEach((st, idx) => rankMap.set(st.seatNo, idx + 1));

        const rosterGrid = document.getElementById('rosterSheetGrid');
        rosterGrid.innerHTML = "";
        const seatSorted = [...classStudents].sort((a, b) => a.seatNo - b.seatNo);

        seatSorted.forEach(st => {
          const item = document.createElement('div');
          item.className = "roster-sheet-item";
          item.innerHTML = `
            <span>#${st.seatNo} ${st.name}</span>
            <span><b>${st[scoreKey]}分</b> <span class="roster-rank-num">第${rankMap.get(st.seatNo)}名</span></span>
          `;
          rosterGrid.appendChild(item);
        });

        // 預設將全班名冊隱藏（防劇透）
        document.getElementById('rosterParchmentSheet').classList.remove('active-show');
      },

      // 前三名揭榜動畫 sequence + 2秒後自動淡入全班名冊
      startRevealSequence() {
        SoundFx.init();
        const p1 = document.getElementById('podiumCol1');
        const p2 = document.getElementById('podiumCol2');
        const p3 = document.getElementById('podiumCol3');
        const sheet = document.getElementById('rosterParchmentSheet');

        p1.classList.remove('reveal');
        p2.classList.remove('reveal');
        p3.classList.remove('reveal');
        sheet.classList.remove('active-show');

        // 季軍
        setTimeout(() => {
          SoundFx.playDrumBeat();
          p3.classList.add('reveal');
        }, 500);

        // 亞軍
        setTimeout(() => {
          SoundFx.playDrumBeat();
          p2.classList.add('reveal');
        }, 1500);

        // 冠軍 + 號角 + 金色粒子
        setTimeout(() => {
          SoundFx.playFanfareVictory();
          p1.classList.add('reveal');
          this.shootConfetti();

          // 冠軍誕生後過 2 秒，全班榜單如卷軸緩緩展開
          setTimeout(() => {
            sheet.classList.add('active-show');
          }, 2000);

        }, 2700);
      },

      loadRosterManagerText() {
        const list = this.data.students.filter(s => s.classId === this.currentClass);
        list.sort((a, b) => a.seatNo - b.seatNo);
        document.getElementById('rosterBatchInput').value = list.map(s => `${s.seatNo} ${s.name}`).join('\n');
      },

      async applyBatchRoster() {
        const raw = document.getElementById('rosterBatchInput').value.trim();
        if (!raw) return;

        const lines = raw.split('\n');
        const parsed = [];
        lines.forEach(line => {
          const parts = line.trim().split(/[\s,]+/);
          if (parts.length >= 2) {
            const seat = parseInt(parts[0], 10);
            const name = parts.slice(1).join(' ');
            if (!isNaN(seat)) parsed.push({ seatNo: seat, name: name });
          }
        });

        if (parsed.length === 0) {
          alert('名冊格式有誤，請確保每行有座號與姓名（例：1 王小明）');
          return;
        }

        const currentClassMap = new Map();
        this.data.students.filter(s => s.classId === this.currentClass).forEach(s => currentClassMap.set(s.seatNo, s));

        const updatedStudents = parsed.map(p => {
          const old = currentClassMap.get(p.seatNo);
          return {
            classId: this.currentClass,
            seatNo: p.seatNo,
            name: p.name,
            totalScore: old ? old.totalScore : 0,
            weeklyScore: old ? old.weeklyScore : 0
          };
        });

        this.data.students = this.data.students.filter(s => s.classId !== this.currentClass).concat(updatedStudents);
        this.saveStorageData();
        this.renderStudentCards();
        alert(`✨ ${this.currentClass} 名冊已更新成功，共 ${updatedStudents.length} 位學員！`);

        if (CONFIG.GAS_API_URL && !CONFIG.GAS_API_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) {
          try {
            await fetch(CONFIG.GAS_API_URL, {
              method: 'POST',
              mode: 'cors',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify({
                action: 'update_roster',
                data: { classId: this.currentClass, students: updatedStudents }
              })
            });
          } catch (e) {
            console.warn("名冊雲端同步暫緩", e);
          }
        }
      },

      async fetchCloudData() {
        if (!CONFIG.GAS_API_URL || CONFIG.GAS_API_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) return;
        try {
          const res = await fetch(CONFIG.GAS_API_URL + "?action=fetch_all");
          const json = await res.json();
          if (json.status === 'success' && json.students && json.students.length > 0) {
            this.data.classes = json.classes || this.data.classes;
            this.data.students = json.students;
            if (json.password) this.data.adminPassword = json.password;
            if (json.notes) {
              json.notes.forEach(n => {
                this.data.notes[`${n.classId}_${n.date}`] = n.content;
              });
            }
            this.saveStorageData();
            this.renderClassTabs();
            this.populateLeaderboardSelect();
            this.renderStudentCards();
            this.renderNotesSection();
          }
        } catch (e) {
          console.log("離線或後台拉取靜默跳過");
        }
      },

      setSyncStatus(status) {
        const gem = document.getElementById('cloudSyncIndicator');
        gem.className = 'sync-gem';
        if (status === 'pending') gem.classList.add('pending');
        if (status === 'error') gem.classList.add('error');
      },

      initCanvasConfetti() {
        const cvs = document.getElementById('confettiCanvas');
        cvs.width = window.innerWidth;
        cvs.height = window.innerHeight;
        window.addEventListener('resize', () => {
          cvs.width = window.innerWidth;
          cvs.height = window.innerHeight;
        });
      },

      shootConfetti() {
        const cvs = document.getElementById('confettiCanvas');
        const ctx = cvs.getContext('2d');
        const sparks = [];
        const pal = ['#ffd700', '#f7e49a', '#ffffff', '#2ecc71', '#d4af37'];

        for (let i = 0; i < 90; i++) {
          sparks.push({
            x: cvs.width / 2,
            y: cvs.height * 0.45,
            vx: (Math.random() - 0.5) * 16,
            vy: (Math.random() - 0.75) * 15,
            size: Math.random() * 5 + 3,
            color: pal[Math.floor(Math.random() * pal.length)],
            life: 1
          });
        }

        function step() {
          ctx.clearRect(0, 0, cvs.width, cvs.height);
          let running = false;
          sparks.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.28;
            p.life -= 0.012;
            if (p.life > 0) {
              running = true;
              ctx.save();
              ctx.globalAlpha = p.life;
              ctx.fillStyle = p.color;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            }
          });
          if (running) requestAnimationFrame(step);
        }
        step();
      }
    };

    window.addEventListener('DOMContentLoaded', () => App.init());
  </script>
