      toggleRankingPeriod() {
        this.rankingPeriod = (this.rankingPeriod === 'weekly') ? 'total' : 'weekly';
        const btn = document.getElementById('btnToggleRankingType');
        if (btn) btn.innerText = `目前為:【${this.rankingPeriod === 'weekly' ? '週排行榜' : '總排行榜'}】`;
        
        if (this.mqttClient && this.mqttClient.connected) {
          this.mqttClient.publish(CONFIG.MQTT_TOPIC, JSON.stringify({
            action: 'SYNC_PERIOD',
            period: this.rankingPeriod,
            t: Date.now()
          }), { qos: 1 });
        }

        this.loadLeaderboardData();
      },

      computeRankedList(scoreKey) {
        const classStudents = this.data.students.filter(s => s.classId === this.currentClass);
        
        classStudents.forEach(st => {
          let score = Number(st[scoreKey]);
          if (isNaN(score) || score < -999) {
            st[scoreKey] = 0;
          } else {
            st[scoreKey] = Math.floor(score);
          }
        });

        const sorted = [...classStudents].sort((a, b) => (b[scoreKey] - a[scoreKey]) || (a.seatNo - b.seatNo));

        let currentRank = 1;
        const rankedList = [];

        for (let i = 0; i < sorted.length; i++) {
          if (i > 0 && sorted[i][scoreKey] < sorted[i - 1][scoreKey]) {
            currentRank = i + 1;
          }
          rankedList.push({
            ...sorted[i],
            rank: currentRank
          });
        }
        return rankedList;
      },

      loadLeaderboardData() {
        const scoreKey = (this.rankingPeriod === 'weekly') ? 'weeklyScore' : 'totalScore';
        const rankedList = this.computeRankedList(scoreKey);

        const top1List = rankedList.filter(s => s.rank === 1);
        const top2List = rankedList.filter(s => s.rank === 2);
        const top3List = rankedList.filter(s => s.rank === 3);

        const s1Name = top1List.map(s => s.name).join('、') || '無';
        const s1Score = top1List[0] ? `${top1List[0][scoreKey]} 分` : '-- 分';
        const s2Name = top2List.map(s => s.name).join('、') || '無';
        const s2Score = top2List[0] ? `${top2List[0][scoreKey]} 分` : '-- 分';
        const s3Name = top3List.map(s => s.name).join('、') || '無';
        const s3Score = top3List[0] ? `${top3List[0][scoreKey]} 分` : '-- 分';

        document.getElementById('podiumName1').innerText = s1Name;
        document.getElementById('podiumScore1').innerText = s1Score;
        document.getElementById('podiumName2').innerText = s2Name;
        document.getElementById('podiumScore2').innerText = s2Score;
        document.getElementById('podiumName3').innerText = s3Name;
        document.getElementById('podiumScore3').innerText = s3Score;

        const tierBar = document.getElementById('top10TierBar');
        tierBar.innerHTML = "";

        if (this.rankingPeriod === 'total') {
          tierBar.classList.add('active');
          const tierStudents = rankedList.filter(s => s.rank >= 4 && s.rank <= 10);

          tierStudents.forEach((st) => {
            const card = document.createElement('div');
            card.className = "tier-card";
            card.id = `tierCard_${st.seatNo}`;
            card.dataset.rank = st.rank;
            card.innerHTML = `
              <div class="tier-rank">第 ${st.rank} 名</div>
              <div class="tier-name">${st.name}</div>
              <div class="tier-score">${st[scoreKey]} 分</div>
            `;
            tierBar.appendChild(card);
          });
        } else {
          tierBar.classList.remove('active');
        }

        const rankMap = new Map();
        rankedList.forEach(st => rankMap.set(st.seatNo, st.rank));

        const rosterGrid = document.getElementById('rosterSheetGrid');
        rosterGrid.innerHTML = "";
        const seatSorted = [...this.data.students.filter(s => s.classId === this.currentClass)].sort((a, b) => a.seatNo - b.seatNo);

        seatSorted.forEach(st => {
          const card = document.createElement('div');
          card.className = "roster-sheet-card";
          card.innerHTML = `
            <div class="card-row-top">
              <span class="card-seat-num">#${st.seatNo}</span>
              <span class="card-name-text">${st.name}</span>
            </div>
            <div class="card-row-bottom">
              <span class="card-score-text">${st[scoreKey]} 分</span>
              <span class="card-rank-text">第 ${rankMap.get(st.seatNo) || '--'} 名</span>
            </div>
          `;
          rosterGrid.appendChild(card);
        });
      },

      startRevealTheater() {
        SoundFx.init();
        const p1 = document.getElementById('podiumCol1');
        const p2 = document.getElementById('podiumCol2');
        const p3 = document.getElementById('podiumCol3');
        const sheet = document.getElementById('rosterParchmentSheet');

        p1.classList.remove('reveal');
        p2.classList.remove('reveal');
        p3.classList.remove('reveal');
        sheet.classList.remove('active-show');

        const tierCards = document.querySelectorAll('.tier-card');
        tierCards.forEach(c => c.classList.remove('reveal'));

        if (this.rankingPeriod === 'total') {
          const sortedCards = Array.from(tierCards).sort((a, b) => Number(b.dataset.rank) - Number(a.dataset.rank));
          let delay = 300;

          sortedCards.forEach(card => {
            const currentRank = Number(card.dataset.rank);
            setTimeout(() => {
              SoundFx.playTierPop(420 + (11 - currentRank) * 45);
              card.classList.add('reveal');
            }, delay);
            delay += 180;
          });

          setTimeout(() => {
            SoundFx.playDrumBeat();
            p3.classList.add('reveal');
          }, delay + 350);

          setTimeout(() => {
            SoundFx.playDrumBeat();
            p2.classList.add('reveal');
          }, delay + 1350);

          setTimeout(() => {
            SoundFx.playFanfareVictory();
            p1.classList.add('reveal');
            this.shootConfetti();

            setTimeout(() => {
              sheet.classList.add('active-show');
            }, 1800);
          }, delay + 2450);

        } else {
          setTimeout(() => {
            SoundFx.playDrumBeat();
            p3.classList.add('reveal');
          }, 500);

          setTimeout(() => {
            SoundFx.playDrumBeat();
            p2.classList.add('reveal');
          }, 1500);

          setTimeout(() => {
            SoundFx.playFanfareVictory();
            p1.classList.add('reveal');
            this.shootConfetti();

            setTimeout(() => {
              sheet.classList.add('active-show');
            }, 2000);
          }, 2700);
        }
      },

      /*
      ======================================================================
      計分與幹部設定 (長按學生設定固定加分)
      ======================================================================
      */
      renderStudentCards() {
        const grid = document.getElementById('studentGrid');
        if (!grid) return;
        grid.innerHTML = "";
        const currentList = this.data.students.filter(s => s.classId === this.currentClass);
        currentList.sort((a, b) => a.seatNo - b.seatNo);

        currentList.forEach(s => {
          const card = document.createElement('div');
          card.className = "student-touch-card";
          
          const bonusVal = Number(s.weeklyBonus) || 0;
          const hasBonus = bonusVal > 0;

          card.innerHTML = `
            <span class="card-seat-tag">#${s.seatNo}</span>
            ${hasBonus ? `<span class="card-star-badge" title="幹部每週固定加分 +${bonusVal}">⭐+${bonusVal}</span>` : ''}
            <div class="card-student-name">${s.name}</div>
            <div class="card-score-value">${s.totalScore}</div>
          `;

          card.onclick = () => {
            if (this.longPressFired) {
              this.longPressFired = false;
              return;
            }
            this.recordScore(s);
          };

          let pressTimer = null;
          const startPress = () => {
            this.longPressFired = false;
            pressTimer = setTimeout(() => {
              this.longPressFired = true;
              if (navigator.vibrate) navigator.vibrate(35);
              this.promptConfigureCadre(s);
            }, 550);
          };
          const cancelPress = () => {
            if (pressTimer) clearTimeout(pressTimer);
          };

          card.ontouchstart = startPress;
          card.ontouchend = cancelPress;
          card.ontouchcancel = cancelPress;
          card.onmousedown = startPress;
          card.onmouseup = cancelPress;
          card.onmouseleave = cancelPress;

          grid.appendChild(card);
        });
      },

      promptConfigureCadre(student) {
        const currentBonus = Number(student.weeklyBonus) || 0;
        const input = prompt(
          `【設定幹部每週固定加分】\n學員：#${student.seatNo} ${student.name}\n\n` +
          `• 輸入點數（例如：3 代表每週一自動加 3 分）\n` +
          `• 輸入 0 或留白：取消幹部身份並移除星號\n\n目前設定點數：`,
          currentBonus
        );
        if (input === null) return;

        const bonusVal = parseInt(input.trim(), 10);
        student.weeklyBonus = isNaN(bonusVal) ? 0 : Math.max(0, bonusVal);

        this.saveStorageData();
        this.renderStudentCards();
        this.pushScoresToCloud();

        if (student.weeklyBonus > 0) {
          alert(`✨ 已成功設定【#${student.seatNo} ${student.name}】每週固定加 +${student.weeklyBonus} 分！卡片已標註星號 ⭐`);
        } else {
          alert(`已取消【#${student.seatNo} ${student.name}】的幹部設定，星號已移除。`);
        }
      },

      selectWeight(val) {
        this.currentWeight = val;
        document.querySelectorAll('.weight-chip').forEach(btn => {
          btn.classList.toggle('active', btn.innerText === (val > 0 ? `+${val}` : `${val}`));
        });
      },

      recordScore(student) {
        if (navigator.vibrate) navigator.vibrate(18);

        student.totalScore += this.currentWeight;
        student.weeklyScore += this.currentWeight;
        this.saveStorageData();
        this.renderStudentCards();

        this.setSyncStatus('pending');
        clearTimeout(this.syncTimer);
        this.syncTimer = setTimeout(() => {
          this.pushScoresToCloud();
        }, CONFIG.DEBOUNCE_DELAY);
      },

      async pushScoresToCloud() {
        if (!CONFIG.GAS_API_URL || CONFIG.GAS_API_URL.includes("SAMPLE")) {
          this.setSyncStatus('synced');
          return;
        }

        try {
          const payload = {
            action: 'sync_scores',
            data: this.data.students,
            weekKey: this.data.currentWeekKey || '第1週'
          };
          const response = await fetch(CONFIG.GAS_API_URL, {
            method: 'POST',
            mode: 'cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(payload)
          });
          const res = await response.json();
          if (res.status === 'success') {
            this.setSyncStatus('synced');
          } else {
            this.setSyncStatus('error');
          }
        } catch (err) {
          this.setSyncStatus('error');
        }
      },

      loadRosterManagerText() {
        const list = this.data.students.filter(s => s.classId === this.currentClass);
        list.sort((a, b) => a.seatNo - b.seatNo);
        const lines = list.map(s => `${s.seatNo} ${s.name} ${s.totalScore} ${s.weeklyScore}`);
        const inputElem = document.getElementById('rosterBatchInput');
        if (inputElem) {
          inputElem.value = lines.join('\n');
        }
      },

      async applyBatchRoster() {
        const raw = document.getElementById('rosterBatchInput').value.trim();
        if (!raw) return;

        const lines = raw.split('\n');
        const parsed = [];
        
        lines.forEach(line => {
          const parts = line.trim().split(/[\t\s,]+/);
          if (parts.length >= 2) {
            const seat = parseInt(parts[0], 10);
            const name = parts[1];
            const total = parts.length >= 3 ? parseInt(parts[2], 10) : 0;
            const weekly = parts.length >= 4 ? parseInt(parts[3], 10) : 0;
            if (!isNaN(seat) && name) {
              parsed.push({
                classId: this.currentClass,
                seatNo: seat,
                name: name,
                weeklyBonus: 0,
                baseScore: Math.max(0, total - weekly),
                totalScore: isNaN(total) ? 0 : total,
                weeklyScore: isNaN(weekly) ? 0 : weekly
              });
            }
          }
        });

        if (parsed.length === 0) {
          alert('名冊格式解析失敗，請確保每行有座號與姓名（例如：1 王小明 或 1 王小明 20 5）');
          return;
        }

        this.data.students = this.data.students.filter(s => s.classId !== this.currentClass).concat(parsed);
        this.saveStorageData();
        this.renderStudentCards();
        alert(`✨ ${this.currentClass} 班名冊更新成功，共 ${parsed.length} 位學員！正在同步至 Google 試算表...`);

        if (CONFIG.GAS_API_URL && !CONFIG.GAS_API_URL.includes("SAMPLE")) {
          try {
            const res = await fetch(CONFIG.GAS_API_URL, {
              method: 'POST',
              mode: 'cors',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify({
                action: 'update_roster',
                classId: this.currentClass,
                students: parsed
              })
            });
            const json = await res.json();
            if (json.status === 'success') {
              alert(`🟢 Google 試算表【${this.currentClass}】分頁已同步完成！`);
            }
          } catch (e) {
            console.warn("名冊雲端同步暫緩", e);
          }
        }
      },

      async promptAddNewClass() {
        const newClassId = prompt("請輸入新班級名稱代號（例如：104）：");
        if (!newClassId) return;
        const cleanId = newClassId.trim();

        if (this.data.classes.includes(cleanId)) {
          alert("該班級已存在！");
          return;
        }

        this.data.classes.push(cleanId);
        this.currentClass = cleanId;
        for (let i = 1; i <= 20; i++) {
          this.data.students.push({
            classId: cleanId,
            seatNo: i,
            name: `學員 ${i} 號`,
            weeklyBonus: 0,
            baseScore: 0,
            totalScore: 0,
            weeklyScore: 0
          });
        }

        this.saveStorageData();
        this.renderAllClassTabs();
        this.populateLeaderboardSelect();
        this.initNotesUnitSelector();
        this.loadRosterManagerText();
        this.renderStudentCards();

        alert(`✨ 班級【${cleanId}】已於本機建立！正在於 Google 試算表建立新分頁...`);

        if (CONFIG.GAS_API_URL && !CONFIG.GAS_API_URL.includes("SAMPLE")) {
          try {
            await fetch(CONFIG.GAS_API_URL, {
              method: 'POST',
              mode: 'cors',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify({ action: 'create_class', classId: cleanId })
            });
          } catch (e) {
            console.warn("班級雲端建立延遲", e);
          }
        }
      },

      async promptDeleteCurrentClass() {
        if (this.data.classes.length <= 1) {
          alert("系統至少需保留一個班級，無法全數刪除！");
          return;
        }

        const isPermanent = confirm(
          `確定要移除【${this.currentClass} 班】嗎？\n\n` +
          `• 點選【確定】：安全隱藏封存（試算表更名為 _ARCHIVE_${this.currentClass}，保留歷史成績）\n` +
          `• 點選【取消】：放棄操作`
        );
        if (!isPermanent) return;

        const reallyPermanent = confirm(`【進階選項確認】\n是否要「永久徹底刪除」該試算表分頁？\n\n• 按【確定】= 永久徹底抹除\n• 按【取消】= 僅安全封存（推薦）`);

        const targetClass = this.currentClass;
        this.data.classes = this.data.classes.filter(c => c !== targetClass);
        this.data.students = this.data.students.filter(s => s.classId !== targetClass);
        this.data.notes = this.data.notes.filter(n => n.classId !== targetClass);
        this.currentClass = this.data.classes[0];

        this.saveStorageData();
        this.renderAllClassTabs();
        this.populateLeaderboardSelect();
        this.initNotesUnitSelector();
        this.loadRosterManagerText();
        this.renderStudentCards();

        alert(`已從系統移除【${targetClass} 班】！正在同步至 Google 試算表...`);

        if (CONFIG.GAS_API_URL && !CONFIG.GAS_API_URL.includes("SAMPLE")) {
          try {
            await fetch(CONFIG.GAS_API_URL, {
              method: 'POST',
              mode: 'cors',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify({
                action: 'delete_class',
                classId: targetClass,
                permanent: reallyPermanent
              })
            });
          } catch (e) {
            console.warn("班級雲端移除延遲", e);
          }
        }
      },

      async fetchCloudData(isSilent = false) {
        if (!CONFIG.GAS_API_URL || CONFIG.GAS_API_URL.includes("SAMPLE")) return;
        try {
          const res = await fetch(CONFIG.GAS_API_URL + "?action=fetch_all&t=" + Date.now());
          const json = await res.json();
          if (json.status === 'success' && json.classes && json.classes.length > 0) {
            this.data.classes = json.classes;
            if (!this.data.classes.includes(this.currentClass)) {
              this.currentClass = this.data.classes[0];
            }
            this.data.students = json.students || [];
            if (json.password) this.data.adminPassword = json.password;
            if (json.notes && json.notes.length > 0) {
              this.data.notes = json.notes;
            }
            this.sanitizeScores();
            this.saveStorageData();
            
            this.renderAllClassTabs();
            this.populateLeaderboardSelect();
            if (document.getElementById('view-workspace').classList.contains('active')) {
              this.renderStudentCards();
              this.initNotesUnitSelector();
            }
            if (document.getElementById('view-roster-manager').classList.contains('active')) {
              this.loadRosterManagerText();
            }
            if (document.getElementById('view-leaderboard').classList.contains('active') && !this.isTvStandby) {
              this.loadLeaderboardData();
            }
          }
        } catch (e) {
          if (!isSilent) console.log("離線或後台拉取靜默跳過");
        }
      },

      setSyncStatus(status) {
        const gem = document.getElementById('cloudSyncIndicator');
        if (!gem) return;
        gem.className = 'sync-gem';
        if (status === 'pending') gem.classList.add('pending');
        if (status === 'error') gem.classList.add('error');
      },

      initCanvasConfetti() {
        const cvs = document.getElementById('confettiCanvas');
        if (!cvs) return;
        cvs.width = window.innerWidth;
        cvs.height = window.innerHeight;
        window.addEventListener('resize', () => {
          cvs.width = window.innerWidth;
          cvs.height = window.innerHeight;
        });
      },

      shootConfetti() {
        const cvs = document.getElementById('confettiCanvas');
        if (!cvs) return;
        const ctx = cvs.getContext('2d');
        const sparks = [];
        const pal = ['#ffd700', '#f7e49a', '#ffffff', '#2ecc71', '#d4af37'];

        for (let i = 0; i < 90; i++) {
          sparks.push({
            x: cvs.width / 2,
            y: cvs.height * 0.45,
            vx: (Math.random() - 0.5) * 16,
            vy: (Math.random() - 0.75) * 15,
            size: Math.random() * 5 + 3,
            color: pal[Math.floor(Math.random() * pal.length)],
            life: 1
          });
        }

        function step() {
          ctx.clearRect(0, 0, cvs.width, cvs.height);
          let running = false;
          sparks.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.28;
            p.life -= 0.012;
            if (p.life > 0) {
              running = true;
              ctx.save();
              ctx.globalAlpha = p.life;
              ctx.fillStyle = p.color;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            }
          });
          if (running) requestAnimationFrame(step);
        }
        step();
      }
    };

    window.addEventListener('DOMContentLoaded', () => App.init());
  </script>
