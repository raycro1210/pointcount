<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>魔法學院教務魔導系統</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚜️</text></svg>">
  <style>
    :root {
      --bg: #071912;
      --card-bg: linear-gradient(145deg, #103628, #071e16);
      --card-act: #184c39;
      --border: #1d5541;
      --gold: #d4af37;
      --gold-l: #f7e49a;
      --parch: #f6f1e3;
      --parch-b: #ded3b8;
      --text: #f0f7f4;
      --font-serif: "Cinzel", "Noto Serif TC", serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body { width: 100%; height: 100%; height: 100dvh; background: var(--bg); color: var(--text); font-family: var(--font-sans); overflow: hidden; }
    header { display: none; height: 50px; background: #05140e; border-bottom: 2px solid var(--gold); padding: 0 8px; justify-content: space-between; align-items: center; z-index: 50; }
    header.auth { display: flex; }
    .brand { font-family: var(--font-serif); font-size: 0.95rem; color: var(--gold); display: flex; align-items: center; gap: 4px; }
    .header-acts { display: flex; gap: 4px; align-items: center; }
    .badge { font-size: 0.72rem; padding: 2px 6px; border-radius: 4px; border: 1px solid #7f8c8d; color: #95a5a6; }
    .badge.on { border-color: #2ecc71; color: #2ecc71; background: rgba(46,204,113,0.15); }
    .btn-nav { background: rgba(212,175,55,0.12); border: 1px solid var(--gold); color: var(--gold-l); padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 0.78rem; font-family: var(--font-serif); }
    .btn-nav.active { background: var(--gold); color: #071912; font-weight: bold; }
    .gem { width: 10px; height: 10px; border-radius: 50%; background: #2ecc71; display: inline-block; }
    .gem.pend { background: #f39c12; }
    .gem.err { background: #e74c3c; }
    .viewport { width: 100%; height: calc(100% - 50px); position: relative; }
    .panel { position: absolute; inset: 0; display: none; flex-direction: column; background: var(--bg); z-index: 10; }
    .panel.active { display: flex !important; z-index: 20; }
    #view-gate { position: absolute; inset: 0; height: 100dvh; background: radial-gradient(circle, #103326 0%, #030a07 100%); justify-content: center; align-items: center; z-index: 100; display: flex; }
    .gate-portal { position: absolute; inset: 0; display: flex; pointer-events: none; z-index: 10; }
    .gate-door { width: 50%; height: 100%; background: #081c14; border-bottom: 4px solid var(--gold); transition: transform 0.8s ease; }
    .gate-door.l { border-right: 2px solid var(--gold); transform-origin: left center; }
    .gate-door.r { border-left: 2px solid var(--gold); transform-origin: right center; }
    #view-gate.open .gate-door.l { transform: rotateY(-100deg); }
    #view-gate.open .gate-door.r { transform: rotateY(100deg); }
    .gate-card { position: relative; z-index: 20; width: 90%; max-width: 360px; background: rgba(11,37,28,0.96); border: 2px solid var(--gold); border-radius: 10px; padding: 20px; text-align: center; }
    .pwd-ipt { width: 100%; padding: 10px; font-size: 1.1rem; text-align: center; background: #040f0b; border: 1.5px solid var(--gold); color: var(--gold-l); border-radius: 6px; outline: none; margin: 12px 0; }
    .btn-gold { width: 100%; padding: 10px; font-family: var(--font-serif); font-size: 0.95rem; font-weight: bold; color: #071912; background: linear-gradient(180deg, var(--gold-l), var(--gold)); border: none; border-radius: 6px; cursor: pointer; }
    .tabs-bar { display: flex; overflow-x: auto; gap: 6px; padding: 6px 10px; background: #0b251c; border-bottom: 1px solid rgba(212,175,55,0.25); flex-shrink: 0; }
    .tab-pill { padding: 4px 12px; border-radius: 16px; border: 1px solid var(--gold); background: rgba(0,0,0,0.3); color: #cbdad3; font-size: 0.82rem; white-space: nowrap; cursor: pointer; }
    .tab-pill.active { background: var(--gold); color: #071912; font-weight: bold; }
    .phone-bar { display: flex; background: #05140e; border-bottom: 1px solid rgba(212,175,55,0.3); flex-shrink: 0; }
    .phone-btn { flex: 1; padding: 8px; background: transparent; border: none; color: #9cb5ab; font-size: 0.88rem; cursor: pointer; }
    .phone-btn.active { color: var(--gold-l); background: rgba(212,175,55,0.12); border-bottom: 2px solid var(--gold); font-weight: bold; }
    .split { flex: 1; display: flex; overflow: hidden; position: relative; }
    .col-score { flex: 1; display: flex; flex-direction: column; height: 100%; }
    .guide-banner { background: #0c2b20; border-bottom: 1px solid var(--gold); padding: 6px 10px; display: flex; justify-content: space-between; align-items: center; white-space: nowrap; flex-shrink: 0; }
    .btn-settle { background: rgba(212,175,55,0.18); border: 1px solid var(--gold); color: var(--gold-l); font-size: 0.74rem; font-weight: bold; padding: 3px 8px; border-radius: 4px; cursor: pointer; }
    .btn-settle.dirty { background: rgba(243,156,18,0.35); border-color: #f39c12; color: #ffd280; }
    .grid { flex: 1; overflow-y: auto; padding: 8px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; align-content: start; }
    .card { background: var(--card-bg); border: 1.5px solid var(--border); border-radius: 6px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; position: relative; cursor: pointer; }
    .card:active { transform: scale(0.97); background: var(--card-act); }
    .card-seat { position: absolute; top: 4px; left: 6px; font-size: 0.7rem; color: #9cb5ab; }
    .card-star { position: absolute; top: 4px; right: 6px; font-size: 0.75rem; color: #ffd700; font-weight: bold; background: rgba(0,0,0,0.5); padding: 0 4px; border-radius: 8px; }
    .card-name { font-size: 1.05rem; font-weight: bold; color: #fff; margin: 2px 0; }
    .card-score { font-size: 1.25rem; font-family: var(--font-serif); font-weight: bold; color: var(--gold); }
    .bottom-bar { height: 50px; background: #05140e; border-top: 1.5px solid var(--gold); padding: 0 8px; display: flex; justify-content: space-around; align-items: center; gap: 4px; flex-shrink: 0; }
    .chip { flex: 1; height: 36px; border: 1px solid rgba(212,175,55,0.4); border-radius: 4px; background: rgba(212,175,55,0.08); color: var(--gold-l); font-size: 0.95rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .chip.active { background: var(--gold); color: #071912; }
    
    /* 備課筆記樣式 */
    .col-notes { flex: 1; display: none; flex-direction: column; background: var(--parch); color: #201e19; height: 100%; overflow: hidden; }
    .col-notes.phone-on { display: flex; }
    .notes-bar { padding: 6px 8px; background: #ebdcc0; border-bottom: 1px solid var(--parch-b); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px; flex-shrink: 0; }
    .notes-bar-row { display: flex; width: 100%; gap: 4px; align-items: center; }
    .notes-tools { display: none; flex-wrap: wrap; align-items: center; gap: 3px; padding: 4px 6px; background: #dfcfaf; border-bottom: 1px solid #c9b896; flex-shrink: 0; }
    .notes-tools.on { display: flex; }
    .btn-tool { background: #fff; border: 1px solid #bdae93; border-radius: 3px; padding: 2px 6px; font-size: 0.78rem; cursor: pointer; }
    .btn-tool:hover { background: #fdfaf2; }
    .tool-color { width: 22px; height: 22px; padding: 0; border: 1px solid #bdae93; border-radius: 3px; cursor: pointer; vertical-align: middle; }
    .notes-box { flex: 1; padding: 12px 16px; outline: none; overflow-y: auto; font-size: 1rem; line-height: 1.6; }
    .notes-box ul, .notes-box ol { padding-left: 24px; margin: 4px 0; }
    .marker { background: rgba(241,196,15,0.3); border-left: 4px solid #f39c12; padding: 2px 6px; border-radius: 0 4px 4px 0; }
    .marker-badge { background: #e67e22; color: #fff; font-size: 0.7rem; font-weight: bold; padding: 1px 4px; border-radius: 6px; margin-right: 4px; }
    
    @media (min-width: 680px) {
      .phone-bar { display: none !important; }
      .col-notes { flex: 0 0 50% !important; display: flex !important; order: 1; border-right: 2px solid var(--gold); }
      .col-score { flex: 0 0 50% !important; display: flex !important; order: 2; }
    }
    
    #view-leaderboard { background: radial-gradient(circle, #0e3527 0%, #030c08 100%); overflow-y: auto; align-items: center; }
    .podium { width: 92%; max-width: 760px; display: flex; justify-content: center; align-items: flex-end; gap: 10px; margin: 16px 0; min-height: 230px; }
    .podium-col { flex: 1; display: flex; flex-direction: column; align-items: center; }
    .podium-badge { background: rgba(11,37,28,0.95); border: 1.5px solid var(--gold); border-radius: 6px; padding: 6px; text-align: center; margin-bottom: 6px; width: 100%; min-height: 60px; display: flex; flex-direction: column; justify-content: center; }
    .p-name { font-size: clamp(0.8rem, 2vw, 1.05rem); font-weight: bold; color: #fff; line-height: 1.3; word-break: break-word; white-space: normal; }
    .p-score { font-family: var(--font-serif); font-size: 0.85rem; color: var(--gold-l); margin-top: 2px; }
    .podium-box { width: 100%; display: flex; justify-content: center; align-items: center; font-family: var(--font-serif); font-weight: bold; color: #05140e; border-radius: 6px 6px 0 0; }
    .p1 .podium-box { height: 125px; background: linear-gradient(180deg, #ffd700, #b8860b); font-size: 2rem; }
    .p2 .podium-box { height: 95px; background: linear-gradient(180deg, #e6e6e6, #8c8c8c); font-size: 1.6rem; }
    .p3 .podium-box { height: 75px; background: linear-gradient(180deg, #cd7f32, #7c471d); font-size: 1.4rem; }
    .roster-sheet { width: 92%; max-width: 820px; background: rgba(9,29,22,0.95); border: 2px solid var(--gold); border-radius: 8px; padding: 12px; margin-bottom: 30px; }
    .roster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .roster-card { background: rgba(255,255,255,0.06); border: 1px solid rgba(212,175,55,0.25); border-radius: 4px; padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; font-size: 0.82rem; }
    .mgr-box { max-width: 600px; margin: 16px auto; background: #0b251c; border: 1.5px solid var(--gold); border-radius: 8px; padding: 16px; width: 92%; }
    .mgr-txt { width: 100%; height: 200px; background: #04130d; border: 1px solid var(--border); border-radius: 4px; color: #fff; padding: 10px; font-family: monospace; font-size: 0.88rem; outline: none; margin: 10px 0; }
    
    /* 複製筆記對話框 */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 1000; justify-content: center; align-items: center; }
    .modal-card { background: #0b251c; border: 2px solid var(--gold); border-radius: 8px; padding: 16px; width: 90%; max-width: 360px; color: #fff; }
    .modal-card input[type="text"] { width: 100%; padding: 6px; background: #04130d; border: 1px solid var(--border); color: #fff; margin: 8px 0; border-radius: 4px; }
  </style>
</head>
<body>
  <header id="header">
    <div class="brand"><span>⚜️</span> <span>魔導系統</span></div>
    <div class="header-acts">
      <span class="badge" id="tvBadge">🖥️ 離線</span>
      <span class="gem" id="syncGem"></span>
      <button class="btn-nav active" onclick="App.switchView('workspace')">後台</button>
      <button class="btn-nav" onclick="App.switchView('leaderboard')">榮譽榜</button>
      <button class="btn-nav" onclick="App.switchView('roster')">名冊</button>
      <button class="btn-nav" style="border-color:#e74c3c; color:#ff9999;" onclick="App.logout()">登出</button>
    </div>
  </header>
  
  <main class="viewport">
    <section id="view-gate">
      <div class="gate-portal"><div class="gate-door l"></div><div class="gate-door r"></div></div>
      <div class="gate-card">
        <h2 style="font-family:var(--font-serif); color:var(--gold-l);">魔法學院門扉</h2>
        <div id="gateVer" style="font-size:0.8rem; color:#ffd700; margin:6px 0;">⚜️ 核心版本：加載中 ⚜️</div>
        <div id="gateForm">
          <input type="password" id="pwdIpt" class="pwd-ipt" placeholder="••••" maxlength="8">
          <button class="btn-gold" onclick="App.auth()">驗證導師印記</button>
          <button class="btn-nav" style="width:100%; margin-top:8px; padding:8px;" id="btnStandby" onclick="App.startTvStandby()">🖥️ 電腦大螢幕待命</button>
        </div>
        <div id="gateLinks" style="display:none; flex-direction:column; gap:6px; margin-top:10px;">
          <button class="btn-gold" onclick="App.enter('workspace')">進入課堂後台 ➔</button>
          <button class="btn-gold" onclick="App.enter('leaderboard')">進入榮譽榜單 ➔</button>
          <button class="btn-gold" onclick="App.enter('roster')">進入名冊管理 ➔</button>
        </div>
      </div>
    </section>

    <section id="view-workspace" class="panel">
      <div class="phone-bar">
        <button class="phone-btn active" id="btnPScore" onclick="App.togglePhone('score')">⚔️ 計分面板</button>
        <button class="phone-btn" id="btnPNotes" onclick="App.togglePhone('notes')">📜 備課卷軸</button>
      </div>
      <div class="tabs-bar" id="wsTabs"></div>
      <div class="split">
        <!-- 備課筆記卷軸 (支援週次篩選連動 + 日期降序 + 完整富文本) -->
        <div class="col-notes" id="colNotes">
          <div class="notes-bar">
            <div class="notes-bar-row">
              <select id="selNoteWeek" style="flex:0 0 85px; padding:3px; font-size:0.8rem;" onchange="App.onNoteWeekFilterChange()"></select>
              <select id="selUnit" style="flex:1; min-width:0; padding:3px; font-size:0.8rem;" onchange="App.onUnitChange()"></select>
              <button class="btn-tool" onclick="App.addUnit()" title="新增教學單元">➕</button>
              <button class="btn-tool" onclick="App.renameUnit()" title="更名">✏️</button>
              <button class="btn-tool" onclick="App.delUnit()" title="刪除單元">🗑️</button>
              <button class="btn-tool" id="btnEditNote" style="background:#27ae60; color:#fff; font-weight:bold;" onclick="App.toggleNoteMode()">📖 閱讀</button>
            </div>
          </div>
          <!-- 富文本編輯工具列 (px字級選單 + 粗斜底清單 + 原生調色盤 + 螢光筆 + 進度標記 + 跨班派發) -->
          <div class="notes-tools" id="noteTools">
            <select class="btn-tool" style="padding:1px 2px;" onchange="App.applyFontSize(this.value)">
              <option value="14px">14px</option>
              <option value="16px" selected>16px</option>
              <option value="18px">18px</option>
              <option value="22px">22px</option>
              <option value="26px">26px</option>
              <option value="32px">32px</option>
            </select>
            <button class="btn-tool" onclick="document.execCommand('bold')"><b>B</b></button>
            <button class="btn-tool" onclick="document.execCommand('italic')"><i>I</i></button>
            <button class="btn-tool" onclick="document.execCommand('underline')"><u>U</u></button>
            <label class="btn-tool" style="display:inline-flex; align-items:center; gap:2px;" title="文字顏色">
              🎨<input type="color" class="tool-color" value="#111111" onchange="document.execCommand('foreColor', false, this.value); App.triggerNoteAutoSave();">
            </label>
            <label class="btn-tool" style="display:inline-flex; align-items:center; gap:2px;" title="螢光底色">
              🖍️<input type="color" class="tool-color" value="#f1c40f" onchange="document.execCommand('hiliteColor', false, this.value); App.triggerNoteAutoSave();">
            </label>
            <button class="btn-tool" onclick="document.execCommand('insertUnorderedList')">• 項目</button>
            <button class="btn-tool" onclick="document.execCommand('insertOrderedList')">1. 編號</button>
            <button class="btn-tool" onclick="document.execCommand('indent')">⇥</button>
            <button class="btn-tool" onclick="document.execCommand('outdent')">⇤</button>
            <button class="btn-tool" style="background:#f1c40f; font-weight:bold;" onclick="App.addBookmark()">📍 設進度</button>
            <button class="btn-tool" style="background:#3498db; color:#fff;" onclick="App.openCopyModal()">📤 另存他班</button>
            <span id="noteSaveTag" style="font-size:0.7rem; color:#27ae60; display:none;">✔ 已存</span>
            <button class="btn-tool" style="background:#27ae60; color:#fff; font-weight:bold;" onclick="App.saveNote(false)">💾 存檔</button>
          </div>
          <div class="notes-box" id="noteEditor" contenteditable="false"></div>
        </div>

        <!-- 計分面板 -->
        <div class="col-score" id="colScore">
          <div class="guide-banner">
            <span style="color:#ffe680; font-size:0.75rem;">💡 長按設幹部｜點擊計分</span>
            <div style="display:flex; gap:6px; align-items:center;">
              <span id="bannerWeek" style="font-size:0.75rem; color:var(--gold-l); cursor:pointer;" onclick="App.promptEditWeek()">【第1週】 ✏️</span>
              <button class="btn-settle" id="btnSettle" onclick="App.settleScores()">☁️ 結算</button>
            </div>
          </div>
          <div class="grid" id="stGrid"></div>
          <div class="bottom-bar">
            <button class="chip" onclick="App.setWeight(-5)">-5</button>
            <button class="chip" onclick="App.setWeight(-2)">-2</button>
            <button class="chip" onclick="App.setWeight(-1)">-1</button>
            <button class="chip active" onclick="App.setWeight(1)">+1</button>
            <button class="chip" onclick="App.setWeight(2)">+2</button>
            <button class="chip" onclick="App.setWeight(5)">+5</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 榮譽榜單 -->
    <section id="view-leaderboard" class="panel">
      <div style="padding:8px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px; background:#05140e; border-bottom:1px solid rgba(212,175,55,0.3);">
        <div style="display:flex; gap:6px; align-items:center;">
          <select id="selLbClass" style="padding:4px; background:#081c14; border:1px solid var(--gold); color:#fff;" onchange="App.onLbClassChange()"></select>
          <button class="btn-nav" id="btnToggleRank" onclick="App.toggleRankType()">【週排行榜】</button>
          <select id="selLbWeek" style="padding:4px; background:#081c14; border:1px solid var(--gold); color:#fff;" onchange="App.onLbWeekChange()"></select>
        </div>
        <div style="display:flex; gap:6px;">
          <button class="btn-nav" style="background:var(--gold); color:#071912; font-weight:bold;" onclick="App.broadcastReveal()">📢 廣播大螢幕揭榜</button>
          <button class="btn-nav" style="border-color:#e67e22; color:#f39c12;" onclick="App.broadcastClose()">🚪 關閉大門</button>
        </div>
      </div>
      <div class="podium">
        <div class="podium-col p2"><div class="podium-badge"><div class="p-name" id="pn2">--</div><div class="p-score" id="ps2">-- 分</div></div><div class="podium-box">2</div></div>
        <div class="podium-col p1"><div class="podium-badge"><div class="p-name" id="pn1">--</div><div class="p-score" id="ps1">-- 分</div></div><div class="podium-box">1</div></div>
        <div class="podium-col p3"><div class="podium-badge"><div class="p-name" id="pn3">--</div><div class="p-score" id="ps3">-- 分</div></div><div class="podium-box">3</div></div>
      </div>
      <div class="roster-sheet">
        <h4 id="sheetTitle" style="color:var(--gold); text-align:center; margin-bottom:8px;">全班學員成績名冊</h4>
        <div class="roster-grid" id="rosterGrid"></div>
      </div>
    </section>

    <!-- 名冊管理 -->
    <section id="view-roster" class="panel">
      <div class="tabs-bar" id="rosterTabs"></div>
      <div class="mgr-box">
        <h3 id="rosterTitle" style="color:var(--gold);">班級名冊管理</h3>
        <p style="font-size:0.75rem; color:#9cb5ab; margin-top:4px;">格式：<code>1 王小明</code> 或 <code>1 王小明 20 5</code></p>
        <textarea id="rosterTxt" class="mgr-txt"></textarea>
        <div style="display:flex; gap:8px;">
          <button class="btn-gold" style="flex:2;" onclick="App.saveRoster()">💾 儲存並同步至試算表</button>
          <button class="btn-nav" style="flex:1; border-color:#e74c3c; color:#ff9999;" onclick="App.delClass()">🗑️ 刪除班級</button>
        </div>
      </div>
    </section>

    <!-- 跨班另存視窗 -->
    <div class="modal-overlay" id="copyModal">
      <div class="modal-card">
        <h4 style="color:var(--gold-l); margin-bottom:8px;">📤 另存筆記至其他班級</h4>
        <label style="font-size:0.75rem; color:#bdc3c7;">單元標題：</label>
        <input type="text" id="copyTitleIpt">
        <div style="display:flex; justify-content:space-between; align-items:center; margin:4px 0;">
          <span style="font-size:0.75rem; color:#bdc3c7;">勾選目標班級：</span>
          <button type="button" style="background:none; border:none; color:var(--gold-l); font-size:0.75rem; cursor:pointer;" onclick="App.toggleCopyAll()">全選/反選</button>
        </div>
        <div id="copyClassBoxes" style="display:grid; grid-template-columns:repeat(2, 1fr); gap:6px; max-height:120px; overflow-y:auto; padding:6px; background:rgba(0,0,0,0.3); border-radius:4px;"></div>
        <div style="display:flex; justify-content:flex-end; gap:6px; margin-top:10px;">
          <button class="btn-tool" onclick="App.closeCopyModal()">取消</button>
          <button class="btn-gold" style="width:auto; padding:4px 12px;" onclick="App.execCopy()">確認派發</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    /*
    ================================================================================
    🚨🚨🚨 【唯一設定區】請在此貼上您的 Google Apps Script 部署網址 (/exec) 🚨🚨🚨
    ================================================================================
    */
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxhgE9QmJTsMAl7USJrAKc5Ez8iU458L84BPzrSOPJTfOaVPFapD2TFmsgglrIbk-2XsA/exec";
    /*
    ================================================================================
    */
    const VERSION = "v2.9.0";
    const App = {
      curClass: "", weight: 1, rankType: "weekly", lbWeek: "第1週",
      filterNoteWeek: "ALL", isTv: false, isNoteEdit: false, activeNoteId: null,
      noteDirty: false, noteTimer: null, longFired: false,
      data: { classes: [], students: [], notes: [], curWeek: "第1週", weeks: ["第1週"], pwd: "8888", buf: {} },

      init() {
        document.getElementById('gateVer').innerText = `⚜️ 核心版本：${VERSION} ⚜️`;
        this.migrateAndLoadStorage();
        if (sessionStorage.getItem('magic_auth') === 'true') {
          this.authSuccess();
        }
        this.renderTabs();
        this.renderCards();
        this.initLbWeeks();
        this.initNotePaste();
        this.fetchCloud();
      },

      // 🌟 舊版儲存庫無縫自動遷移器 (救援舊筆記與計分)
      migrateAndLoadStorage() {
        const currentRaw = localStorage.getItem('magic_v290');
        if (currentRaw) {
          try {
            const p = JSON.parse(currentRaw);
            if (p && p.classes && p.classes.length > 0) {
              this.data = p;
              this.curClass = this.data.classes[0];
              return;
            }
          } catch(e) {}
        }

        // 自動從歷史版本救援筆記與名冊
        const legacyKeys = ['magic_academy_store_v270', 'magic_academy_store_v260', 'magic_academy_store_v250', 'magic_academy_store_v240', 'magic_v280'];
        for (let i = 0; i < legacyKeys.length; i++) {
          const raw = localStorage.getItem(legacyKeys[i]);
          if (raw) {
            try {
              const legacy = JSON.parse(raw);
              if (legacy && (legacy.notes || legacy.students)) {
                this.data.classes = legacy.classes || [];
                this.data.students = legacy.students || [];
                this.data.notes = legacy.notes || [];
                this.data.curWeek = legacy.currentWeekKey || legacy.curWeek || "第1週";
                this.data.weeks = legacy.allWeekKeys || legacy.weeks || ["第1週"];
                this.data.pwd = legacy.adminPassword || legacy.pwd || "8888";
                if (legacy.classes && legacy.classes.length > 0) this.curClass = legacy.classes[0];
                this.saveStorage();
                console.log(`✨ 成功從 ${legacyKeys[i]} 遷移復原歷史筆記與班級！`);
                return;
              }
            } catch(e) {}
          }
        }
      },
      saveStorage() { localStorage.setItem('magic_v290', JSON.stringify(this.data)); },

      auth() {
        const p = document.getElementById('pwdIpt').value.trim();
        if (p === (this.data.pwd || '8888') || p === '8888') {
          sessionStorage.setItem('magic_auth', 'true');
          this.authSuccess();
        } else {
          alert('印記不符！');
        }
      },
      authSuccess() {
        document.getElementById('gateForm').style.display = 'none';
        document.getElementById('gateLinks').style.display = 'flex';
      },
      enter(view) {
        const gate = document.getElementById('view-gate');
        gate.classList.add('open');
        setTimeout(() => {
          gate.style.display = 'none';
          document.getElementById('header').classList.add('auth');
          this.switchView(view);
        }, 600);
      },
      logout() {
        sessionStorage.removeItem('magic_auth');
        location.reload();
      },

      switchView(v) {
        if (this.noteDirty && v !== 'workspace') this.saveNote(true);
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.btn-nav').forEach(b => b.classList.remove('active'));
        const el = document.getElementById('view-' + v);
        if (el) el.classList.add('active');
        if (v === 'workspace') { this.renderCards(); this.renderTabs(); this.initNotes(); }
        if (v === 'leaderboard') { this.loadLeaderboard(); }
        if (v === 'roster') { this.loadRosterText(); }
      },

      togglePhone(m) {
        document.getElementById('colScore').style.display = (m === 'score') ? 'flex' : 'none';
        document.getElementById('colNotes').classList.toggle('phone-on', m === 'notes');
        document.getElementById('btnPScore').classList.toggle('active', m === 'score');
        document.getElementById('btnPNotes').classList.toggle('active', m === 'notes');
        if (m === 'notes') this.scrollBookmark();
      },

      renderTabs() {
        ['wsTabs', 'rosterTabs'].forEach(tid => {
          const bar = document.getElementById(tid);
          if (!bar) return;
          bar.innerHTML = "";
          this.data.classes.forEach(c => {
            const hasBuf = Object.keys(this.data.buf).some(k => k.startsWith(`${c}_`) && this.data.buf[k] !== 0);
            const b = document.createElement('button');
            b.className = `tab-pill ${c === this.curClass ? 'active' : ''}`;
            b.innerText = `${c} 班${hasBuf ? ' •' : ''}`;
            b.onclick = () => {
              if (this.noteDirty) this.saveNote(true);
              this.curClass = c;
              this.renderTabs();
              this.renderCards();
              this.initNotes();
              this.loadRosterText();
            };
            bar.appendChild(b);
          });
          const add = document.createElement('button');
          add.className = 'tab-pill';
          add.innerText = '➕ 新增';
          add.onclick = () => this.addClass();
          bar.appendChild(add);
        });
      },

      renderCards() {
        const g = document.getElementById('stGrid');
        if (!g) return;
        g.innerHTML = "";
        const list = this.data.students.filter(s => s.classId === this.curClass).sort((a,b) => a.seatNo - b.seatNo);
        const w = this.data.curWeek || "第1週";
        list.forEach(s => {
          const k = `${s.classId}_${w}_${s.seatNo}`;
          const delta = this.data.buf[k] || 0;
          const total = (s.totalScore || 0) + delta;
          const c = document.createElement('div');
          c.className = 'card';
          c.innerHTML = `
            <span class="card-seat">#${s.seatNo}</span>
            ${(s.weeklyBonus > 0) ? `<span class="card-star">⭐+${s.weeklyBonus}</span>` : ''}
            <div class="card-name">${s.name}</div>
            <div class="card-score">${delta >= 0 ? `+${delta}` : delta}</div>
            <div style="font-size:0.7rem; color:#9cb5ab;">總分: ${total}</div>
          `;
          let t;
          c.onmousedown = c.ontouchstart = () => {
            this.longFired = false;
            t = setTimeout(() => { this.longFired = true; this.setBonus(s); }, 1200);
          };
          c.onmouseup = c.ontouchend = () => clearTimeout(t);
          c.onclick = () => {
            if (this.longFired) return;
            this.data.buf[k] = delta + this.weight;
            this.saveStorage();
            this.renderCards();
            this.updateSettleUI();
          };
          g.appendChild(c);
        });
        this.updateSettleUI();
      },

      setWeight(w) {
        this.weight = w;
        document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.innerText === (w > 0 ? `+${w}` : `${w}`)));
      },

      setBonus(s) {
        const val = prompt(`【設定幹部每週固定加分】\n#${s.seatNo} ${s.name}\n輸入點數：`, s.weeklyBonus || 0);
        if (val === null) return;
        const b = Math.max(0, parseInt(val, 10) || 0);
        s.weeklyBonus = b;
        this.saveStorage();
        this.renderCards();
        fetch(GAS_API_URL, {
          method: 'POST', mode: 'cors', headers: {'Content-Type': 'text/plain'},
          body: JSON.stringify({ action: 'update_student_bonus', classId: this.curClass, seatNo: s.seatNo, weeklyBonus: b })
        });
      },

      promptEditWeek() {
        const cur = this.data.curWeek || "第1週";
        const w = prompt(`【切換或輸入自訂教學週次】\n目前為：${cur}\n現有週次：${(this.data.weeks||[]).join(', ')}\n請輸入新週次名稱：`, cur);
        if (!w || !w.trim()) return;
        const clean = w.trim().replace('周', '週');
        if (!this.data.weeks.includes(clean)) this.data.weeks.push(clean);
        this.data.curWeek = clean;
        this.saveStorage();
        this.renderCards();
        this.initLbWeeks();
        this.initNotes();
        fetch(GAS_API_URL, {
          method: 'POST', mode: 'cors', headers: {'Content-Type': 'text/plain'},
          body: JSON.stringify({ action: 'save_current_week', weekKey: clean })
        });
      },

      updateSettleUI() {
        const b = document.getElementById('btnSettle');
        const tag = document.getElementById('bannerWeek');
        const w = this.data.curWeek || "第1週";
        if (tag) tag.innerText = `【${w}】 ✏️`;
        const hasDirty = Object.keys(this.data.buf).some(k => k.startsWith(`${this.curClass}_${w}_`) && this.data.buf[k] !== 0);
        if (b) {
          b.innerText = `☁️ 結算${w}${hasDirty ? '*' : ''}`;
          b.classList.toggle('dirty', hasDirty);
        }
      },

      async settleScores() {
        const w = this.data.curWeek || "第1週";
        const modified = [];
        const prefix = `${this.curClass}_${w}_`;
        this.data.students.filter(s => s.classId === this.curClass).forEach(s => {
          const delta = this.data.buf[`${prefix}${s.seatNo}`] || 0;
          if (delta !== 0) modified.push({ seatNo: s.seatNo, name: s.name, deltaScore: delta });
        });
        if (modified.length === 0) return alert(`【${this.curClass} 班】在【${w}】無未結算分數！`);

        const b = document.getElementById('btnSettle');
        b.innerText = "⏳ 結算中...";
        try {
          const res = await fetch(GAS_API_URL, {
            method: 'POST', mode: 'cors', headers: {'Content-Type': 'text/plain'},
            body: JSON.stringify({ action: 'settle_incremental_scores', classId: this.curClass, incrementalList: modified, weekKey: w })
          });
          const json = await res.json();
          if (json.status === 'success') {
            modified.forEach(m => { this.data.buf[`${prefix}${m.seatNo}`] = 0; });
            (json.updatedStudents || []).forEach(u => {
              const st = this.data.students.find(s => s.classId === this.curClass && s.seatNo === u.seatNo);
              if (st) {
                if (!st.weekScores) st.weekScores = {};
                st.weekScores[w] = u.weeklyScore;
                if (u.totalScore) st.totalScore = u.totalScore;
              }
            });
            this.saveStorage();
            this.renderCards();
            b.innerText = `✔ ${w}已結算`;
            setTimeout(() => this.updateSettleUI(), 2500);
          } else { alert(json.message || '結算失敗'); }
        } catch(e) { alert('網路連線逾時，本機分數已完整保留！'); this.updateSettleUI(); }
      },

      /*
      ======================================================================
      備課筆記模組 (日期降序排序 + 週次關聯篩選 + 完整富文本工具)
      ======================================================================
      */
      initNotes() {
        const wSel = document.getElementById('selNoteWeek');
        if (wSel) {
          wSel.innerHTML = '<option value="ALL">全部週次</option>';
          (this.data.weeks || ["第1週"]).forEach(w => {
            const o = document.createElement('option');
            o.value = w;
            o.innerText = w;
            wSel.appendChild(o);
          });
          wSel.value = this.filterNoteWeek || "ALL";
        }
        this.renderUnitSelect();
      },

      onNoteWeekFilterChange() {
        this.filterNoteWeek = document.getElementById('selNoteWeek').value;
        this.renderUnitSelect();
      },

      // 🌟 嚴格日期由新到舊 (降序) 排序
      renderUnitSelect() {
        const sel = document.getElementById('selUnit');
        if (!sel || !this.curClass) return;
        sel.innerHTML = "";

        let classNotes = this.data.notes.filter(n => n.classId === this.curClass);
        if (this.filterNoteWeek !== 'ALL') {
          classNotes = classNotes.filter(n => (n.dateTitle || '').includes(this.filterNoteWeek));
        }

        // 依標題內含日期或 updatedAt 進行降序排序 (最新在最上面)
        classNotes.sort((a, b) => {
          const dA = a.dateTitle.match(/\d{4}[-/]\d{1,2}[-/]\d{1,2}/);
          const dB = b.dateTitle.match(/\d{4}[-/]\d{1,2}[-/]\d{1,2}/);
          if (dA && dB) return dB[0].localeCompare(dA[0]);
          return (b.updatedAt || 0) - (a.updatedAt || 0);
        });

        if (classNotes.length === 0) {
          const today = new Date().toISOString().split('T')[0];
          const def = {
            classId: this.curClass,
            noteId: `${this.curClass}_${Date.now()}`,
            dateTitle: `【${this.data.curWeek}】${today} (首堂課)`,
            content: '<div><b>📌 本單元重點：</b></div><ul><li>任務 1：</li></ul>'
          };
          this.data.notes.unshift(def);
          this.saveStorage();
          classNotes.push(def);
        }

        classNotes.forEach(n => {
          const opt = document.createElement('option');
          opt.value = n.noteId;
          opt.innerText = n.dateTitle;
          sel.appendChild(opt);
        });

        if (!this.activeNoteId || !classNotes.some(n => n.noteId === this.activeNoteId)) {
          this.activeNoteId = classNotes[0].noteId;
        }
        sel.value = this.activeNoteId;
        this.renderNoteContent();
      },

      onUnitChange() {
        if (this.noteDirty) this.saveNote(true);
        this.activeNoteId = document.getElementById('selUnit').value;
        this.renderNoteContent();
      },

      renderNoteContent() {
        const n = this.data.notes.find(x => x.noteId === this.activeNoteId);
        const editor = document.getElementById('noteEditor');
        if (n && editor) {
          editor.innerHTML = n.content || '';
          this.noteDirty = false;
          setTimeout(() => this.scrollBookmark(), 200);
        }
      },

      toggleNoteMode() {
        this.isNoteEdit = !this.isNoteEdit;
        const btn = document.getElementById('btnEditNote');
        const tools = document.getElementById('noteTools');
        const editor = document.getElementById('noteEditor');
        if (this.isNoteEdit) {
          btn.innerText = "✏️ 編輯中";
          btn.style.background = "#d35400";
          tools.classList.add('on');
          editor.contentEditable = "true";
        } else {
          if (this.noteDirty) this.saveNote(true);
          btn.innerText = "📖 閱讀中";
          btn.style.background = "#27ae60";
          tools.classList.remove('on');
          editor.contentEditable = "false";
          this.scrollBookmark();
        }
      },

      applyFontSize(px) {
        document.execCommand('fontSize', false, '7');
        const fonts = document.getElementById('noteEditor').getElementsByTagName('font');
        for (let i = 0; i < fonts.length; i++) {
          if (fonts[i].size === '7') {
            fonts[i].removeAttribute('size');
            fonts[i].style.fontSize = px;
          }
        }
        this.triggerNoteAutoSave();
      },

      addBookmark() {
        const s = window.getSelection();
        if (!s || !s.rangeCount) return alert('請先在筆記中選取位置！');
        
        // 移除舊標記
        const old = document.getElementById('noteEditor').querySelectorAll('.marker');
        old.forEach(el => {
          const badge = el.querySelector('.marker-badge');
          if (badge) badge.remove();
          const p = el.parentNode;
          while (el.firstChild) p.insertBefore(el.firstChild, el);
          el.remove();
        });

        const r = s.getRangeAt(0);
        const sp = document.createElement('span');
        sp.className = 'marker';
        sp.innerHTML = `<span class="marker-badge">📍 進度</span>`;
        if (!r.collapsed) sp.appendChild(r.extractContents());
        r.insertNode(sp);
        s.removeAllRanges();
        this.triggerNoteAutoSave();
      },

      scrollBookmark() {
        const m = document.getElementById('noteEditor').querySelector('.marker');
        if (m) m.scrollIntoView({ behavior: 'smooth', block: 'center' });
      },

      addUnit() {
        const today = new Date().toISOString().split('T')[0];
        const curW = this.data.curWeek || "第1週";
        const title = prompt('請輸入新教學單元日期與標題：', `【${curW}】${today} (第${this.data.notes.filter(n=>n.classId===this.curClass).length+1}單元)`);
        if (!title || !title.trim()) return;

        const newNote = {
          classId: this.curClass,
          noteId: `${this.curClass}_${Date.now()}`,
          dateTitle: title.trim(),
          content: '<div><b>📌 本單元重點：</b></div><ul><li>任務 1：</li></ul>'
        };
        this.data.notes.unshift(newNote);
        this.saveStorage();
        this.activeNoteId = newNote.noteId;
        this.initNotes();
        this.saveNote(true);
      },

      renameUnit() {
        const n = this.data.notes.find(x => x.noteId === this.activeNoteId);
        if (!n) return;
        const newT = prompt('修改目前單元名稱：', n.dateTitle);
        if (!newT || !newT.trim()) return;
        n.dateTitle = newT.trim();
        this.saveStorage();
        this.initNotes();
        this.saveNote(true);
      },

      delUnit() {
        const list = this.data.notes.filter(n => n.classId === this.curClass);
        if (list.length <= 1) return alert('本班至少需保留一個單元，無法刪除！');
        const n = this.data.notes.find(x => x.noteId === this.activeNoteId);
        if (!confirm(`確定要封存刪除【${n.dateTitle}】？`)) return;

        const delId = this.activeNoteId;
        this.data.notes = this.data.notes.filter(x => x.noteId !== delId);
        this.saveStorage();
        this.activeNoteId = null;
        this.initNotes();
        fetch(GAS_API_URL, {
          method: 'POST', mode: 'cors', headers: {'Content-Type': 'text/plain'},
          body: JSON.stringify({ action: 'archive_note', data: { noteId: delId } })
        });
      },

      triggerNoteAutoSave() {
        this.noteDirty = true;
        clearTimeout(this.noteTimer);
        this.noteTimer = setTimeout(() => {
          this.saveNote(true);
        }, 3000);
      },

      initNotePaste() {
        const ed = document.getElementById('noteEditor');
        if (!ed) return;
        ed.addEventListener('paste', (e) => {
          if (!this.isNoteEdit) return;
          e.preventDefault();
          const text = (e.clipboardData || window.clipboardData).getData('text/plain');
          if (!text) return;
          const clean = text.split(/\r?\n/).map(l => l.trim() ? `<div>${l.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>` : `<div><br></div>`).join('');
          document.execCommand('insertHTML', false, clean);
          this.triggerNoteAutoSave();
        });
        ed.addEventListener('input', () => this.triggerNoteAutoSave());
      },

      async saveNote(silent = false) {
        clearTimeout(this.noteTimer);
        const ed = document.getElementById('noteEditor');
        const n = this.data.notes.find(x => x.noteId === this.activeNoteId);
        if (!n || !ed) return;

        n.content = ed.innerHTML;
        this.noteDirty = false;
        this.saveStorage();

        const tag = document.getElementById('noteSaveTag');
        if (silent && tag) {
          tag.style.display = 'inline';
          setTimeout(() => { tag.style.display = 'none'; }, 2500);
        } else if (!silent) {
          alert('💾 筆記已成功儲存！');
        }

        fetch(GAS_API_URL, {
          method: 'POST', mode: 'cors', headers: {'Content-Type': 'text/plain'},
          body: JSON.stringify({ action: 'save_notes', data: n })
        });
      },

      openCopyModal() {
        const curN = this.data.notes.find(x => x.noteId === this.activeNoteId);
        if (!curN) return;
        document.getElementById('copyTitleIpt').value = curN.dateTitle;
        const box = document.getElementById('copyClassBoxes');
        box.innerHTML = "";
        const others = this.data.classes.filter(c => c !== this.curClass);
        if (others.length === 0) return alert('目前僅有單一班級，無需複製至他班！');
        others.forEach(c => {
          const l = document.createElement('label');
          l.style.fontSize = '0.82rem';
          l.innerHTML = `<input type="checkbox" name="cpClass" value="${c}" checked> 【${c}班】`;
          box.appendChild(l);
        });
        document.getElementById('copyModal').style.display = 'flex';
      },
      closeCopyModal() { document.getElementById('copyModal').style.display = 'none'; },
      toggleCopyAll() {
        const cbs = document.querySelectorAll('input[name="cpClass"]');
        const all = Array.from(cbs).every(c => c.checked);
        cbs.forEach(c => c.checked = !all);
      },
      execCopy() {
        const curN = this.data.notes.find(x => x.noteId === this.activeNoteId);
        const title = document.getElementById('copyTitleIpt').value.trim();
        if (!title) return alert('標題不可為空！');
        const targets = Array.from(document.querySelectorAll('input[name="cpClass"]:checked')).map(c => c.value);
        if (targets.length === 0) return alert('請至少勾選一個目標班級！');

        // 清除進度標記為純淨副本
        const temp = document.createElement('div');
        temp.innerHTML = document.getElementById('noteEditor').innerHTML;
        temp.querySelectorAll('.marker').forEach(m => {
          const b = m.querySelector('.marker-badge'); if (b) b.remove();
          const p = m.parentNode; while(m.firstChild) p.insertBefore(m.firstChild, m); m.remove();
        });
        const cleanContent = temp.innerHTML;

        const toSend = [];
        targets.forEach(cid => {
          const newN = { classId: cid, noteId: `${cid}_${Date.now()}_${Math.random().toString(36).substring(2,6)}`, dateTitle: title, content: cleanContent };
          this.data.notes.unshift(newN);
          toSend.push(newN);
        });
        this.saveStorage();
        this.closeCopyModal();
        alert(`✨ 成功派發至 ${targets.length} 個班級！`);

        fetch(GAS_API_URL, {
          method: 'POST', mode: 'cors', headers: {'Content-Type': 'text/plain'},
          body: JSON.stringify({ action: 'batch_save_notes', notesList: toSend })
        });
      },

      /*
      ======================================================================
      排行榜模組 (規則 A：分數梯隊制 + 方式 1：完整並列美感排版)
      ======================================================================
      */
      initLbWeeks() {
        const sel = document.getElementById('selLbWeek');
        if (!sel) return;
        sel.innerHTML = "";
        const all = (this.data.weeks || ["第1週"]);
        const curIdx = all.indexOf(this.data.curWeek || "第1週");
        let def = this.data.curWeek || "第1週";
        if (curIdx > 0) def = all[curIdx - 1]; // 預設展示前一週 (結算榜)
        else if (all.length > 1) def = all[0];
        this.lbWeek = def;

        all.forEach(w => {
          const opt = document.createElement('option');
          opt.value = w;
          opt.innerText = (w === this.data.curWeek) ? `${w} (進行中)` : `${w} (結算榜)`;
          sel.appendChild(opt);
        });
        sel.value = this.lbWeek;
      },
      onLbWeekChange() { this.lbWeek = document.getElementById('selLbWeek').value; this.loadLeaderboard(); },
      onLbClassChange() { this.curClass = document.getElementById('selLbClass').value; this.loadLeaderboard(); },
      toggleRankType() {
        this.rankType = (this.rankType === 'weekly') ? 'total' : 'weekly';
        document.getElementById('btnToggleRank').innerText = `【${this.rankType === 'weekly' ? '週排行榜' : '總排行榜'}】`;
        document.getElementById('selLbWeek').style.display = (this.rankType === 'weekly') ? 'inline-block' : 'none';
        this.loadLeaderboard();
      },

      loadLeaderboard() {
        const selC = document.getElementById('selLbClass');
        if (selC) {
          selC.innerHTML = "";
          this.data.classes.forEach(c => {
            const o = document.createElement('option'); o.value = c; o.innerText = `${c} 班`; selC.appendChild(o);
          });
          selC.value = this.curClass;
        }
        const isW = (this.rankType === 'weekly');
        const targetW = this.lbWeek || this.data.curWeek || "第1週";
        const list = this.data.students.filter(s => s.classId === this.curClass).map(s => {
          let sc = 0;
          if (isW) {
            const base = (s.weekScores && s.weekScores[targetW]) || 0;
            const delta = (targetW === this.data.curWeek) ? (this.data.buf[`${s.classId}_${targetW}_${s.seatNo}`] || 0) : 0;
            sc = base + (s.weeklyBonus || 0) + delta;
          } else {
            const delta = this.data.buf[`${s.classId}_${this.data.curWeek}_${s.seatNo}`] || 0;
            sc = (s.totalScore || 0) + delta;
          }
          return { ...s, sc: Math.floor(sc) };
        }).sort((a,b) => b.sc - a.sc || a.seatNo - b.seatNo);

        // 規則 A：依不重複分數梯隊提取金銀銅
        const tiers = Array.from(new Set(list.map(s => s.sc))).sort((a,b) => b - a);
        const t1 = list.filter(s => s.sc === tiers[0]);
        const t2 = list.filter(s => s.sc === tiers[1]);
        const t3 = list.filter(s => s.sc === tiers[2]);

        document.getElementById('pn1').innerText = t1.map(s => s.name).join('、') || '無';
        document.getElementById('ps1').innerText = t1.length ? `${tiers[0]} 分` : '-- 分';
        document.getElementById('pn2').innerText = t2.map(s => s.name).join('、') || '無';
        document.getElementById('ps2').innerText = t2.length ? `${tiers[1]} 分` : '-- 分';
        document.getElementById('pn3').innerText = t3.map(s => s.name).join('、') || '無';
        document.getElementById('ps3').innerText = t3.length ? `${tiers[2]} 分` : '-- 分';

        const rg = document.getElementById('rosterGrid');
        rg.innerHTML = "";
        list.slice().sort((a,b) => a.seatNo - b.seatNo).forEach(s => {
          const rank = list.findIndex(x => x.sc === s.sc) + 1;
          const d = document.createElement('div');
          d.className = 'roster-card';
          d.innerHTML = `<div style="display:flex; justify-content:space-between;"><b>#${s.seatNo} ${s.name}</b><span>第${rank}名</span></div><div style="color:var(--gold-l);">${s.sc} 分</div>`;
          rg.appendChild(d);
        });
      },

      /*
      ======================================================================
      原生 Google 長輪詢遠端通訊
      ======================================================================
      */
      startTvStandby() {
        this.isTv = true;
        document.getElementById('btnStandby').innerText = "🟢 電腦大螢幕待命中...";
        document.getElementById('btnStandby').disabled = true;
        document.getElementById('tvBadge').classList.add('on');
        document.getElementById('tvBadge').innerText = "🖥️ 在線";
        setInterval(async () => {
          if (!this.isTv) return;
          try {
            const res = await fetch(`${GAS_API_URL}?action=poll_remote_trigger&t=${Date.now()}`);
            const json = await res.json();
            if (json.status === 'success' && json.trigger && json.trigger.t > (this.lastTrigger || 0)) {
              this.lastTrigger = json.trigger.t;
              if (json.trigger.action === 'REVEAL') {
                this.curClass = json.trigger.classId;
                this.rankType = json.trigger.period;
                this.lbWeek = json.trigger.weekKey;
                this.enter('leaderboard');
              } else if (json.trigger.action === 'CLOSE') {
                location.reload();
              }
            }
          } catch(e) {}
        }, 1500);
      },

      broadcastReveal() {
        fetch(GAS_API_URL, {
          method: 'POST', mode: 'cors', headers: {'Content-Type': 'text/plain'},
          body: JSON.stringify({ action: 'set_remote_trigger', triggerData: { action: 'REVEAL', classId: this.curClass, period: this.rankType, weekKey: this.lbWeek, t: Date.now() } })
        });
        alert(`📢 已向電腦大螢幕發送揭榜指令！【${this.curClass}班 / ${this.lbWeek}】`);
      },
      broadcastClose() {
        fetch(GAS_API_URL, {
          method: 'POST', mode: 'cors', headers: {'Content-Type': 'text/plain'},
          body: JSON.stringify({ action: 'set_remote_trigger', triggerData: { action: 'CLOSE', t: Date.now() } })
        });
        alert('🚪 已命令電腦關門待命！');
      },

      /*
      ======================================================================
      名冊管理與班級增刪
      ======================================================================
      */
      loadRosterText() {
        document.getElementById('rosterTitle').innerText = `【${this.curClass} 班】名冊管理`;
        const list = this.data.students.filter(s => s.classId === this.curClass).sort((a,b) => a.seatNo - b.seatNo);
        const w = this.data.curWeek || "第1週";
        document.getElementById('rosterTxt').value = list.map(s => `${s.seatNo} ${s.name} ${s.totalScore||0} ${(s.weekScores&&s.weekScores[w])||0}`).join('\n');
      },
      saveRoster() {
        const lines = document.getElementById('rosterTxt').value.trim().split('\n');
        const parsed = [];
        const w = this.data.curWeek || "第1週";
        lines.forEach(l => {
          const p = l.trim().split(/[\s\t,]+/);
          if (p.length >= 2) {
            const seat = parseInt(p[0], 10);
            const name = p[1];
            const tot = parseInt(p[2], 10) || 0;
            const wk = parseInt(p[3], 10) || 0;
            const wObj = {}; wObj[w] = wk;
            if (!isNaN(seat) && name) {
              parsed.push({ classId: this.curClass, seatNo: seat, name: name, weeklyBonus: 0, baseScore: Math.max(0, tot - wk), totalScore: tot, weekScores: wObj });
            }
          }
        });
        if (parsed.length === 0) return alert('名冊解析失敗！');
        this.data.students = this.data.students.filter(s => s.classId !== this.curClass).concat(parsed);
        this.saveStorage();
        this.renderCards();
        fetch(GAS_API_URL, {
          method: 'POST', mode: 'cors', headers: {'Content-Type': 'text/plain'},
          body: JSON.stringify({ action: 'update_roster', classId: this.curClass, students: parsed })
        });
        alert(`✨ ${this.curClass} 班名冊更新成功！`);
      },
      addClass() {
        const c = prompt('請輸入新班級代號 (例如: 502)：');
        if (!c || this.data.classes.includes(c.trim())) return;
        const cid = c.trim();
        this.data.classes.push(cid);
        this.curClass = cid;
        this.saveStorage();
        this.renderTabs();
        this.renderCards();
        fetch(GAS_API_URL, {
          method: 'POST', mode: 'cors', headers: {'Content-Type': 'text/plain'},
          body: JSON.stringify({ action: 'create_class', classId: cid })
        });
      },
      delClass() {
        if (!confirm(`確定刪除【${this.curClass} 班】？`)) return;
        const target = this.curClass;
        this.data.classes = this.data.classes.filter(c => c !== target);
        this.data.students = this.data.students.filter(s => s.classId !== target);
        this.curClass = this.data.classes[0] || "";
        this.saveStorage();
        this.renderTabs();
        this.renderCards();
        fetch(GAS_API_URL, {
          method: 'POST', mode: 'cors', headers: {'Content-Type': 'text/plain'},
          body: JSON.stringify({ action: 'delete_class', classId: target, permanent: false })
        });
      },

      /*
      ======================================================================
      雲端同步與防覆蓋鎖
      ======================================================================
      */
      async fetchCloud() {
        try {
          const res = await fetch(`${GAS_API_URL}?action=fetch_all&t=${Date.now()}`);
          const json = await res.json();
          if (json.status === 'success' && json.classes && json.classes.length > 0) {
            if (this.data.classes.length === 0) { this.data.classes = json.classes; this.curClass = this.data.classes[0]; }
            if (json.allWeekKeys && json.allWeekKeys.length > 0) this.data.weeks = json.allWeekKeys;
            if (json.currentWeekKey && !this.data.curWeek) this.data.curWeek = json.currentWeekKey;
            if (json.password) this.data.pwd = json.password;

            // 備課筆記雲端安全回填 (防踩踏鎖：編輯中絕不覆寫)
            if (!this.isNoteEdit && !this.noteDirty) {
              if (json.notes && json.notes.length > 0) {
                this.data.notes = json.notes;
              }
            }

            const cloudSt = json.students || [];
            if (this.data.students.length === 0) {
              this.data.students = cloudSt;
            } else {
              cloudSt.forEach(cs => {
                const loc = this.data.students.find(s => s.classId === cs.classId && s.seatNo === cs.seatNo);
                if (loc) {
                  loc.weeklyBonus = cs.weeklyBonus || 0;
                  loc.baseScore = cs.baseScore || 0;
                  loc.totalScore = cs.totalScore || 0;
                  loc.weekScores = cs.weekScores || {};
                } else { this.data.students.push(cs); }
              });
            }
            this.saveStorage();
            this.renderTabs();
            this.renderCards();
            this.initLbWeeks();
            this.initNotes();
            document.getElementById('syncGem').className = 'gem';
          }
        } catch(e) { document.getElementById('syncGem').className = 'gem pend'; }
      }
    };
    window.addEventListener('DOMContentLoaded', () => App.init());
  </script>
</body>
