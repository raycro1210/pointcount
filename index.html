<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>魔法學院教務魔導系統</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚜️</text></svg>">
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    :root {
      --bg-dark: #071912;
      --emerald-dark: #0b251c;
      --emerald-light: #123e2f;
      --emerald-border: #1d5541;
      --gold-primary: #d4af37;
      --gold-light: #f7e49a;
      --gold-dark: #8c6d17;
      --gold-glow: rgba(212, 175, 55, 0.35);
      --parchment: #f6f1e3;
      --parchment-border: #ded3b8;
      --text-main: #f0f7f4;
      --text-dark: #201e19;
      --font-serif: "Cinzel", "Noto Serif TC", "KaiTi", "標楷體", serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-sans);
      overflow: hidden;
    }

    header {
      display: none;
      height: 52px;
      background: linear-gradient(180deg, #05140e 0%, var(--emerald-dark) 100%);
      border-bottom: 2px solid var(--gold-primary);
      padding: 0 8px;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 50;
      gap: 4px;
    }
    header.authorized { display: flex; }

    .brand-box {
      font-family: var(--font-serif);
      font-size: 0.95rem;
      color: var(--gold-primary);
      display: flex;
      align-items: center;
      gap: 4px;
      letter-spacing: 0.5px;
      white-space: nowrap;
      flex-shrink: 1;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions {
      display: flex;
      gap: 4px;
      align-items: center;
      flex-shrink: 0;
    }

    .tv-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 0.75rem;
      font-family: var(--font-sans);
      font-weight: bold;
      padding: 3px 6px;
      border-radius: 4px;
      background: rgba(0,0,0,0.4);
      border: 1px solid #7f8c8d;
      color: #95a5a6;
      transition: all 0.3s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .tv-status-badge.online {
      border-color: #2ecc71;
      color: #2ecc71;
      background: rgba(46, 204, 113, 0.15);
      box-shadow: 0 0 8px rgba(46, 204, 113, 0.35);
    }

    .btn-nav-magic {
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid var(--gold-primary);
      color: var(--gold-light);
      padding: 6px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      font-family: var(--font-serif);
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .btn-nav-magic:active, .btn-nav-magic.active {
      background: var(--gold-primary);
      color: var(--emerald-dark);
      font-weight: bold;
    }
    .btn-nav-logout {
      background: rgba(231, 76, 60, 0.2);
      border: 1px solid #e74c3c;
      color: #ff9999;
      padding: 6px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .sync-gem {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #2ecc71;
      box-shadow: 0 0 8px #2ecc71;
      display: inline-block;
      flex-shrink: 0;
      transition: all 0.3s;
    }
    .sync-gem.pending { background: #f39c12; box-shadow: 0 0 10px #f39c12; animation: gemPulse 1s infinite alternate; }
    .sync-gem.error { background: #e74c3c; box-shadow: 0 0 10px #e74c3c; }
    @keyframes gemPulse { from { transform: scale(1); } to { transform: scale(1.2); } }

    @media (max-width: 420px) {
      .brand-box span.brand-text { display: none; }
      .brand-box::after { content: "魔導系統"; font-size: 0.85rem; }
      .btn-nav-magic { padding: 5px 6px; font-size: 0.75rem; }
      .btn-nav-logout { padding: 5px 6px; font-size: 0.75rem; }
      .tv-status-badge { padding: 2px 4px; font-size: 0.7rem; }
    }

    .app-viewport { width: 100%; height: calc(100% - 52px); position: relative; }
    .view-panel {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      background: var(--bg-dark);
      z-index: 10;
    }
    .view-panel.active {
      display: flex !important;
      z-index: 20;
    }

    /* 1. 學院大門頁面 */
    #view-gate {
      position: absolute;
      inset: 0;
      height: 100dvh;
      background: radial-gradient(circle at center, #103326 0%, #030a07 100%);
      perspective: 1200px;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      z-index: 100;
    }
    .gate-portal { position: absolute; inset: 0; display: flex; pointer-events: none; z-index: 10; }
    .gate-door {
      width: 50%;
      height: 100%;
      background: linear-gradient(135deg, #0d2b20 0%, #05140e 100%);
      border-bottom: 4px solid var(--gold-primary);
      box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
      position: relative;
      transition: transform 1.2s cubic-bezier(0.4, 0.2, 0.2, 1);
    }
    .gate-door.left { border-right: 2px solid var(--gold-primary); transform-origin: left center; }
    .gate-door.right { border-left: 2px solid var(--gold-primary); transform-origin: right center; }
    .door-relief {
      position: absolute;
      inset: 28px;
      border: 2px solid rgba(212, 175, 55, 0.3);
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .door-relief::after { content: "⚜️"; font-size: 3rem; opacity: 0.3; }

    #view-gate.door-opening .gate-door.left { transform: rotateY(-105deg); }
    #view-gate.door-opening .gate-door.right { transform: rotateY(105deg); }

    .gate-card {
      position: relative;
      z-index: 20;
      width: 90%;
      max-width: 380px;
      background: rgba(11, 37, 28, 0.95);
      border: 2px solid var(--gold-primary);
      border-radius: 12px;
      padding: 24px 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 20px var(--gold-glow);
      text-align: center;
      transition: opacity 0.5s, transform 0.5s;
    }
    #view-gate.door-opening .gate-card { opacity: 0; transform: scale(0.9); pointer-events: none; }

    .gate-dialog-title { font-family: var(--font-serif); font-size: 1.55rem; color: var(--gold-light); margin-bottom: 4px; letter-spacing: 2px; }
    
    .gate-version-badge-classic {
      display: inline-block;
      font-family: var(--font-serif);
      font-size: 0.82rem;
      font-weight: bold;
      color: #ffd700;
      background: rgba(4, 15, 11, 0.7);
      border: 1px solid var(--gold-primary);
      padding: 3px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
      letter-spacing: 1px;
    }

    .gate-dialog-subtitle { color: #9cb5ab; font-size: 0.85rem; margin-bottom: 16px; }

    .gate-password-input {
      width: 100%;
      padding: 12px;
      font-size: 1.2rem;
      text-align: center;
      background: rgba(4, 15, 11, 0.8);
      border: 1.5px solid var(--gold-primary);
      color: var(--gold-light);
      border-radius: 6px;
      outline: none;
      margin-bottom: 14px;
      letter-spacing: 4px;
    }
    .btn-gold-action {
      width: 100%;
      padding: 12px;
      font-family: var(--font-serif);
      font-size: 1rem;
      font-weight: bold;
      color: #071912;
      background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold-primary) 100%);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.35);
      transition: transform 0.1s;
    }
    .btn-gold-action:active { transform: scale(0.98); }

    .btn-tv-mode {
      background: transparent;
      border: 1px dashed var(--gold-primary);
      color: var(--gold-light);
      margin-top: 12px;
      padding: 10px;
      font-size: 0.9rem;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
    }

    .portal-dispatcher { display: none; flex-direction: column; gap: 10px; margin-top: 12px; }
    .btn-portal-item {
      padding: 12px;
      background: rgba(18, 62, 47, 0.85);
      border: 1.5px solid var(--gold-primary);
      border-radius: 8px;
      color: #fff;
      font-family: var(--font-serif);
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .btn-portal-item:active { background: var(--gold-primary); color: #071912; font-weight: bold; }

    .tv-heartbeat-log {
      position: absolute;
      bottom: 12px;
      left: 12px;
      font-family: monospace;
      font-size: 0.75rem;
      color: #2ecc71;
      background: rgba(0,0,0,0.65);
      padding: 5px 10px;
      border-radius: 4px;
      border: 1px solid rgba(46, 204, 113, 0.4);
      display: none;
      z-index: 30;
    }

    /* 班級頁籤條 */
    .class-tabs-container {
      display: flex;
      align-items: center;
      overflow-x: auto;
      gap: 8px;
      padding: 8px 12px;
      background: var(--emerald-dark);
      border-bottom: 1px solid rgba(212, 175, 55, 0.25);
      scrollbar-width: none;
      flex-shrink: 0;
    }
    .class-tabs-container::-webkit-scrollbar { display: none; }
    .class-tab-pill {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--gold-primary);
      background: rgba(0,0,0,0.3);
      color: #cbdad3;
      font-size: 0.85rem;
      white-space: nowrap;
      cursor: grab;
      transition: transform 0.15s, background 0.15s;
      flex-shrink: 0;
    }
    .class-tab-pill:active { cursor: grabbing; }
    .class-tab-pill.active {
      background: var(--gold-primary);
      color: var(--emerald-dark);
      font-weight: bold;
      box-shadow: 0 0 10px var(--gold-glow);
    }
    .class-tab-pill.drag-over {
      transform: scale(1.08);
      border-color: #ffffff;
      box-shadow: 0 0 14px #ffffff;
    }
    .btn-add-class-pill {
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px dashed var(--gold-primary);
      background: rgba(212, 175, 55, 0.1);
      color: var(--gold-light);
      font-size: 0.85rem;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* 2. 課堂後台視圖 */
    .phone-mode-switcher { display: flex; background: #05140e; border-bottom: 1px solid rgba(212, 175, 55, 0.3); flex-shrink: 0; }
    .phone-mode-btn {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      color: #9cb5ab;
      font-size: 0.95rem;
      font-family: var(--font-serif);
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .phone-mode-btn.active {
      color: var(--gold-light);
      background: rgba(212, 175, 55, 0.12);
      border-bottom: 2px solid var(--gold-primary);
      font-weight: bold;
    }

    .workspace-split { flex: 1; display: flex; overflow: hidden; position: relative; }
    .scoring-column { flex: 1; display: flex; flex-direction: column; height: 100%; background: var(--bg-dark); }
    
    /* 操作指引橫幅 (單行防折行 + 可點擊編輯週次標籤 + 樣式 A 語意化結算按鈕) */
    .scoring-guide-banner {
      background: linear-gradient(90deg, rgba(16, 54, 40, 0.95), rgba(7, 25, 18, 0.95));
      border-bottom: 1.5px solid var(--gold-primary);
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      white-space: nowrap !important;
      overflow: hidden !important;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .guide-text-highlight {
      color: #ffe680;
      font-size: clamp(0.68rem, 2.1vw, 0.8rem);
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 1;
    }
    .banner-right-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .week-tag-interactive {
      font-family: monospace;
      font-size: clamp(0.72rem, 2.1vw, 0.82rem);
      color: var(--gold-light);
      font-weight: bold;
      white-space: nowrap;
      background: rgba(0,0,0,0.4);
      border: 1px dashed var(--gold-primary);
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      transition: all 0.2s;
    }
    .week-tag-interactive:active { transform: scale(0.96); background: rgba(212, 175, 55, 0.25); }

    /* 🌟 樣式 A 語意化結算按鈕 [☁️ 結算第X週] */
    .btn-manual-sync {
      background: linear-gradient(180deg, rgba(212, 175, 55, 0.28) 0%, rgba(212, 175, 55, 0.12) 100%);
      border: 1px solid var(--gold-primary);
      color: var(--gold-light);
      font-size: 0.74rem;
      font-family: var(--font-sans);
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
      transition: all 0.25s ease;
    }
    .btn-manual-sync:active { transform: scale(0.95); background: var(--gold-primary); color: #071912; }
    .btn-manual-sync.dirty-pulse {
      background: rgba(243, 156, 18, 0.35) !important;
      border-color: #f39c12 !important;
      color: #ffd280 !important;
      box-shadow: 0 0 10px rgba(243, 156, 18, 0.5);
    }
    .btn-manual-sync.success-state {
      background: #27ae60 !important;
      border-color: #2ecc71 !important;
      color: #fff !important;
      box-shadow: 0 0 12px rgba(46, 204, 113, 0.7);
    }

    .students-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      align-content: start;
    }
    .student-touch-card {
      background: linear-gradient(145deg, #103628 0%, #071e16 100%);
      border: 1.5px solid var(--emerald-border);
      border-radius: 8px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.4);
      transition: transform 0.08s, border-color 0.15s;
    }
    .student-touch-card:active { transform: scale(0.96); border-color: var(--gold-light); background: #184c39; }
    .card-seat-tag { position: absolute; top: 5px; left: 8px; font-size: 0.75rem; color: #9cb5ab; font-family: var(--font-serif); }
    
    .card-star-badge {
      position: absolute;
      top: 5px;
      right: 8px;
      font-size: 0.8rem;
      color: #ffd700;
      font-weight: bold;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255, 215, 0, 0.7);
      padding: 1px 5px;
      border-radius: 10px;
      box-shadow: 0 0 6px rgba(255, 215, 0, 0.4);
    }

    .card-student-name { font-size: 1.15rem; font-weight: bold; color: #ffffff; margin: 2px 0; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
    
    .card-score-value {
      font-size: 1.35rem;
      font-family: var(--font-serif);
      font-weight: bold;
      color: var(--gold-primary);
      line-height: 1.2;
    }
    .card-total-tag {
      font-size: 0.72rem;
      color: #9cb5ab;
      margin-top: 2px;
      font-family: var(--font-sans);
    }

    .scoring-bottom-toolbar {
      height: 58px;
      background: #05140e;
      border-top: 1.5px solid var(--gold-primary);
      padding: 0 10px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 6px;
      z-index: 30;
      flex-shrink: 0;
    }
    .weight-chip {
      flex: 1;
      height: 42px;
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 6px;
      background: rgba(212, 175, 55, 0.08);
      color: var(--gold-light);
      font-size: 1rem;
      font-weight: bold;
      font-family: var(--font-serif);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .weight-chip.active { background: var(--gold-primary); color: var(--emerald-dark); box-shadow: 0 0 12px var(--gold-glow); }

    /* 備課筆記模組 */
    .notes-column { flex: 1; display: none; flex-direction: column; background: var(--parchment); color: var(--text-dark); height: 100%; overflow: hidden; position: relative; }
    .notes-column.phone-active { display: flex; }

    .notes-top-bar {
      padding: 8px 10px;
      background: #ebdcc0;
      border-bottom: 1.5px solid var(--parchment-border);
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }
    .notes-control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      width: 100%;
    }
    .notes-unit-select {
      flex: 1 1 auto;
      min-width: 0;
      background: #fff;
      border: 1px solid #bdae93;
      border-radius: 4px;
      padding: 6px 4px;
      font-size: 0.85rem;
      font-family: var(--font-sans);
      color: var(--text-dark);
      outline: none;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .notes-unit-actions { display: flex; gap: 3px; flex-shrink: 0; }
    .btn-unit-tool {
      background: #ffffff;
      border: 1px solid #bdae93;
      border-radius: 4px;
      padding: 6px 7px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: bold;
      flex-shrink: 0;
    }
    .btn-unit-tool:active { background: var(--gold-light); }

    .btn-mode-toggle {
      background: #27ae60;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap !important;
      flex-shrink: 0 !important;
      min-width: fit-content;
      transition: background 0.2s;
    }
    .btn-mode-toggle.edit-mode { background: #d35400; }

    .wysiwyg-toolbar {
      display: none;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
      padding: 6px 10px;
      background: #dfcfaf;
      border-bottom: 1px solid #c9b896;
      flex-shrink: 0;
    }
    .wysiwyg-toolbar.active { display: flex; }

    .tool-select-fs {
      background: #fff;
      border: 1px solid #bdae93;
      border-radius: 3px;
      padding: 3px 4px;
      font-size: 0.8rem;
      outline: none;
    }
    .btn-fmt {
      background: #fff;
      border: 1px solid #bdae93;
      border-radius: 3px;
      padding: 3px 6px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      flex-shrink: 0;
    }
    .btn-fmt:hover { background: #fdfaf2; }
    .btn-fmt:active { background: var(--gold-light); }

    .palette-popover { position: relative; display: inline-block; }
    .palette-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      z-index: 100;
      background: #fff;
      border: 1.5px solid var(--gold-primary);
      border-radius: 6px;
      padding: 6px;
      grid-template-columns: repeat(4, 22px);
      gap: 5px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    }
    .palette-dropdown.show { display: grid; }
    .color-swatch {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid rgba(0,0,0,0.2);
    }
    .color-swatch:hover { transform: scale(1.15); }

    .btn-action-copy {
      background: linear-gradient(180deg, #3498db, #2980b9);
      color: #fff;
      font-weight: bold;
      border: none;
      border-radius: 3px;
      padding: 4px 8px;
      font-size: 0.8rem;
      cursor: pointer;
      margin-left: auto;
    }
    .btn-action-marker {
      background: #f1c40f;
      color: #2c3e50;
      font-weight: bold;
      border: 1px solid #d4ac0d;
      border-radius: 3px;
      padding: 4px 8px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .auto-save-pill {
      font-size: 0.75rem;
      font-family: var(--font-sans);
      color: #27ae60;
      background: rgba(39, 174, 96, 0.15);
      border: 1px solid rgba(39, 174, 96, 0.4);
      padding: 2px 7px;
      border-radius: 10px;
      display: none;
      align-items: center;
      gap: 3px;
      font-weight: bold;
      animation: fadeInSave 0.3s ease;
    }
    @keyframes fadeInSave { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

    .notes-container {
      flex: 1;
      padding: 16px 20px;
      outline: none;
      overflow-y: auto;
      font-size: 1.05rem;
      line-height: 1.7;
      scroll-behavior: smooth;
    }
    .notes-container.readonly { background: var(--parchment); cursor: default; }
    .notes-container ul, .notes-container ol { padding-left: 28px !important; margin: 8px 0; }
    .notes-container li { margin-bottom: 5px; }

    .magic-progress-marker {
      display: inline-block;
      background: rgba(241, 196, 15, 0.25);
      border-left: 4px solid #f39c12;
      padding: 2px 8px;
      border-radius: 0 4px 4px 0;
      position: relative;
      animation: progressPulse 2s infinite alternate;
    }
    .magic-progress-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: #e67e22;
      color: #fff;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 1px 6px;
      border-radius: 10px;
      margin-right: 6px;
      vertical-align: middle;
      user-select: none;
    }
    @keyframes progressPulse {
      from { box-shadow: 0 0 4px rgba(243, 156, 18, 0.2); }
      to { box-shadow: 0 0 12px rgba(243, 156, 18, 0.6); }
    }

    .copy-dialog-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 80;
      justify-content: center;
      align-items: center;
    }
    .copy-dialog-card {
      background: var(--emerald-dark);
      border: 2px solid var(--gold-primary);
      border-radius: 10px;
      padding: 18px 20px;
      width: 90%;
      max-width: 360px;
      color: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .copy-dialog-title { font-family: var(--font-serif); font-size: 1.15rem; color: var(--gold-light); margin-bottom: 12px; }
    .copy-input-text { width: 100%; padding: 8px; background: #04130d; border: 1px solid var(--gold-primary); color: #fff; border-radius: 4px; margin-bottom: 12px; outline: none; }
    .copy-class-checkboxes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; max-height: 140px; overflow-y: auto; margin-bottom: 14px; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 4px; }
    .copy-class-item { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; cursor: pointer; }
    .copy-dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .btn-dialog { padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
    .btn-dialog-cancel { background: transparent; border: 1px solid #7f8c8d; color: #bdc3c7; }
    .btn-dialog-confirm { background: var(--gold-primary); border: none; color: #071912; }

    @media (min-width: 680px) {
      .phone-mode-switcher { display: none !important; }
      .notes-column { flex: 0 0 50% !important; display: flex !important; order: 1; border-right: 2px solid var(--gold-primary); }
      .scoring-column { flex: 0 0 50% !important; display: flex !important; order: 2; }
    }

    /* 3. 榮譽揭榜視圖 (支援班級與週次歷史下拉選單) */
    #view-leaderboard {
      background: radial-gradient(circle at center, #0e3527 0%, #030c08 100%);
      overflow-y: auto;
      align-items: center;
    }
    .tv-theater-mode #view-leaderboard { height: 100% !important; z-index: 50; }
    .confetti-canvas { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
    
    .theater-action-header {
      width: 100%;
      padding: 10px 14px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      z-index: 20;
      background: rgba(5, 20, 14, 0.85);
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
      flex-shrink: 0;
    }
    .board-select-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .select-magic { background: #061911; border: 1.5px solid var(--gold-primary); color: var(--gold-light); padding: 5px 8px; border-radius: 4px; font-size: 0.85rem; outline: none; }
    .remote-actions-group { display: flex; gap: 6px; align-items: center; }
    .btn-remote-broadcast {
      background: linear-gradient(180deg, #f1c40f 0%, #d4af37 100%);
      color: #071912;
      font-weight: bold;
      padding: 7px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      box-shadow: 0 0 15px rgba(241, 196, 15, 0.4);
      animation: broadcastGlow 1.8s infinite alternate;
    }
    @keyframes broadcastGlow { from { transform: scale(1); } to { transform: scale(1.03); } }
    .btn-remote-close { background: rgba(184, 75, 41, 0.25); border: 1.5px solid #e67e22; color: #f39c12; font-weight: bold; padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    .btn-remote-close:active { background: #e67e22; color: #fff; }

    .podium-stage {
      width: 90%;
      max-width: 640px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 16px;
      margin: 16px 0 12px;
      min-height: 230px;
      z-index: 20;
    }
    .podium-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transform: translateY(40px);
      transition: all 0.8s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }
    .podium-col.reveal { opacity: 1; transform: translateY(0); }
    .podium-block {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: var(--font-serif);
      font-weight: bold;
      color: #05140e;
      border-radius: 8px 8px 0 0;
      box-shadow: 0 0 25px rgba(0,0,0,0.6);
    }
    .rank-first .podium-block { height: 135px; background: linear-gradient(180deg, #ffd700 0%, #b8860b 100%); font-size: 2.2rem; border: 2px solid #fff; }
    .rank-second .podium-block { height: 105px; background: linear-gradient(180deg, #e6e6e6 0%, #8c8c8c 100%); font-size: 1.8rem; }
    .rank-third .podium-block { height: 80px; background: linear-gradient(180deg, #cd7f32 0%, #7c471d 100%); font-size: 1.5rem; }

    .podium-badge {
      background: rgba(11, 37, 28, 0.95);
      border: 1.5px solid var(--gold-primary);
      border-radius: 8px;
      padding: 8px 10px;
      text-align: center;
      margin-bottom: 8px;
      width: 100%;
    }
    .badge-name { font-size: 1.15rem; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge-score { font-family: var(--font-serif); font-size: 0.95rem; color: var(--gold-light); }

    .top10-tier-bar {
      width: 90%;
      max-width: 860px;
      display: none;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
      z-index: 20;
    }
    .top10-tier-bar.active { display: flex; }
    .tier-card {
      flex: 1 1 110px;
      max-width: 125px;
      background: linear-gradient(145deg, rgba(16, 54, 40, 0.9), rgba(7, 30, 22, 0.9));
      border: 1px solid var(--gold-primary);
      border-radius: 6px;
      padding: 6px 4px;
      text-align: center;
      opacity: 0;
      transform: scale(0.7);
      transition: all 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }
    .tier-card.reveal {
      opacity: 1;
      transform: scale(1);
      box-shadow: 0 0 12px var(--gold-glow);
    }
    .tier-rank { font-size: 0.75rem; color: var(--gold-light); font-weight: bold; margin-bottom: 2px; }
    .tier-name { font-size: 0.95rem; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tier-score { font-size: 0.8rem; color: #a9cfbd; font-family: var(--font-serif); }

    .roster-parchment-sheet {
      width: 90%;
      max-width: 860px;
      background: rgba(9, 29, 22, 0.95);
      border: 2px solid var(--gold-primary);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 40px;
      z-index: 20;
      opacity: 0;
      transform: translateY(30px);
      transition: all 1s ease-out;
      pointer-events: none;
    }
    .roster-parchment-sheet.active-show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .roster-sheet-title { font-family: var(--font-serif); color: var(--gold-primary); text-align: center; margin-bottom: 14px; font-size: 1.15rem; }
    
    .roster-sheet-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 10px;
    }
    .roster-sheet-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 6px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .card-row-top {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap !important;
      overflow: hidden;
    }
    .card-seat-num { font-size: 0.8rem; color: #8dafa0; font-family: var(--font-serif); flex-shrink: 0; }
    .card-name-text { font-size: 1.05rem; font-weight: bold; color: #ffffff; text-overflow: ellipsis; overflow: hidden; flex-shrink: 1; }
    
    .card-row-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      border-top: 1px dashed rgba(212, 175, 55, 0.2);
      padding-top: 4px;
    }
    .card-score-text { color: var(--gold-light); font-weight: bold; font-family: var(--font-serif); }
    .card-rank-text { color: #88c0a8; font-size: 0.8rem; }

    /* 4. 名冊批次管理頁面 */
    #view-roster-manager {
      background: var(--bg-dark);
      padding: 16px;
      overflow-y: auto;
    }
    .manager-card { max-width: 680px; margin: 0 auto; background: var(--emerald-dark); border: 1.5px solid var(--gold-primary); border-radius: 10px; padding: 22px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
    .manager-header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .manager-title { font-family: var(--font-serif); color: var(--gold-primary); font-size: 1.25rem; }
    .manager-textarea {
      width: 100%;
      height: 220px;
      background: #04130d;
      border: 1px solid var(--emerald-border);
      border-radius: 6px;
      color: #fff;
      padding: 12px;
      font-size: 0.95rem;
      font-family: monospace;
      line-height: 1.6;
      outline: none;
      margin-bottom: 14px;
      resize: vertical;
    }
    .roster-instructions { color: #9cb5ab; font-size: 0.85rem; margin-bottom: 12px; line-height: 1.5; }
    .roster-instructions code { background: rgba(0,0,0,0.4); padding: 2px 6px; border-radius: 4px; color: var(--gold-light); }
    .manager-btn-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    .btn-danger-action {
      background: rgba(231, 76, 60, 0.15);
      border: 1.5px solid #e74c3c;
      color: #ff8888;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-family: var(--font-serif);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-danger-action:hover { background: #e74c3c; color: #fff; }
  </style>
</head>
<body>

  <header id="appHeader">
    <div class="brand-box">
      <span>⚜️</span> <span class="brand-text">魔法教務魔導系統</span>
    </div>
    <div class="header-actions">
      <span class="tv-status-badge" id="tvScreenIndicator" title="投影大螢幕狀態">🖥 離線</span>
      <span class="sync-gem" id="cloudSyncIndicator" title="連線狀態燈號"></span>
      <button class="btn-nav-magic active" id="navBtnWorkspace" onclick="App.switchView('workspace')">課堂後台</button>
      <button class="btn-nav-magic" id="navBtnLeaderboard" onclick="App.switchView('leaderboard')">榮譽榜單</button>
      <button class="btn-nav-magic" id="navBtnRoster" onclick="App.switchView('roster')">名冊管理</button>
      <button class="btn-nav-logout" onclick="App.logout()">🔒 登出</button>
    </div>
  </header>

  <main class="app-viewport" id="appViewport">
    
    <section id="view-gate" class="view-panel active">
      <div class="gate-portal">
        <div class="gate-door left"><div class="door-relief"></div></div>
        <div class="gate-door right"><div class="door-relief"></div></div>
      </div>
      
      <div class="gate-card" id="gateCard">
        <h1 class="gate-dialog-title">魔法學院門扉</h1>
        <div class="gate-version-badge-classic" id="gateVersionBadge">⚜️ 核心系統版本：加載中 ⚜️</div>
        
        <p class="gate-dialog-subtitle" id="gateSubTitle">請驗證導師通行印記以解除結界</p>
        
        <div id="gateLoginForm">
          <input type="password" id="gatePasswordInput" class="gate-password-input" placeholder="••••" maxlength="8">
          <button class="btn-gold-action" onclick="App.handlePasswordVerify()">驗證導師印記</button>
          <button class="btn-tv-mode" id="btnTvModeStandby" onclick="App.startTvStandbyMode()">🖥️ 電腦投影大螢幕（接收手機廣播揭榜）</button>
        </div>

        <div class="portal-dispatcher" id="portalDispatcher">
          <button class="btn-portal-item" onclick="App.selectDestination('workspace')">
            <span>⚔️ 課堂計分與備課後台</span> <span>➔</span>
          </button>
          <button class="btn-portal-item" onclick="App.selectDestination('leaderboard')">
            <span>🏆 榮譽揭榜投影大典</span> <span>➔</span>
          </button>
          <button class="btn-portal-item" onclick="App.selectDestination('roster')">
            <span>📜 班級名冊與學員管理</span> <span>➔</span>
          </button>
        </div>
      </div>

      <div class="tv-heartbeat-log" id="tvHeartbeatLog">📡 即時魔導連線就緒</div>
    </section>

    <section id="view-workspace" class="view-panel">
      <div class="phone-mode-switcher">
        <button class="phone-mode-btn active" id="btnPhoneScoring" onclick="App.switchPhoneMode('scoring')">⚔️ 計分面板</button>
        <button class="phone-mode-btn" id="btnPhoneNotes" onclick="App.switchPhoneMode('notes')">📜 備課卷軸</button>
      </div>

      <div class="class-tabs-container" id="classTabBar"></div>

      <div class="workspace-split">
        <div class="notes-column" id="notesColumn">
          <div class="notes-top-bar">
            <div class="notes-control-row">
              <select id="notesUnitSelect" class="notes-unit-select" onchange="App.onUnitChange()"></select>
              <div class="notes-unit-actions">
                <button class="btn-unit-tool" title="新增課程單元" onclick="App.promptAddUnit()">➕</button>
                <button class="btn-unit-tool" title="重新命名單元" onclick="App.promptRenameUnit()">✏️</button>
                <button class="btn-unit-tool" title="隱藏封存單元" onclick="App.promptArchiveUnit()">🗑️</button>
              </div>
              <button class="btn-mode-toggle" id="btnNotesMode" onclick="App.toggleNotesMode()">📖 閱讀中</button>
            </div>
          </div>

          <div class="wysiwyg-toolbar" id="wysiwygToolbar">
            <select class="tool-select-fs" onchange="App.applyFontSize(this.value)">
              <option value="14px">14px (小)</option>
              <option value="16px" selected>16px (標準)</option>
              <option value="18px">18px (中)</option>
              <option value="22px">22px (大)</option>
              <option value="26px">26px (特大)</option>
              <option value="32px">32px (標題)</option>
            </select>
            <button class="btn-fmt" onclick="document.execCommand('bold')"><b>B</b></button>
            <button class="btn-fmt" onclick="document.execCommand('italic')"><i>I</i></button>
            <button class="btn-fmt" onclick="document.execCommand('underline')"><u>U</u></button>
            
            <div class="palette-popover">
              <button class="btn-fmt" onclick="App.togglePalette('textColorDropdown')">🎨 顏色</button>
              <div class="palette-dropdown" id="textColorDropdown"></div>
            </div>

            <div class="palette-popover">
              <button class="btn-fmt" onclick="App.togglePalette('bgColorDropdown')">🖍️ 螢光</button>
              <div class="palette-dropdown" id="bgColorDropdown"></div>
            </div>

            <button class="btn-fmt" title="項目符號" onclick="document.execCommand('insertUnorderedList')">• 項目</button>
            <button class="btn-fmt" title="數字編號" onclick="document.execCommand('insertOrderedList')">1. 編號</button>
            <button class="btn-fmt" title="增加縮排" onclick="document.execCommand('indent')">⇥</button>
            <button class="btn-fmt" title="減少縮排" onclick="document.execCommand('outdent')">⇤</button>
            
            <button class="btn-action-marker" title="在游標位置標記教學進度" onclick="App.insertProgressBookmark()">📍 設進度標記</button>
            <button class="btn-action-copy" title="將此單元複製至其他班級" onclick="App.openCopyToClassModal()">📤 另存至他班</button>
            <span class="auto-save-pill" id="noteAutoSavePill">✔ 已自動存檔</span>
            <button class="btn-fmt" style="background: #27ae60; color: #fff; font-weight: bold;" onclick="App.saveCurrentNotes(false)">💾 儲存</button>
          </div>

          <div class="notes-container readonly" id="notesEditor" contenteditable="false"></div>

          <div class="copy-dialog-overlay" id="copyDialogOverlay">
            <div class="copy-dialog-card">
              <h3 class="copy-dialog-title">📤 另存筆記至其他班級</h3>
              <label style="font-size:0.8rem; color:#bdc3c7;">另存單元日期/標題（可微調）：</label>
              <input type="text" id="copyTargetTitleInput" class="copy-input-text">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                <label style="font-size:0.8rem; color:#bdc3c7;">選擇目標班級：</label>
                <button type="button" style="background:none; border:none; color:var(--gold-light); font-size:0.8rem; cursor:pointer;" onclick="App.toggleSelectAllCopyClasses()">全選/反選</button>
              </div>
              <div class="copy-class-checkboxes" id="copyClassCheckboxes"></div>
              <div class="copy-dialog-actions">
                <button class="btn-dialog btn-dialog-cancel" onclick="App.closeCopyToClassModal()">取消</button>
                <button class="btn-dialog btn-dialog-confirm" onclick="App.executeCopyToClasses()">確認派發</button>
              </div>
            </div>
          </div>
        </div>

        <div class="scoring-column" id="scoringColumn">
          <!-- 自適應操作指引橫幅 (點擊週次標籤可編輯 + 樣式 A 語意化按鈕) -->
          <div class="scoring-guide-banner">
            <span class="guide-text-highlight">
              <span>💡</span> 長按設固定加分｜點擊加減分
            </span>
            <div class="banner-right-group">
              <span class="week-tag-interactive" id="currentWeekBannerTag" onclick="App.promptSelectOrEditWeek()" title="點擊編輯或切換教學週次">
                【第1週】 ✏️
              </span>
              <!-- 🌟 樣式 A：動態呈現目標週次的結算按鈕 -->
              <button class="btn-manual-sync" id="btnManualUpload" onclick="App.executeCurrentClassSettlement()" title="將本科堂成績累加至 Google 試算表該週欄位">
                ☁️ 結算第1週
              </button>
            </div>
          </div>

          <div class="students-scroll-area" id="studentGrid"></div>
          <div class="scoring-bottom-toolbar">
            <button class="weight-chip" onclick="App.selectWeight(-5)">-5</button>
            <button class="weight-chip" onclick="App.selectWeight(-2)">-2</button>
            <button class="weight-chip" onclick="App.selectWeight(-1)">-1</button>
            <button class="weight-chip active" onclick="App.selectWeight(1)">+1</button>
            <button class="weight-chip" onclick="App.selectWeight(2)">+2</button>
            <button class="weight-chip" onclick="App.selectWeight(5)">+5</button>
          </div>
        </div>
      </div>
    </section>

    <section id="view-leaderboard" class="view-panel">
      <canvas id="confettiCanvas" class="confetti-canvas"></canvas>
      
      <div class="theater-action-header">
        <div class="board-select-group">
          <select id="leaderboardClassSelect" class="select-magic" onchange="App.onLeaderboardClassChange()"></select>
          <button class="btn-nav-magic" id="btnToggleRankingType" onclick="App.toggleRankingPeriod()">目前為:【週排行榜】</button>
          <!-- 🌟 週次歷史切換下拉選單 (預設展示前一週) -->
          <select id="leaderboardWeekSelect" class="select-magic" onchange="App.onLeaderboardWeekChange()" title="選擇投影排行榜的週次"></select>
        </div>
        <div class="remote-actions-group">
          <button class="btn-remote-broadcast" onclick="App.broadcastRevealSignal()">📢 廣播電腦大螢幕:開始揭榜</button>
          <button class="btn-remote-close" onclick="App.broadcastCloseSignal()">🚪 命令電腦關門・待命下一班</button>
        </div>
      </div>

      <div class="podium-stage" id="podiumStage">
        <div class="podium-col rank-second" id="podiumCol2">
