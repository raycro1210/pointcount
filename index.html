<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>魔法學院教務魔導系統</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚜️</text></svg>">
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    :root {
      --bg-dark: #071912;
      --emerald-dark: #0b251c;
      --emerald-light: #123e2f;
      --emerald-border: #1d5541;
      --gold-primary: #d4af37;
      --gold-light: #f7e49a;
      --gold-dark: #8c6d17;
      --gold-glow: rgba(212, 175, 55, 0.35);
      --parchment: #f6f1e3;
      --parchment-border: #ded3b8;
      --text-main: #f0f7f4;
      --text-dark: #201e19;
      --font-serif: "Cinzel", "Noto Serif TC", "KaiTi", "標楷體", serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-sans);
      overflow: hidden;
    }

    /* 頂部通用導航列：移除版本標籤，預留完整按鈕空間避免擠壓 */
    header {
      display: none;
      height: 52px;
      background: linear-gradient(180deg, #05140e 0%, var(--emerald-dark) 100%);
      border-bottom: 2px solid var(--gold-primary);
      padding: 0 8px;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 50;
      gap: 4px;
    }
    header.authorized { display: flex; }

    .brand-box {
      font-family: var(--font-serif);
      font-size: 0.95rem;
      color: var(--gold-primary);
      display: flex;
      align-items: center;
      gap: 4px;
      letter-spacing: 0.5px;
      white-space: nowrap;
      flex-shrink: 1;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions {
      display: flex;
      gap: 4px;
      align-items: center;
      flex-shrink: 0;
    }

    .btn-nav-magic {
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid var(--gold-primary);
      color: var(--gold-light);
      padding: 6px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      font-family: var(--font-serif);
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .btn-nav-magic:active, .btn-nav-magic.active {
      background: var(--gold-primary);
      color: var(--emerald-dark);
      font-weight: bold;
    }
    .btn-nav-logout {
      background: rgba(231, 76, 60, 0.2);
      border: 1px solid #e74c3c;
      color: #ff9999;
      padding: 6px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .sync-gem {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #2ecc71;
      box-shadow: 0 0 8px #2ecc71;
      display: inline-block;
      flex-shrink: 0;
      transition: all 0.3s;
    }
    .sync-gem.pending { background: #f39c12; box-shadow: 0 0 10px #f39c12; animation: gemPulse 1s infinite alternate; }
    .sync-gem.error { background: #e74c3c; box-shadow: 0 0 10px #e74c3c; }
    @keyframes gemPulse { from { transform: scale(1); } to { transform: scale(1.2); } }

    @media (max-width: 400px) {
      .brand-box span.brand-text { display: none; }
      .brand-box::after { content: "魔導系統"; font-size: 0.85rem; }
      .btn-nav-magic { padding: 5px 6px; font-size: 0.75rem; }
      .btn-nav-logout { padding: 5px 6px; font-size: 0.75rem; }
    }

    /* 視圖容器系統 */
    .app-viewport { width: 100%; height: calc(100% - 52px); position: relative; }
    .view-panel {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      background: var(--bg-dark);
      z-index: 10;
    }
    .view-panel.active {
      display: flex !important;
      z-index: 20;
    }

    /* 1. 學院大門頁面 (首頁正中央典雅版本銘牌) */
    #view-gate {
      position: absolute;
      inset: 0;
      height: 100dvh;
      background: radial-gradient(circle at center, #103326 0%, #030a07 100%);
      perspective: 1200px;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      z-index: 100;
    }
    .gate-portal { position: absolute; inset: 0; display: flex; pointer-events: none; z-index: 10; }
    .gate-door {
      width: 50%;
      height: 100%;
      background: linear-gradient(135deg, #0d2b20 0%, #05140e 100%);
      border-bottom: 4px solid var(--gold-primary);
      box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
      position: relative;
      transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .gate-door.left { border-right: 2px solid var(--gold-primary); transform-origin: left center; }
    .gate-door.right { border-left: 2px solid var(--gold-primary); transform-origin: right center; }
    .door-relief {
      position: absolute;
      inset: 28px;
      border: 2px solid rgba(212, 175, 55, 0.3);
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .door-relief::after { content: "⚜️"; font-size: 3rem; opacity: 0.3; }

    #view-gate.door-opening .gate-door.left { transform: rotateY(-105deg); }
    #view-gate.door-opening .gate-door.right { transform: rotateY(105deg); }

    .gate-card {
      position: relative;
      z-index: 20;
      width: 90%;
      max-width: 380px;
      background: rgba(11, 37, 28, 0.95);
      border: 2px solid var(--gold-primary);
      border-radius: 12px;
      padding: 24px 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 20px var(--gold-glow);
      text-align: center;
      transition: opacity 0.5s, transform 0.5s;
    }
    #view-gate.door-opening .gate-card { opacity: 0; transform: scale(0.9); pointer-events: none; }

    .gate-dialog-title { font-family: var(--font-serif); font-size: 1.55rem; color: var(--gold-light); margin-bottom: 4px; letter-spacing: 2px; }
    
    /* 首頁正中央：樣式 1 經典典雅風格版本銘牌 */
    .gate-version-badge-classic {
      display: inline-block;
      font-family: var(--font-serif);
      font-size: 0.82rem;
      font-weight: bold;
      color: #ffd700;
      background: rgba(4, 15, 11, 0.7);
      border: 1px solid var(--gold-primary);
      padding: 3px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
      letter-spacing: 1px;
    }

    .gate-dialog-subtitle { color: #9cb5ab; font-size: 0.85rem; margin-bottom: 16px; }

    .gate-password-input {
      width: 100%;
      padding: 12px;
      font-size: 1.2rem;
      text-align: center;
      background: rgba(4, 15, 11, 0.8);
      border: 1.5px solid var(--gold-primary);
      color: var(--gold-light);
      border-radius: 6px;
      outline: none;
      margin-bottom: 14px;
      letter-spacing: 4px;
    }
    .btn-gold-action {
      width: 100%;
      padding: 12px;
      font-family: var(--font-serif);
      font-size: 1rem;
      font-weight: bold;
      color: #071912;
      background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold-primary) 100%);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.35);
      transition: transform 0.1s;
    }
    .btn-gold-action:active { transform: scale(0.98); }

    .btn-tv-mode {
      background: transparent;
      border: 1px dashed var(--gold-primary);
      color: var(--gold-light);
      margin-top: 12px;
      padding: 10px;
      font-size: 0.9rem;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
    }

    .portal-dispatcher { display: none; flex-direction: column; gap: 10px; margin-top: 12px; }
    .btn-portal-item {
      padding: 12px;
      background: rgba(18, 62, 47, 0.85);
      border: 1.5px solid var(--gold-primary);
      border-radius: 8px;
      color: #fff;
      font-family: var(--font-serif);
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .btn-portal-item:active { background: var(--gold-primary); color: #071912; font-weight: bold; }

    .tv-heartbeat-log {
      position: absolute;
      bottom: 12px;
      left: 12px;
      font-family: monospace;
      font-size: 0.75rem;
      color: #2ecc71;
      background: rgba(0,0,0,0.65);
      padding: 5px 10px;
      border-radius: 4px;
      border: 1px solid rgba(46, 204, 113, 0.4);
      display: none;
      z-index: 30;
    }

    /* 班級頁籤條 */
    .class-tabs-container {
      display: flex;
      align-items: center;
      overflow-x: auto;
      gap: 8px;
      padding: 8px 12px;
      background: var(--emerald-dark);
      border-bottom: 1px solid rgba(212, 175, 55, 0.25);
      scrollbar-width: none;
      flex-shrink: 0;
    }
    .class-tabs-container::-webkit-scrollbar { display: none; }
    .class-tab-pill {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--gold-primary);
      background: rgba(0,0,0,0.3);
      color: #cbdad3;
      font-size: 0.85rem;
      white-space: nowrap;
      cursor: grab;
      transition: transform 0.15s, background 0.15s;
      flex-shrink: 0;
    }
    .class-tab-pill:active { cursor: grabbing; }
    .class-tab-pill.active {
      background: var(--gold-primary);
      color: var(--emerald-dark);
      font-weight: bold;
      box-shadow: 0 0 10px var(--gold-glow);
    }
    .class-tab-pill.drag-over {
      transform: scale(1.08);
      border-color: #ffffff;
      box-shadow: 0 0 14px #ffffff;
    }
    .btn-add-class-pill {
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px dashed var(--gold-primary);
      background: rgba(212, 175, 55, 0.1);
      color: var(--gold-light);
      font-size: 0.85rem;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* 2. 課堂後台視圖 */
    .phone-mode-switcher { display: flex; background: #05140e; border-bottom: 1px solid rgba(212, 175, 55, 0.3); flex-shrink: 0; }
    .phone-mode-btn {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      color: #9cb5ab;
      font-size: 0.95rem;
      font-family: var(--font-serif);
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .phone-mode-btn.active {
      color: var(--gold-light);
      background: rgba(212, 175, 55, 0.12);
      border-bottom: 2px solid var(--gold-primary);
      font-weight: bold;
    }

    .workspace-split { flex: 1; display: flex; overflow: hidden; position: relative; }
    .scoring-column { flex: 1; display: flex; flex-direction: column; height: 100%; background: var(--bg-dark); }
    
    .scoring-guide-banner {
      background: linear-gradient(90deg, rgba(16, 54, 40, 0.95), rgba(7, 25, 18, 0.95));
      border-bottom: 1.5px solid var(--gold-primary);
      padding: 7px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: #d1e7dc;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .guide-text-highlight {
      color: #ffe680;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .students-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      align-content: start;
    }
    .student-touch-card {
      background: linear-gradient(145deg, #103628 0%, #071e16 100%);
      border: 1.5px solid var(--emerald-border);
      border-radius: 8px;
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.4);
      transition: transform 0.08s, border-color 0.15s;
    }
    .student-touch-card:active { transform: scale(0.96); border-color: var(--gold-light); background: #184c39; }
    .card-seat-tag { position: absolute; top: 5px; left: 8px; font-size: 0.75rem; color: #9cb5ab; font-family: var(--font-serif); }
    
    .card-star-badge {
      position: absolute;
      top: 5px;
      right: 8px;
      font-size: 0.8rem;
      color: #ffd700;
      font-weight: bold;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255, 215, 0, 0.7);
      padding: 1px 5px;
      border-radius: 10px;
      box-shadow: 0 0 6px rgba(255, 215, 0, 0.4);
    }

    .card-student-name { font-size: 1.15rem; font-weight: bold; color: #ffffff; margin: 4px 0; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
    .card-score-value { font-size: 1.25rem; font-family: var(--font-serif); font-weight: bold; color: var(--gold-primary); }

    .scoring-bottom-toolbar {
      height: 58px;
      background: #05140e;
      border-top: 1.5px solid var(--gold-primary);
      padding: 0 10px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 6px;
      z-index: 30;
      flex-shrink: 0;
    }
    .weight-chip {
      flex: 1;
      height: 42px;
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 6px;
      background: rgba(212, 175, 55, 0.08);
      color: var(--gold-light);
      font-size: 1rem;
      font-weight: bold;
      font-family: var(--font-serif);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .weight-chip.active { background: var(--gold-primary); color: var(--emerald-dark); box-shadow: 0 0 12px var(--gold-glow); }

    /* 備課筆記模組 */
    .notes-column { flex: 1; display: none; flex-direction: column; background: var(--parchment); color: var(--text-dark); height: 100%; overflow: hidden; position: relative; }
    .notes-column.phone-active { display: flex; }

    .notes-top-bar {
      padding: 8px 10px;
      background: #ebdcc0;
      border-bottom: 1.5px solid var(--parchment-border);
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }
    .notes-control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      width: 100%;
    }
    .notes-unit-select {
      flex: 1 1 auto;
      min-width: 0;
      background: #fff;
      border: 1px solid #bdae93;
      border-radius: 4px;
      padding: 6px 4px;
      font-size: 0.85rem;
      font-family: var(--font-sans);
      color: var(--text-dark);
      outline: none;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .notes-unit-actions { display: flex; gap: 3px; flex-shrink: 0; }
    .btn-unit-tool {
      background: #ffffff;
      border: 1px solid #bdae93;
      border-radius: 4px;
      padding: 6px 7px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: bold;
      flex-shrink: 0;
    }
    .btn-unit-tool:active { background: var(--gold-light); }

    .btn-mode-toggle {
      background: #27ae60;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap !important;
      flex-shrink: 0 !important;
      min-width: fit-content;
      transition: background 0.2s;
    }
    .btn-mode-toggle.edit-mode { background: #d35400; }

    .wysiwyg-toolbar {
      display: none;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
      padding: 6px 10px;
      background: #dfcfaf;
      border-bottom: 1px solid #c9b896;
      flex-shrink: 0;
    }
    .wysiwyg-toolbar.active { display: flex; }

    .tool-select-fs {
      background: #fff;
      border: 1px solid #bdae93;
      border-radius: 3px;
      padding: 3px 4px;
      font-size: 0.8rem;
      outline: none;
    }
    .btn-fmt {
      background: #fff;
      border: 1px solid #bdae93;
      border-radius: 3px;
      padding: 3px 6px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      flex-shrink: 0;
    }
    .btn-fmt:hover { background: #fdfaf2; }
    .btn-fmt:active { background: var(--gold-light); }

    .palette-popover { position: relative; display: inline-block; }
    .palette-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      z-index: 100;
      background: #fff;
      border: 1.5px solid var(--gold-primary);
      border-radius: 6px;
      padding: 6px;
      grid-template-columns: repeat(4, 22px);
      gap: 5px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    }
    .palette-dropdown.show { display: grid; }
    .color-swatch {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid rgba(0,0,0,0.2);
    }
    .color-swatch:hover { transform: scale(1.15); }

    .btn-action-copy {
      background: linear-gradient(180deg, #3498db, #2980b9);
      color: #fff;
      font-weight: bold;
      border: none;
      border-radius: 3px;
      padding: 4px 8px;
      font-size: 0.8rem;
      cursor: pointer;
      margin-left: auto;
    }
    .btn-action-marker {
      background: #f1c40f;
      color: #2c3e50;
      font-weight: bold;
      border: 1px solid #d4ac0d;
      border-radius: 3px;
      padding: 4px 8px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .notes-container {
      flex: 1;
      padding: 16px 20px;
      outline: none;
      overflow-y: auto;
      font-size: 1.05rem;
      line-height: 1.7;
      scroll-behavior: smooth;
    }
    .notes-container.readonly { background: var(--parchment); cursor: default; }
    .notes-container ul, .notes-container ol { padding-left: 28px !important; margin: 8px 0; }
    .notes-container li { margin-bottom: 5px; }

    .magic-progress-marker {
      display: inline-block;
      background: rgba(241, 196, 15, 0.25);
      border-left: 4px solid #f39c12;
      padding: 2px 8px;
      border-radius: 0 4px 4px 0;
      position: relative;
      animation: progressPulse 2s infinite alternate;
    }
    .magic-progress-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: #e67e22;
      color: #fff;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 1px 6px;
      border-radius: 10px;
      margin-right: 6px;
      vertical-align: middle;
      user-select: none;
    }
    @keyframes progressPulse {
      from { box-shadow: 0 0 4px rgba(243, 156, 18, 0.2); }
      to { box-shadow: 0 0 12px rgba(243, 156, 18, 0.6); }
    }

    /* 另存至他班互動彈窗 */
    .copy-dialog-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 80;
      justify-content: center;
      align-items: center;
    }
    .copy-dialog-card {
      background: var(--emerald-dark);
      border: 2px solid var(--gold-primary);
      border-radius: 10px;
      padding: 18px 20px;
      width: 90%;
      max-width: 360px;
      color: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .copy-dialog-title { font-family: var(--font-serif); font-size: 1.15rem; color: var(--gold-light); margin-bottom: 12px; }
    .copy-input-text { width: 100%; padding: 8px; background: #04130d; border: 1px solid var(--gold-primary); color: #fff; border-radius: 4px; margin-bottom: 12px; outline: none; }
    .copy-class-checkboxes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; max-height: 140px; overflow-y: auto; margin-bottom: 14px; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 4px; }
    .copy-class-item { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; cursor: pointer; }
    .copy-dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .btn-dialog { padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
    .btn-dialog-cancel { background: transparent; border: 1px solid #7f8c8d; color: #bdc3c7; }
    .btn-dialog-confirm { background: var(--gold-primary); border: none; color: #071912; }

    @media (min-width: 680px) {
      .phone-mode-switcher { display: none !important; }
      .notes-column { flex: 0 0 50% !important; display: flex !important; order: 1; border-right: 2px solid var(--gold-primary); }
      .scoring-column { flex: 0 0 50% !important; display: flex !important; order: 2; }
    }

    /* 3. 榮譽揭榜視圖 */
    #view-leaderboard {
      background: radial-gradient(circle at center, #0e3527 0%, #030c08 100%);
      overflow-y: auto;
      align-items: center;
    }
    .tv-theater-mode #view-leaderboard { height: 100% !important; z-index: 50; }
    .confetti-canvas { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
    
    .theater-action-header {
      width: 100%;
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      z-index: 20;
      background: rgba(5, 20, 14, 0.85);
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
      flex-shrink: 0;
    }
    .board-select-group { display: flex; gap: 6px; align-items: center; }
    .select-magic { background: #061911; border: 1.5px solid var(--gold-primary); color: var(--gold-light); padding: 6px 10px; border-radius: 4px; font-size: 0.9rem; outline: none; }
    .remote-actions-group { display: flex; gap: 8px; align-items: center; }
    .btn-remote-broadcast {
      background: linear-gradient(180deg, #f1c40f 0%, #d4af37 100%);
      color: #071912;
      font-weight: bold;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      box-shadow: 0 0 15px rgba(241, 196, 15, 0.4);
      animation: broadcastGlow 1.8s infinite alternate;
    }
    @keyframes broadcastGlow { from { transform: scale(1); } to { transform: scale(1.03); } }
    .btn-remote-close { background: rgba(184, 75, 41, 0.25); border: 1.5px solid #e67e22; color: #f39c12; font-weight: bold; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
    .btn-remote-close:active { background: #e67e22; color: #fff; }

    /* 前三名舞台 */
    .podium-stage {
      width: 90%;
      max-width: 640px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 16px;
      margin: 16px 0 12px;
      min-height: 230px;
      z-index: 20;
    }
    .podium-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transform: translateY(40px);
      transition: all 0.8s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }
    .podium-col.reveal { opacity: 1; transform: translateY(0); }
    .podium-block {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: var(--font-serif);
      font-weight: bold;
      color: #05140e;
      border-radius: 8px 8px 0 0;
      box-shadow: 0 0 25px rgba(0,0,0,0.6);
    }
    .rank-first .podium-block { height: 135px; background: linear-gradient(180deg, #ffd700 0%, #b8860b 100%); font-size: 2.2rem; border: 2px solid #fff; }
    .rank-second .podium-block { height: 105px; background: linear-gradient(180deg, #e6e6e6 0%, #8c8c8c 100%); font-size: 1.8rem; }
    .rank-third .podium-block { height: 80px; background: linear-gradient(180deg, #cd7f32 0%, #7c471d 100%); font-size: 1.5rem; }

    .podium-badge {
      background: rgba(11, 37, 28, 0.95);
      border: 1.5px solid var(--gold-primary);
      border-radius: 8px;
      padding: 8px 10px;
      text-align: center;
      margin-bottom: 8px;
      width: 100%;
    }
    .badge-name { font-size: 1.15rem; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge-score { font-family: var(--font-serif); font-size: 0.95rem; color: var(--gold-light); }

    /* 第 4～10 名：殿軍與優等英雄席 */
    .top10-tier-bar {
      width: 90%;
      max-width: 860px;
      display: none;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
      z-index: 20;
    }
    .top10-tier-bar.active { display: flex; }
    .tier-card {
      flex: 1 1 110px;
      max-width: 125px;
      background: linear-gradient(145deg, rgba(16, 54, 40, 0.9), rgba(7, 30, 22, 0.9));
      border: 1px solid var(--gold-primary);
      border-radius: 6px;
      padding: 6px 4px;
      text-align: center;
      opacity: 0;
      transform: scale(0.7);
      transition: all 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }
    .tier-card.reveal {
      opacity: 1;
      transform: scale(1);
      box-shadow: 0 0 12px var(--gold-glow);
    }
    .tier-rank { font-size: 0.75rem; color: var(--gold-light); font-weight: bold; margin-bottom: 2px; }
    .tier-name { font-size: 0.95rem; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tier-score { font-size: 0.8rem; color: #a9cfbd; font-family: var(--font-serif); }

    /* 全班名冊羊皮紙 */
    .roster-parchment-sheet {
      width: 90%;
      max-width: 860px;
      background: rgba(9, 29, 22, 0.95);
      border: 2px solid var(--gold-primary);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 40px;
      z-index: 20;
      opacity: 0;
      transform: translateY(30px);
      transition: all 1s ease-out;
      pointer-events: none;
    }
    .roster-parchment-sheet.active-show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .roster-sheet-title { font-family: var(--font-serif); color: var(--gold-primary); text-align: center; margin-bottom: 14px; font-size: 1.15rem; }
    
    .roster-sheet-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 10px;
    }
    .roster-sheet-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 6px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .card-row-top {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap !important;
      overflow: hidden;
    }
    .card-seat-num { font-size: 0.8rem; color: #8dafa0; font-family: var(--font-serif); flex-shrink: 0; }
    .card-name-text { font-size: 1.05rem; font-weight: bold; color: #ffffff; text-overflow: ellipsis; overflow: hidden; flex-shrink: 1; }
    
    .card-row-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      border-top: 1px dashed rgba(212, 175, 55, 0.2);
      padding-top: 4px;
    }
    .card-score-text { color: var(--gold-light); font-weight: bold; font-family: var(--font-serif); }
    .card-rank-text { color: #88c0a8; font-size: 0.8rem; }

    /* 4. 名冊批次管理頁面 */
    #view-roster-manager {
      background: var(--bg-dark);
      padding: 16px;
      overflow-y: auto;
    }
    .manager-card { max-width: 680px; margin: 0 auto; background: var(--emerald-dark); border: 1.5px solid var(--gold-primary); border-radius: 10px; padding: 22px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
    .manager-header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .manager-title { font-family: var(--font-serif); color: var(--gold-primary); font-size: 1.25rem; }
    .manager-textarea {
      width: 100%;
      height: 220px;
      background: #04130d;
      border: 1px solid var(--emerald-border);
      border-radius: 6px;
      color: #fff;
      padding: 12px;
      font-size: 0.95rem;
      font-family: monospace;
      line-height: 1.6;
      outline: none;
      margin-bottom: 14px;
      resize: vertical;
    }
    .roster-instructions { color: #9cb5ab; font-size: 0.85rem; margin-bottom: 12px; line-height: 1.5; }
    .roster-instructions code { background: rgba(0,0,0,0.4); padding: 2px 6px; border-radius: 4px; color: var(--gold-light); }
    .manager-btn-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    .btn-danger-action {
      background: rgba(231, 76, 60, 0.15);
      border: 1.5px solid #e74c3c;
      color: #ff8888;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-family: var(--font-serif);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-danger-action:hover { background: #e74c3c; color: #fff; }
  </style>
</head>
<body>

  <!-- 通用頂部導航列 (已移除多餘標籤，按鈕空間完整釋放) -->
  <header id="appHeader">
    <div class="brand-box">
      <span>⚜️</span> <span class="brand-text">魔法教務魔導系統</span>
    </div>
    <div class="header-actions">
      <span class="sync-gem" id="cloudSyncIndicator" title="連線狀態燈號"></span>
      <button class="btn-nav-magic active" id="navBtnWorkspace" onclick="App.switchView('workspace')">課堂後台</button>
      <button class="btn-nav-magic" id="navBtnLeaderboard" onclick="App.switchView('leaderboard')">榮譽榜單</button>
      <button class="btn-nav-magic" id="navBtnRoster" onclick="App.switchView('roster')">名冊管理</button>
      <button class="btn-nav-logout" onclick="App.logout()">🔒 登出</button>
    </div>
  </header>

  <main class="app-viewport" id="appViewport">
    
    <!-- 1. 學院大門頁面 (首頁正中央典雅版本銘牌) -->
    <section id="view-gate" class="view-panel active">
      <div class="gate-portal">
        <div class="gate-door left"><div class="door-relief"></div></div>
        <div class="gate-door right"><div class="door-relief"></div></div>
      </div>
      
      <div class="gate-card" id="gateCard">
        <h1 class="gate-dialog-title">魔法學院門扉</h1>
        <!-- 樣式 1：經典典雅風格版本銘牌 (待命與登入時永久保留) -->
        <div class="gate-version-badge-classic" id="gateVersionBadge">⚜️ 核心系統版本：加載中 ⚜️</div>
        
        <p class="gate-dialog-subtitle" id="gateSubTitle">請驗證導師通行印記以解除結界</p>
        
        <div id="gateLoginForm">
          <input type="password" id="gatePasswordInput" class="gate-password-input" placeholder="••••" maxlength="8">
          <button class="btn-gold-action" onclick="App.handlePasswordVerify()">驗證導師印記</button>
          <button class="btn-tv-mode" id="btnTvModeStandby" onclick="App.startTvStandbyMode()">🖥️ 電腦投影大螢幕（接收手機廣播揭榜）</button>
        </div>

        <div class="portal-dispatcher" id="portalDispatcher">
          <button class="btn-portal-item" onclick="App.selectDestination('workspace')">
            <span>⚔️ 課堂計分與備課後台</span> <span>➔</span>
          </button>
          <button class="btn-portal-item" onclick="App.selectDestination('leaderboard')">
            <span>🏆 榮譽揭榜投影大典</span> <span>➔</span>
          </button>
          <button class="btn-portal-item" onclick="App.selectDestination('roster')">
            <span>📜 班級名冊與學員管理</span> <span>➔</span>
          </button>
        </div>
      </div>

      <div class="tv-heartbeat-log" id="tvHeartbeatLog">📡 即時魔導連線就緒</div>
    </section>

    <!-- 2. 課堂後台視圖 -->
    <section id="view-workspace" class="view-panel">
      <div class="phone-mode-switcher">
        <button class="phone-mode-btn active" id="btnPhoneScoring" onclick="App.switchPhoneMode('scoring')">⚔️ 計分面板</button>
        <button class="phone-mode-btn" id="btnPhoneNotes" onclick="App.switchPhoneMode('notes')">📜 備課卷軸</button>
      </div>

      <div class="class-tabs-container" id="classTabBar"></div>

      <div class="workspace-split">
        <!-- 備課筆記模組 (含另存他班與進度導航) -->
        <div class="notes-column" id="notesColumn">
          <div class="notes-top-bar">
            <div class="notes-control-row">
              <select id="notesUnitSelect" class="notes-unit-select" onchange="App.onUnitChange()"></select>
              <div class="notes-unit-actions">
                <button class="btn-unit-tool" title="新增課程單元" onclick="App.promptAddUnit()">➕</button>
                <button class="btn-unit-tool" title="重新命名單元" onclick="App.promptRenameUnit()">✏️</button>
                <button class="btn-unit-tool" title="隱藏封存單元" onclick="App.promptArchiveUnit()">🗑️</button>
              </div>
              <button class="btn-mode-toggle" id="btnNotesMode" onclick="App.toggleNotesMode()">📖 閱讀中</button>
            </div>
          </div>

          <!-- 12 色富文字與進度插旗工具列 -->
          <div class="wysiwyg-toolbar" id="wysiwygToolbar">
            <select class="tool-select-fs" onchange="App.applyFontSize(this.value)">
              <option value="14px">14px (小)</option>
              <option value="16px" selected>16px (標準)</option>
              <option value="18px">18px (中)</option>
              <option value="22px">22px (大)</option>
              <option value="26px">26px (特大)</option>
              <option value="32px">32px (標題)</option>
            </select>
            <button class="btn-fmt" onclick="document.execCommand('bold')"><b>B</b></button>
            <button class="btn-fmt" onclick="document.execCommand('italic')"><i>I</i></button>
            <button class="btn-fmt" onclick="document.execCommand('underline')"><u>U</u></button>
            
            <div class="palette-popover">
              <button class="btn-fmt" onclick="App.togglePalette('textColorDropdown')">🎨 顏色</button>
              <div class="palette-dropdown" id="textColorDropdown"></div>
            </div>

            <div class="palette-popover">
              <button class="btn-fmt" onclick="App.togglePalette('bgColorDropdown')">🖍️ 螢光</button>
              <div class="palette-dropdown" id="bgColorDropdown"></div>
            </div>

            <button class="btn-fmt" title="項目符號" onclick="document.execCommand('insertUnorderedList')">• 項目</button>
            <button class="btn-fmt" title="數字編號" onclick="document.execCommand('insertOrderedList')">1. 編號</button>
            <button class="btn-fmt" title="增加縮排" onclick="document.execCommand('indent')">⇥</button>
            <button class="btn-fmt" title="減少縮排" onclick="document.execCommand('outdent')">⇤</button>
            
            <button class="btn-action-marker" title="在游標位置標記教學進度" onclick="App.insertProgressBookmark()">📍 設進度標記</button>
            <button class="btn-action-copy" title="將此單元複製至其他班級" onclick="App.openCopyToClassModal()">📤 另存至他班</button>
            <button class="btn-fmt" style="background: #27ae60; color: #fff; font-weight: bold;" onclick="App.saveCurrentNotes()">💾 儲存</button>
          </div>

          <div class="notes-container readonly" id="notesEditor" contenteditable="false"></div>

          <!-- 另存至他班彈窗 -->
          <div class="copy-dialog-overlay" id="copyDialogOverlay">
            <div class="copy-dialog-card">
              <h3 class="copy-dialog-title">📤 另存筆記至其他班級</h3>
              <label style="font-size:0.8rem; color:#bdc3c7;">另存單元日期/標題（可微調）：</label>
              <input type="text" id="copyTargetTitleInput" class="copy-input-text">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                <label style="font-size:0.8rem; color:#bdc3c7;">選擇目標班級：</label>
                <button type="button" style="background:none; border:none; color:var(--gold-light); font-size:0.8rem; cursor:pointer;" onclick="App.toggleSelectAllCopyClasses()">全選/反選</button>
              </div>
              <div class="copy-class-checkboxes" id="copyClassCheckboxes"></div>
              <div class="copy-dialog-actions">
                <button class="btn-dialog btn-dialog-cancel" onclick="App.closeCopyToClassModal()">取消</button>
                <button class="btn-dialog btn-dialog-confirm" onclick="App.executeCopyToClasses()">確認派發</button>
              </div>
            </div>
          </div>
        </div>

        <!-- 計分面板區 -->
        <div class="scoring-column" id="scoringColumn">
          <div class="scoring-guide-banner">
            <span class="guide-text-highlight">
              <span>💡</span> <b>長按學生卡片可設定每週固定加分</b>（點擊為加減分）
            </span>
            <span id="currentWeekBannerTag" style="font-family: monospace; color: var(--gold-light); font-weight: bold;">【第1週】</span>
          </div>

          <div class="students-scroll-area" id="studentGrid"></div>
          <div class="scoring-bottom-toolbar">
            <button class="weight-chip" onclick="App.selectWeight(-5)">-5</button>
            <button class="weight-chip" onclick="App.selectWeight(-2)">-2</button>
            <button class="weight-chip" onclick="App.selectWeight(-1)">-1</button>
            <button class="weight-chip active" onclick="App.selectWeight(1)">+1</button>
            <button class="weight-chip" onclick="App.selectWeight(2)">+2</button>
            <button class="weight-chip" onclick="App.selectWeight(5)">+5</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 3. 榮譽揭榜視圖 -->
    <section id="view-leaderboard" class="view-panel">
      <canvas id="confettiCanvas" class="confetti-canvas"></canvas>
      
      <div class="theater-action-header">
        <div class="board-select-group">
          <select id="leaderboardClassSelect" class="select-magic" onchange="App.onLeaderboardClassChange()"></select>
          <button class="btn-nav-magic" id="btnToggleRankingType" onclick="App.toggleRankingPeriod()">目前為:【週排行榜】</button>
        </div>
        <div class="remote-actions-group">
          <button class="btn-remote-broadcast" onclick="App.broadcastRevealSignal()">📢 廣播電腦大螢幕:開始揭榜</button>
          <button class="btn-remote-close" onclick="App.broadcastCloseSignal()">🚪 命令電腦關門・待命下一班</button>
        </div>
      </div>

      <!-- 前 3 名石柱舞台 -->
      <div class="podium-stage" id="podiumStage">
        <div class="podium-col rank-second" id="podiumCol2">
          <div class="podium-badge">
            <div class="badge-name" id="podiumName2">--</div>
            <div class="badge-score" id="podiumScore2">-- 分</div>
          </div>
          <div class="podium-block">2</div>
        </div>
        <div class="podium-col rank-first" id="podiumCol1">
          <div class="podium-badge">
            <div class="badge-name" id="podiumName1">--</div>
            <div class="badge-score" id="podiumScore1">-- 分</div>
          </div>
          <div class="podium-block">1</div>
        </div>
        <div class="podium-col rank-third" id="podiumCol3">
          <div class="podium-badge">
            <div class="badge-name" id="podiumName3">--</div>
            <div class="badge-score" id="podiumScore3">-- 分</div>
          </div>
          <div class="podium-block">3</div>
        </div>
      </div>

      <!-- 第 4～10 名優等英雄席 -->
      <div class="top10-tier-bar" id="top10TierBar"></div>

      <!-- 全班名冊羊皮紙 -->
      <div class="roster-parchment-sheet" id="rosterParchmentSheet">
        <h3 class="roster-sheet-title" id="rosterSheetTitle">全班學員成績名冊 (以座號排序)</h3>
        <div class="roster-sheet-grid" id="rosterSheetGrid"></div>
      </div>
    </section>

    <!-- 4. 名冊批次管理頁面 -->
    <section id="view-roster-manager" class="view-panel">
      <div class="class-tabs-container" id="rosterTabBar"></div>
      
      <div class="manager-card">
        <div class="manager-header-bar">
          <h2 class="manager-title" id="rosterTargetClassTitle">【101 班】名冊管理</h2>
        </div>
        <div class="roster-instructions">
          支援直接複製貼上 Excel 欄位：<br>
          • 僅名單：<code>1 王小明</code><br>
          • 帶歷史分數：<code>1 王小明 25 4</code>（格式：座號 姓名 總分 週得分）
        </div>
        <textarea id="rosterBatchInput" class="manager-textarea" placeholder="1 王小明&#10;2 李小華&#10;3 張大同"></textarea>
        
        <div class="manager-btn-row">
          <button class="btn-gold-action" style="flex: 2;" onclick="App.applyBatchRoster()">💾 儲存並同步至 Google 試算表</button>
          <button class="btn-danger-action" style="flex: 1;" onclick="App.promptDeleteCurrentClass()">🗑️ 刪除此班</button>
        </div>
      </div>
    </section>

  </main>

  <script>
    /*
    ====================================================================================================
    🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨
    【全系統唯一設定區】請在此貼上真實的 Google Apps Script 網址 (結尾必須是 /exec)
    🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨
    ====================================================================================================
    */
    const CONFIG = {
      VERSION: "v1.8.0", // 🌟 單一真理來源：修改此處，全站自動連動
      GAS_API_URL: "https://script.google.com/macros/s/AKfycbxhgE9QmJTsMAl7USJrAKc5Ez8iU458L84BPzrSOPJTfOaVPFapD2TFmsgglrIbk-2XsA/exec",

    const SoundFx = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      playTone(freq, type, duration, delay = 0, gainLevel = 0.15) {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime + delay);
        gain.gain.setValueAtTime(gainLevel, this.ctx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + delay + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(this.ctx.currentTime + delay);
        osc.stop(this.ctx.currentTime + delay + duration);
      },
      playGateOpen() { this.playTone(90, 'triangle', 1.0, 0, 0.35); },
      playGateClose() { this.playTone(70, 'sawtooth', 0.8, 0, 0.25); },
      playDrumBeat() { this.playTone(130, 'square', 0.22, 0, 0.18); },
      playTierPop(freq = 600) { this.playTone(freq, 'sine', 0.12, 0, 0.16); },
      playFanfareVictory() {
        const sequence = [
          { f: 523.25, d: 0.14, t: 0 },
          { f: 659.25, d: 0.14, t: 0.14 },
          { f: 783.99, d: 0.14, t: 0.28 },
          { f: 1046.50, d: 0.5, t: 0.42 }
        ];
        sequence.forEach(n => this.playTone(n.f, 'square', n.d, n.t, 0.18));
      }
    };

    const App = {

      init() {
        this.renderVersionToUI(); // 🌟 啟動瞬間強制將 CONFIG.VERSION 注入首頁銘牌
        this.restoreSession();
        this.loadStorageData();
        this.sanitizeScores();

        this.renderAllClassTabs();

      renderVersionToUI() {
        document.title = `魔法學院教務魔導系統 - ${CONFIG.VERSION}`;
        const badge = document.getElementById('gateVersionBadge');
        if (badge) {
          badge.innerText = `⚜️ 核心系統版本：${CONFIG.VERSION} ⚜️`;
        }
      },

      sanitizeScores() {
        let changed = false;
        this.data.students.forEach(s => {
          if (s.weeklyScore < -999 || isNaN(s.weeklyScore)) {
            s.weeklyScore = 0;
            changed = true;
          }
          if (s.totalScore < -999 || isNaN(s.totalScore)) {
            s.totalScore = Math.max(0, s.baseScore || 0);
            changed = true;
          }
        });
        if (changed) this.saveStorageData();
      },

      checkAndAdvanceCalendarWeek() {
        const now = new Date();
        const startOfYear = new Date(now.getFullYear(), 0, 1);
        const dayOfYear = ((now - startOfYear) / 86400000) + 1;
        const currentWeekNum = Math.ceil((dayOfYear + startOfYear.getDay()) / 7);

        const bannerTag = document.getElementById('currentWeekBannerTag');
        if (bannerTag) bannerTag.innerText = `【${this.data.currentWeekKey || '第1週'}】`;

        if (this.data.lastCheckedWeekNumber !== null && this.data.lastCheckedWeekNumber !== currentWeekNum) {
          const weekDigits = parseInt(this.data.currentWeekKey.replace(/[^0-9]/g, ''), 10) || 1;
          const newWeekKey = `第${weekDigits + 1}週`;
          this.data.currentWeekKey = newWeekKey;
          this.data.lastCheckedWeekNumber = currentWeekNum;

          this.data.students.forEach(st => {
            const bonus = Number(st.weeklyBonus) || 0;
            st.weeklyScore = bonus;
            st.totalScore = (Number(st.totalScore) || 0) + bonus;
          });

          this.saveStorageData();
          this.pushScoresToCloud();
          alert(`🔔 已邁入新的一週（${newWeekKey}）！已自動發放幹部每週固定加分！`);
        } else {
          this.data.lastCheckedWeekNumber = currentWeekNum;
          this.saveStorageData();
        }
      },

      startSilentResyncLoop() {
        clearInterval(this.resyncTimer);

          this.fetchCloudData(true);

      initMqttChannel() {
        const clientId = 'magic_' + Math.random().toString(16).substring(2, 8);
        this.mqttClient = mqtt.connect(CONFIG.MQTT_BROKER, {
          clientId: clientId,
          clean: true,
          reconnectPeriod: 500,
          keepalive: 30
        });

        this.mqttClient.on('connect', () => {
          this.mqttClient.subscribe(CONFIG.MQTT_TOPIC, (err) => {
            if (!err) {
              const logElem = document.getElementById('tvHeartbeatLog');
              if (logElem) logElem.innerText = `🟢 遠端遙控通道已直連 (${CONFIG.VERSION} 就緒)`;
            }
          });
          this.startHeartbeatProbe();
        });

        this.mqttClient.on('message', (topic, message) => {
          if (topic === CONFIG.MQTT_TOPIC) {
            try {
              const payload = JSON.parse(message.toString());
              if (payload.action === 'PING') return;

              if (payload.action === 'SYNC_PERIOD') {
                this.rankingPeriod = payload.period;
                const btnToggle = document.getElementById('btnToggleRankingType');
                if (btnToggle) {
                  btnToggle.innerText = `目前為:【${this.rankingPeriod === 'weekly' ? '週排行榜' : '總排行榜'}】`;
                }
                this.loadLeaderboardData();
                return;
              }

              if (payload.action === 'SYNC_CLASS') {
                this.currentClass = payload.classId;
                this.renderAllClassTabs();
                this.updateLeaderboardSelectValue();
                this.loadLeaderboardData();
                if (document.getElementById('view-workspace').classList.contains('active')) {
                  this.renderStudentCards();
                  this.initNotesUnitSelector();
                }
                return;
              }

              if (this.isTvStandby) {
                if (payload.action === 'REVEAL') {
                  this.executeRemoteReveal(payload.classId, payload.period);
                } else if (payload.action === 'CLOSE') {
                  this.executeRemoteClose();
                }
              }
            } catch (e) {
              console.warn("廣播訊息解析跳過", e);
            }
          }
        });

        this.mqttClient.on('offline', () => {
          const logElem = document.getElementById('tvHeartbeatLog');
          if (logElem) logElem.innerText = "🟡 通道離線重連中...";
        });
      },

      startHeartbeatProbe() {
        clearInterval(this.heartbeatTimer);
        this.heartbeatTimer = setInterval(() => {
          if (this.mqttClient && this.mqttClient.connected) {
            this.mqttClient.publish(CONFIG.MQTT_TOPIC, JSON.stringify({ action: 'PING', t: Date.now() }), { qos: 0 });
          }
        }, CONFIG.HEARTBEAT_INTERVAL);
      },

      broadcastRevealSignal() {
        if (!this.mqttClient || !this.mqttClient.connected) {
          alert('魔導通訊正在重連中，請稍候重試！');
          return;
        }

        const payload = JSON.stringify({
          action: 'REVEAL',
          classId: this.currentClass,
          period: this.rankingPeriod,
          timestamp: Date.now()
        });

        this.mqttClient.publish(CONFIG.MQTT_TOPIC, payload, { qos: 1 });

        if (navigator.vibrate) navigator.vibrate(25);
        this.loadLeaderboardData();
        document.getElementById('podiumCol1').classList.add('reveal');
        document.getElementById('podiumCol2').classList.add('reveal');
        document.getElementById('podiumCol3').classList.add('reveal');
        document.querySelectorAll('.tier-card').forEach(c => c.classList.add('reveal'));

        alert(`📢 廣播成功！電腦大螢幕即刻開門！\n班級：${this.currentClass}\n榜別：${this.rankingPeriod === 'weekly' ? '週排行榜' : '總排行榜'}`);

      broadcastCloseSignal() {
        if (!this.mqttClient || !this.mqttClient.connected) {
          alert('魔導通訊正在重連中，請稍候重試！');
          return;
        }

        const payload = JSON.stringify({ action: 'CLOSE', timestamp: Date.now() });

        if (navigator.vibrate) navigator.vibrate([20, 50, 20]);
        alert('🚪 已命令電腦大門向內閉合，進入待命狀態！');

      switchView(viewKey) {
        if (!this.sessionUnlocked && viewKey !== 'gate' && !this.isTvStandby) return;

        if (this.notesDirty && viewKey !== 'workspace') {
          if (confirm('⚠️ 備課筆記尚未儲存，是否立即儲存？')) {
            this.saveCurrentNotes();
          } else {
            this.notesDirty = false;
          }
        }

        document.querySelectorAll('.view-panel').forEach(p => {
          p.classList.remove('active');
          p.style.display = 'none';
        });
        document.querySelectorAll('.btn-nav-magic').forEach(b => b.classList.remove('active'));

        let target = null;
        if (viewKey === 'workspace') {
          target = document.getElementById('view-workspace');
          document.getElementById('navBtnWorkspace').classList.add('active');
          this.renderStudentCards();
          this.initNotesUnitSelector();
        } else if (viewKey === 'leaderboard') {
          target = document.getElementById('view-leaderboard');
          document.getElementById('navBtnLeaderboard').classList.add('active');
          this.loadLeaderboardData();
          document.getElementById('podiumCol1').classList.add('reveal');
          document.getElementById('podiumCol2').classList.add('reveal');
          document.getElementById('podiumCol3').classList.add('reveal');
          document.querySelectorAll('.tier-card').forEach(c => c.classList.add('reveal'));
          document.getElementById('rosterParchmentSheet').classList.add('active-show');
        } else if (viewKey === 'roster') {
          target = document.getElementById('view-roster-manager');
          document.getElementById('navBtnRoster').classList.add('active');
          this.renderAllClassTabs();
          this.loadRosterManagerText();
        }

        if (target) {
          target.classList.add('active');
          target.style.display = 'flex';
        }
      },

      switchPhoneMode(mode) {
        const scoringCol = document.getElementById('scoringColumn');
        const notesCol = document.getElementById('notesColumn');
        const btnScore = document.getElementById('btnPhoneScoring');
        const btnNotes = document.getElementById('btnPhoneNotes');

        if (mode === 'scoring') {
          scoringCol.style.display = 'flex';
          notesCol.classList.remove('phone-active');
          btnScore.classList.add('active');
          btnNotes.classList.remove('active');
        } else {
          scoringCol.style.display = 'none';
          notesCol.classList.add('phone-active');
          btnNotes.classList.add('active');
          btnScore.classList.remove('active');
          this.scrollToProgressMarker();
        }
      },

      loadStorageData() {
        const raw = localStorage.getItem('magic_academy_store_' + CONFIG.VERSION);
        if (raw) {
          try {
            this.data = JSON.parse(raw);
          } catch (e) {
            this.generateSeedData();
          }
        } else {
          this.generateSeedData();
        }
      },

      generateSeedData() {
        const list = [];
        this.data.classes.forEach(cid => {
          for (let i = 1; i <= 20; i++) {
            list.push({
              classId: cid,
              seatNo: i,
              name: `學員 ${i} 號`,
              weeklyBonus: 0,
              baseScore: 0,
              totalScore: 0,
              weeklyScore: 0
            });
          }
        });
        this.data.students = list;
        this.data.notes = [
          {
            classId: '101',
            noteId: '101_init',
            dateTitle: '2026-10-01 (首堂課)',
            content: '<div><b>📌 今日任務：</b></div><ul><li>新學期重點介紹</li><li>魔杖持握實操</li></ul>'
          }
        ];
        this.data.currentWeekKey = "第1週";
        this.saveStorageData();
      },

      saveStorageData() {
        localStorage.setItem('magic_academy_store_' + CONFIG.VERSION, JSON.stringify(this.data));
      },

      renderAllClassTabs() {
        const bars = [document.getElementById('classTabBar'), document.getElementById('rosterTabBar')];
        bars.forEach(bar => {
          if (!bar) return;
          bar.innerHTML = "";
          this.data.classes.forEach(c => {
            const pill = document.createElement('button');
            pill.className = `class-tab-pill ${c === this.currentClass ? 'active' : ''}`;
            pill.innerText = `${c} 班`;
            pill.draggable = true;
            pill.dataset.classId = c;

            pill.ondragstart = (e) => {
              this.draggedClassId = c;
              e.dataTransfer.setData('text/plain', c);
            };
            pill.ondragover = (e) => {
              e.preventDefault();
              pill.classList.add('drag-over');
            };
            pill.ondragleave = () => {
              pill.classList.remove('drag-over');
            };
            pill.ondrop = (e) => {
              e.preventDefault();
              pill.classList.remove('drag-over');
              const targetClassId = c;
              if (this.draggedClassId && this.draggedClassId !== targetClassId) {
                this.reorderClasses(this.draggedClassId, targetClassId);
              }
            };

            let pressTimer;
            pill.ontouchstart = (e) => {
              pressTimer = setTimeout(() => {
                if (navigator.vibrate) navigator.vibrate(30);
                this.draggedClassId = c;
                pill.classList.add('drag-over');
              }, 450);
            };
            pill.ontouchend = () => clearTimeout(pressTimer);
            pill.ontouchmove = (e) => {
              if (!this.draggedClassId) return;
              const touch = e.touches[0];
              const elem = document.elementFromPoint(touch.clientX, touch.clientY);
              if (elem && elem.dataset && elem.dataset.classId && elem.dataset.classId !== this.draggedClassId) {
                clearTimeout(pressTimer);
                this.reorderClasses(this.draggedClassId, elem.dataset.classId);
                this.draggedClassId = null;
              }
            };

            pill.onclick = () => {
              if (this.notesDirty) {
                if (confirm('⚠️ 備課筆記尚未儲存，是否立即儲存？')) {
                  this.saveCurrentNotes();
                } else {
                  this.notesDirty = false;
                }
              }
              this.currentClass = c;
              this.renderAllClassTabs();
              this.renderStudentCards();
              this.initNotesUnitSelector();
              this.loadRosterManagerText();
              this.updateLeaderboardSelectValue();
              this.loadLeaderboardData();

              if (this.mqttClient && this.mqttClient.connected) {
                this.mqttClient.publish(CONFIG.MQTT_TOPIC, JSON.stringify({
                  action: 'SYNC_CLASS',
                  classId: this.currentClass,
                  t: Date.now()
                }), { qos: 1 });
              }
            };

            bar.appendChild(pill);
          });

          const addBtn = document.createElement('button');
          addBtn.className = "btn-add-class-pill";
          addBtn.innerText = "➕ 新增班級";
          addBtn.onclick = () => this.promptAddNewClass();
          bar.appendChild(addBtn);
        });

        const titleElem = document.getElementById('rosterTargetClassTitle');
        if (titleElem) titleElem.innerText = `【${this.currentClass} 班】名冊管理`;
      },

      reorderClasses(fromId, toId) {
        const fromIdx = this.data.classes.indexOf(fromId);
        const toIdx = this.data.classes.indexOf(toId);
        if (fromIdx === -1 || toIdx === -1) return;

        this.data.classes.splice(fromIdx, 1);
        this.data.classes.splice(toIdx, 0, fromId);

        this.saveStorageData();
        this.renderAllClassTabs();
        this.populateLeaderboardSelect();

        if (CONFIG.GAS_API_URL && !CONFIG.GAS_API_URL.includes("SAMPLE")) {
          fetch(CONFIG.GAS_API_URL, {
            method: 'POST',
            mode: 'cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({ action: 'reorder_sheets', order: this.data.classes })
          }).catch(err => console.warn('分頁排序同步延遲', err));
        }
      },

      /*
      ======================================================================
      備課筆記模組 (含進度標記與另存他班核心)
      ======================================================================
      */
      initNotesUnitSelector() {
        const sel = document.getElementById('notesUnitSelect');
        if (!sel) return;
        sel.innerHTML = "";

        const classNotes = this.data.notes.filter(n => n.classId === this.currentClass);
        if (classNotes.length === 0) {
          const defaultNote = {
            classId: this.currentClass,
            noteId: `${this.currentClass}_${Date.now()}`,
            dateTitle: `${new Date().toISOString().split('T')[0]} (首堂課)`,
            content: '<div><b>📌 今日任務：</b></div><ul><li>新學期重點介紹</li><li>魔杖持握實操</li></ul>'
          };
          this.data.notes.push(defaultNote);
          this.saveStorageData();
          classNotes.push(defaultNote);
        }

        classNotes.forEach((n) => {
          const opt = document.createElement('option');
          opt.value = n.noteId;
          opt.innerText = n.dateTitle;
          sel.appendChild(opt);
        });

        this.activeNoteId = classNotes[0].noteId;
        sel.value = this.activeNoteId;
        this.renderActiveNoteContent();
      },

      renderActiveNoteContent() {
        const note = this.data.notes.find(n => n.noteId === this.activeNoteId);
        const editor = document.getElementById('notesEditor');
        if (editor && note) {
          editor.innerHTML = note.content;
          this.notesDirty = false;
          setTimeout(() => this.scrollToProgressMarker(), 250);
        }
      },

      scrollToProgressMarker() {
        const editor = document.getElementById('notesEditor');
        if (!editor) return;
        const marker = editor.querySelector('.magic-progress-marker');
        if (marker) {
          marker.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      },

      insertProgressBookmark() {
        const editor = document.getElementById('notesEditor');
        if (!editor) return;

        const oldMarkers = editor.querySelectorAll('.magic-progress-marker');
        oldMarkers.forEach(el => {
          const badge = el.querySelector('.magic-progress-badge');
          if (badge) badge.remove();
          const parent = el.parentNode;
          while (el.firstChild) parent.insertBefore(el.firstChild, el);
          el.remove();
        });

        const selection = window.getSelection();
        if (!selection || !selection.rangeCount) {
          alert('請先在筆記中點選您教到的段落位置！');
          return;
        }

        const range = selection.getRangeAt(0);
        const markerSpan = document.createElement('span');
        markerSpan.className = 'magic-progress-marker';
        markerSpan.innerHTML = `<span class="magic-progress-badge">📍 進度</span>`;

        try {
          if (!range.collapsed) {
            markerSpan.appendChild(range.extractContents());
          }
          range.insertNode(markerSpan);
          selection.removeAllRanges();
          this.notesDirty = true;
          this.saveCurrentNotes();
          alert('✨ 已在此處插下「📍 教學進度標記」！下次進入系統將自動平滑定位於此。');
        } catch (e) {
          alert('標記插入失敗，請在段落文字內重新選取位置！');
        }
      },

      onUnitChange() {
        if (this.notesDirty) {
          if (confirm('⚠️ 目前單元內容尚未儲存，是否立即儲存？')) {
            this.saveCurrentNotes();
          }
        }
        this.activeNoteId = document.getElementById('notesUnitSelect').value;
        this.renderActiveNoteContent();
      },

      promptAddUnit() {
        const today = new Date().toISOString().split('T')[0];
        const title = prompt("請輸入新課程單元與日期標題：", `${today} (第${this.data.notes.filter(n => n.classId === this.currentClass).length + 1}單元)`);
        if (!title) return;

        const newNote = {
          classId: this.currentClass,
          noteId: `${this.currentClass}_${Date.now()}`,
          dateTitle: title.trim(),
          content: '<div><b>📌 本單元重點：</b></div><ul><li>任務 1：</li></ul>'
        };

        this.data.notes.unshift(newNote);
        this.saveStorageData();
        this.initNotesUnitSelector();
        this.activeNoteId = newNote.noteId;
        document.getElementById('notesUnitSelect').value = newNote.noteId;
        this.renderActiveNoteContent();

        this.saveCurrentNotes();
      },

      promptRenameUnit() {
        const note = this.data.notes.find(n => n.noteId === this.activeNoteId);
        if (!note) return;
        const newTitle = prompt("修改目前單元名稱：", note.dateTitle);
        if (!newTitle || newTitle.trim() === note.dateTitle) return;

        note.dateTitle = newTitle.trim();
        this.saveStorageData();
        this.initNotesUnitSelector();
        document.getElementById('notesUnitSelect').value = note.noteId;
        this.saveCurrentNotes();
      },

      promptArchiveUnit() {
        const classNotes = this.data.notes.filter(n => n.classId === this.currentClass);
        if (classNotes.length <= 1) {
          alert('本班至少需保留一個單元，無法全數刪除！');
          return;
        }

        const note = this.data.notes.find(n => n.noteId === this.activeNoteId);
        if (!confirm(`確定要刪除/封存【${note.dateTitle}】嗎？\n（Google 試算表端將安全標記隱藏）`)) return;

        const deletedId = this.activeNoteId;
        this.data.notes = this.data.notes.filter(n => n.noteId !== deletedId);
        this.saveStorageData();
        this.initNotesUnitSelector();

        if (CONFIG.GAS_API_URL && !CONFIG.GAS_API_URL.includes("SAMPLE")) {
          fetch(CONFIG.GAS_API_URL, {
            method: 'POST',
            mode: 'cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({ action: 'archive_note', data: { noteId: deletedId } })
          }).catch(e => console.warn('筆記封存同步延遲', e));
        }
      },

      toggleNotesMode() {
        this.isNotesEditMode = !this.isNotesEditMode;
        const btn = document.getElementById('btnNotesMode');
        const tb = document.getElementById('wysiwygToolbar');
        const editor = document.getElementById('notesEditor');

        if (this.isNotesEditMode) {
          btn.innerText = "✏️ 編輯中";
          btn.classList.add('edit-mode');
          tb.classList.add('active');
          editor.contentEditable = "true";
          editor.classList.remove('readonly');
        } else {
          if (this.notesDirty) {
            if (confirm('⚠️ 筆記內容已修改，是否立即儲存？')) {
              this.saveCurrentNotes();
            } else {
              this.notesDirty = false;
              this.renderActiveNoteContent();
            }
          }
          btn.innerText = "📖 閱讀中";
          btn.classList.remove('edit-mode');
          tb.classList.remove('active');
          editor.contentEditable = "false";
          editor.classList.add('readonly');
          this.scrollToProgressMarker();
        }
      },

      async saveCurrentNotes() {
        const editor = document.getElementById('notesEditor');
        const note = this.data.notes.find(n => n.noteId === this.activeNoteId);
        if (!note || !editor) return;

        note.content = editor.innerHTML;
        this.notesDirty = false;
        this.saveStorageData();

        if (CONFIG.GAS_API_URL && !CONFIG.GAS_API_URL.includes("SAMPLE")) {
          try {
            await fetch(CONFIG.GAS_API_URL, {
              method: 'POST',
              mode: 'cors',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify({
                action: 'save_notes',
                data: {
                  classId: this.currentClass,
                  noteId: note.noteId,
                  dateTitle: note.dateTitle,
                  content: note.content
                }
              })
            });
          } catch (e) {
            console.warn('筆記雲端同步延遲', e);
          }
        }
        alert('✨ 備課筆記已成功存檔！');
      },

      openCopyToClassModal() {
        const note = this.data.notes.find(n => n.noteId === this.activeNoteId);
        if (!note) return;

        const overlay = document.getElementById('copyDialogOverlay');
        const titleInput = document.getElementById('copyTargetTitleInput');
        const cbContainer = document.getElementById('copyClassCheckboxes');

        titleInput.value = note.dateTitle;
        cbContainer.innerHTML = "";

        const otherClasses = this.data.classes.filter(c => c !== this.currentClass);
        if (otherClasses.length === 0) {
          alert('目前系統僅有單一班級，無需另存至其他班級！');
          return;
        }

        otherClasses.forEach(cid => {
          const label = document.createElement('label');
          label.className = 'copy-class-item';
          label.innerHTML = `
            <input type="checkbox" name="targetClass" value="${cid}" checked>
            <span>【${cid} 班】</span>
          `;
          cbContainer.appendChild(label);
        });

        overlay.style.display = 'flex';
      },

      closeCopyToClassModal() {
        document.getElementById('copyDialogOverlay').style.display = 'none';
      },

      toggleSelectAllCopyClasses() {
        const cbs = document.querySelectorAll('input[name="targetClass"]');
        const allChecked = Array.from(cbs).every(cb => cb.checked);
        cbs.forEach(cb => cb.checked = !allChecked);
      },

      async executeCopyToClasses() {
        const currentNote = this.data.notes.find(n => n.noteId === this.activeNoteId);
        if (!currentNote) return;

        const newTitle = document.getElementById('copyTargetTitleInput').value.trim();
        if (!newTitle) {
          alert('單元標題不可為空！');
          return;
        }

        const selectedClasses = Array.from(document.querySelectorAll('input[name="targetClass"]:checked')).map(cb => cb.value);
        if (selectedClasses.length === 0) {
          alert('請至少勾選一個目標班級！');
          return;
        }

        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = document.getElementById('notesEditor').innerHTML;
        const markers = tempDiv.querySelectorAll('.magic-progress-marker');
        markers.forEach(el => {
          const badge = el.querySelector('.magic-progress-badge');
          if (badge) badge.remove();
          const parent = el.parentNode;
          while (el.firstChild) parent.insertBefore(el.firstChild, el);
          el.remove();
        });
        const cleanContent = tempDiv.innerHTML;

        const notesToSaveCloud = [];
        let successCount = 0;

        for (const cid of selectedClasses) {
          const existing = this.data.notes.find(n => n.classId === cid && n.dateTitle === newTitle);
          if (existing) {
            const overwrite = confirm(`⚠️ 【${cid} 班】已存在同名單元「${newTitle}」！\n是否確認覆蓋原筆記？\n（點選【取消】將跳過此班）`);
            if (!overwrite) continue;
            existing.content = cleanContent;
            notesToSaveCloud.push(existing);
            successCount++;
          } else {
            const newNoteObj = {
              classId: cid,
              noteId: `${cid}_${Date.now()}_${Math.random().toString(36).substring(2,6)}`,
              dateTitle: newTitle,
              content: cleanContent
            };
            this.data.notes.unshift(newNoteObj);
            notesToSaveCloud.push(newNoteObj);
            successCount++;
          }
        }

        this.saveStorageData();
        this.closeCopyToClassModal();

        alert(`✨ 成功將筆記派發至 ${successCount} 個班級！已自動清除進度標記為純淨副本。`);

        if (CONFIG.GAS_API_URL && !CONFIG.GAS_API_URL.includes("SAMPLE")) {
          fetch(CONFIG.GAS_API_URL, {
            method: 'POST',
            mode: 'cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({
              action: 'batch_save_notes',
              notesList: notesToSaveCloud
            })
          }).catch(e => console.warn('批次另存雲端同步延遲', e));
        }
      },

        textGrid.innerHTML = "";

          textGrid.appendChild(sw);

          const sw = document.createElement('div');

          sw.style.backgroundColor = c;
          sw.title = c;

            document.execCommand('hiliteColor', false, c);
            bgGrid.classList.remove('show');
          };
          bgGrid.appendChild(sw);

      togglePalette(id) {
        const el = document.getElementById(id);
        if (el) el.classList.toggle('show');
      },

      applyFontSize(size) {
        document.execCommand('fontSize', false, '7');
        const fontElements = document.getElementsByTagName('font');
        for (let i = 0; i < fontElements.length; i++) {
          if (fontElements[i].size === '7') {
            fontElements[i].removeAttribute('size');

      initTabKeyNesting() {
        const editor = document.getElementById('notesEditor');
        if (!editor) return;

        editor.addEventListener('input', () => {
          this.notesDirty = true;
        });

        editor.addEventListener('keydown', (e) => {
          if (e.key === 'Tab') {
            e.preventDefault();
            if (e.shiftKey) {
              document.execCommand('outdent');
            } else {
              document.execCommand('indent');
            }
          }
        });

        document.addEventListener('click', (e) => {
          if (!e.target.closest('.palette-popover')) {
            document.querySelectorAll('.palette-dropdown').forEach(p => p.classList.remove('show'));

      排行榜邏輯 (v1.8.0 嚴格防禦負分)
      ======================================================================
      */
      populateLeaderboardSelect() {
        const sel = document.getElementById('leaderboardClassSelect');
        if (!sel) return;
        sel.innerHTML = "";
        this.data.classes.forEach(c => {

      onLeaderboardClassChange() {
        this.currentClass = document.getElementById('leaderboardClassSelect').value;
        this.renderAllClassTabs();
        this.loadLeaderboardData();

        if (this.mqttClient && this.mqttClient.connected) {
          this.mqttClient.publish(CONFIG.MQTT_TOPIC, JSON.stringify({

          }), { qos: 1 });
