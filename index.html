<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>魔法學院教務魔導系統 V3.4.1</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚜️</text></svg>">
  <!-- 導入安全極速 MQTT WebSocket 函式庫，實現真正 0.1秒零延遲跨裝置廣播 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <style>
    :root {
      --bg: #071912;
      --card-bg: linear-gradient(145deg, #103628, #071e16);
      --card-act: #184c39;
      --border: #1d5541;
      --gold: #d4af37;
      --gold-l: #f7e49a;
      --parch: #f6f1e3;
      --parch-b: #ded3b8;
      --text: #f0f7f4;
      --font-serif: "Cinzel", "Noto Serif TC", serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; height: 100dvh; background: var(--bg); color: var(--text); font-family: var(--font-sans); overflow: hidden; }
    
    /* 頂部導航列 */
    header { display: none; height: 50px; background: #05140e; border-bottom: 2px solid var(--gold); padding: 0 8px; justify-content: space-between; align-items: center; z-index: 50; flex-shrink: 0; }
    header.auth { display: flex; }
    .brand { font-family: var(--font-serif); font-size: 0.95rem; color: var(--gold); display: flex; align-items: center; gap: 4px; font-weight: bold; }
    .header-acts { display: flex; gap: 5px; align-items: center; }
    .badge { font-size: 0.72rem; padding: 2px 6px; border-radius: 4px; border: 1px solid #7f8c8d; color: #95a5a6; }
    .badge.on { border-color: #2ecc71; color: #2ecc71; background: rgba(46,204,113,0.15); }
    .btn-nav { background: rgba(212,175,55,0.12); border: 1px solid var(--gold); color: var(--gold-l); padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 0.78rem; font-family: var(--font-serif); transition: all 0.2s; }
    .btn-nav.active { background: var(--gold) !important; color: #071912 !important; font-weight: bold !important; box-shadow: 0 0 8px rgba(212,175,55,0.6); }
    .gem { width: 10px; height: 10px; border-radius: 50%; background: #2ecc71; display: inline-block; transition: background 0.3s; }
    .gem.pend { background: #f39c12; }
    .gem.err { background: #e74c3c; }
    
    .viewport { width: 100%; height: calc(100% - 50px); position: relative; overflow: hidden; }
    .panel { position: absolute; inset: 0; display: none; flex-direction: column; background: var(--bg); z-index: 10; overflow: hidden; }
    .panel.active { display: flex !important; z-index: 20; }
    
    /* 學院大門視圖 */
    #view-gate { position: absolute; inset: 0; height: 100dvh; background: radial-gradient(circle, #103326 0%, #030a07 100%); justify-content: center; align-items: center; z-index: 100; display: flex; }
    .gate-portal { position: absolute; inset: 0; display: flex; pointer-events: none; z-index: 10; perspective: 1000px; }
    .gate-door { width: 50%; height: 100%; background: #081c14; border-bottom: 4px solid var(--gold); transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
    .gate-door.l { border-right: 2px solid var(--gold); transform-origin: left center; }
    .gate-door.r { border-left: 2px solid var(--gold); transform-origin: right center; }
    #view-gate.open .gate-door.l { transform: rotateY(-95deg); }
    #view-gate.open .gate-door.r { transform: rotateY(95deg); }
    .gate-card { position: relative; z-index: 20; width: 90%; max-width: 360px; background: rgba(11,37,28,0.96); border: 2px solid var(--gold); border-radius: 10px; padding: 22px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.8); }
    .pwd-ipt { width: 100%; padding: 10px; font-size: 1.1rem; text-align: center; background: #040f0b; border: 1.5px solid var(--gold); color: var(--gold-l); border-radius: 6px; outline: none; margin: 12px 0; }
    .btn-gold { width: 100%; padding: 10px; font-family: var(--font-serif); font-size: 0.95rem; font-weight: bold; color: #071912; background: linear-gradient(180deg, var(--gold-l), var(--gold)); border: none; border-radius: 6px; cursor: pointer; transition: filter 0.2s; }
    .btn-gold:active { filter: brightness(0.85); }
    
    /* 班級選擇標籤列 */
    .tabs-bar { display: flex; overflow-x: auto; gap: 6px; padding: 6px 10px; background: #0b251c; border-bottom: 1px solid rgba(212,175,55,0.25); flex-shrink: 0; scrollbar-width: none; }
    .tabs-bar::-webkit-scrollbar { display: none; }
    .tab-pill { padding: 5px 14px; border-radius: 16px; border: 1px solid var(--gold); background: rgba(0,0,0,0.35); color: #cbdad3; font-size: 0.82rem; white-space: nowrap; cursor: pointer; transition: all 0.2s; }
    .tab-pill.active { background: var(--gold) !important; color: #071912 !important; font-weight: bold !important; box-shadow: 0 0 6px rgba(212,175,55,0.5); }
    
    /* 手機外螢幕切換欄 */
    .phone-bar { display: flex; background: #05140e; border-bottom: 1px solid rgba(212,175,55,0.3); flex-shrink: 0; }
    .phone-btn { flex: 1; padding: 10px 4px; background: transparent; border: none; color: #9cb5ab; font-size: 0.88rem; cursor: pointer; border-bottom: 2px solid transparent; }
    .phone-btn.active { color: var(--gold-l) !important; background: rgba(212,175,55,0.12) !important; border-bottom: 2px solid var(--gold) !important; font-weight: bold !important; }
    
    /* 雙欄切換結構 */
    .split { flex: 1; display: flex; overflow: hidden; position: relative; }
    .col-score { flex: 1; display: flex; flex-direction: column; height: 100%; min-width: 0; }
    .guide-banner { background: #0c2b20; border-bottom: 1px solid var(--gold); padding: 6px 10px; display: flex; justify-content: space-between; align-items: center; white-space: nowrap; flex-shrink: 0; }
    .btn-settle { background: rgba(212,175,55,0.18); border: 1px solid var(--gold); color: var(--gold-l); font-size: 0.74rem; font-weight: bold; padding: 4px 9px; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
    .btn-settle.dirty { background: rgba(243,156,18,0.4) !important; border-color: #f39c12 !important; color: #ffd280 !important; font-weight: bold; }
    
    /* 學生名冊雙列大卡片 */
    .grid { flex: 1; overflow-y: auto; padding: 8px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; align-content: start; -webkit-overflow-scrolling: touch; }
    .card { background: var(--card-bg); border: 1.5px solid var(--border); border-radius: 8px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; position: relative; cursor: pointer; transition: transform 0.1s, border-color 0.2s; }
    .card:active { transform: scale(0.96); background: var(--card-act); border-color: var(--gold); }
    .card-seat { position: absolute; top: 4px; left: 6px; font-size: 0.72rem; color: #9cb5ab; font-weight: bold; }
    .card-star { position: absolute; top: 4px; right: 6px; font-size: 0.75rem; color: #ffd700; font-weight: bold; background: rgba(0,0,0,0.6); padding: 1px 5px; border-radius: 8px; }
    .card-name { font-size: 1.1rem; font-weight: bold; color: #fff; margin: 2px 0; }
    .card-score { font-size: 1.3rem; font-family: var(--font-serif); font-weight: bold; color: var(--gold); }
    
    /* 底部加減分快捷列 */
    .bottom-bar { height: 50px; background: #05140e; border-top: 1.5px solid var(--gold); padding: 0 8px; display: flex; justify-content: space-around; align-items: center; gap: 5px; flex-shrink: 0; }
    .chip { flex: 1; height: 38px; border: 1px solid rgba(212,175,55,0.4); border-radius: 5px; background: rgba(212,175,55,0.08); color: var(--gold-l); font-size: 0.95rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .chip.active { background: var(--gold) !important; color: #071912 !important; box-shadow: 0 0 6px rgba(212,175,55,0.6); }
    
    /* 備課筆記卷軸 */
    .col-notes { flex: 1; display: none; flex-direction: column; background: var(--parch); color: #201e19; height: 100%; overflow: hidden; min-width: 0; }
    .col-notes.phone-on { display: flex; }
    .notes-bar { padding: 6px 8px; background: #ebdcc0; border-bottom: 1px solid var(--parch-b); display: flex; justify-content: space-between; align-items: center; gap: 4px; flex-shrink: 0; }
    .notes-tools { display: none; flex-wrap: wrap; align-items: center; gap: 4px; padding: 4px 6px; background: #dfcfaf; border-bottom: 1px solid #c9b896; flex-shrink: 0; }
    .notes-tools.on { display: flex; }
    .btn-tool { background: #fff; border: 1px solid #bdae93; border-radius: 3px; padding: 3px 6px; font-size: 0.78rem; cursor: pointer; }
    .tool-color { width: 22px; height: 22px; padding: 0; border: 1px solid #bdae93; border-radius: 3px; cursor: pointer; vertical-align: middle; }
    .notes-box { flex: 1; padding: 12px 16px 12px 22px; outline: none; overflow-y: auto; font-size: 1.02rem; line-height: 1.6; -webkit-overflow-scrolling: touch; box-sizing: border-box; }
    .notes-box ul, .notes-box ol { padding-left: 28px !important; margin: 6px 0 !important; }
    .notes-box li { margin: 2px 0; }
    .marker { background: rgba(241,196,15,0.35); border-left: 4px solid #f39c12; padding: 2px 6px; border-radius: 0 4px 4px 0; }
    .marker-badge { background: #e67e22; color: #fff; font-size: 0.7rem; font-weight: bold; padding: 1px 4px; border-radius: 6px; margin-right: 4px; }
    
    /* 螢幕適配規則：>= 680px 左右並列 50% / 50% */
    @media (min-width: 680px) {
      .phone-bar { display: none !important; }
      .col-notes { flex: 0 0 50% !important; display: flex !important; order: 1; border-right: 2px solid var(--gold); }
      .col-score { flex: 0 0 50% !important; display: flex !important; order: 2; }
    }
    
    /* 榮譽揭榜視圖 */
    #view-leaderboard {
      background: radial-gradient(circle, #0e3527 0%, #030c08 100%);
      position: relative;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .lb-header-sticky {
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      background: #05140e;
      border-bottom: 1px solid rgba(212,175,55,0.3);
      z-index: 30;
      position: relative;
      width: 100%;
      flex-shrink: 0;
    }
    .lb-scroll-stage {
      flex: 1;
      width: 100%;
      overflow-y: scroll !important;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 70px;
    }
    .lb-scroll-stage::-webkit-scrollbar { width: 8px; }
    .lb-scroll-stage::-webkit-scrollbar-track { background: rgba(5,20,14,0.7); }
    .lb-scroll-stage::-webkit-scrollbar-thumb { background: rgba(212,175,55,0.4); border-radius: 4px; }
    .lb-scroll-stage::-webkit-scrollbar-thumb:hover { background: var(--gold); }

    .confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 15; }
    
    .podium { width: 92%; max-width: 760px; display: flex; justify-content: center; align-items: flex-end; gap: 10px; margin: 16px 0 10px 0; min-height: 230px; position: relative; z-index: 20; flex-shrink: 0; }
    .podium-col { flex: 1; display: flex; flex-direction: column; align-items: center; opacity: 1; transform: translateY(0); transition: all 0.8s cubic-bezier(0.18, 0.89, 0.32, 1.28); }
    .podium-col.anim-hide { opacity: 0 !important; transform: translateY(50px) !important; }
    .podium-col.reveal { opacity: 1 !important; transform: translateY(0) !important; }
    
    .podium-badge { background: rgba(11,37,28,0.95); border: 1.5px solid var(--gold); border-radius: 6px; padding: 6px; text-align: center; margin-bottom: 6px; width: 100%; min-height: 60px; display: flex; flex-direction: column; justify-content: center; }
    .p-name { font-size: clamp(0.85rem, 2vw, 1.1rem); font-weight: bold; color: #fff; line-height: 1.3; word-break: break-word; white-space: normal; }
    .p-score { font-family: var(--font-serif); font-size: 0.9rem; color: var(--gold-l); margin-top: 2px; }
    .podium-box { width: 100%; display: flex; justify-content: center; align-items: center; font-family: var(--font-serif); font-weight: bold; color: #05140e; border-radius: 6px 6px 0 0; }
    .p1 .podium-box { height: 125px; background: linear-gradient(180deg, #ffd700, #b8860b); font-size: 2.2rem; }
    .p2 .podium-box { height: 95px; background: linear-gradient(180deg, #e6e6e6, #8c8c8c); font-size: 1.7rem; }
    .p3 .podium-box { height: 75px; background: linear-gradient(180deg, #cd7f32, #7c471d); font-size: 1.5rem; }
    
    /* 🌟 第 4～10 名梯隊殿堂 (強化動態過渡與初始隱藏狀態) */
    .tier-hall { width: 92%; max-width: 760px; margin: 6px 0 16px 0; display: none; flex-direction: column; gap: 6px; position: relative; z-index: 20; flex-shrink: 0; }
    .tier-hall.active-hall { display: flex; }
    .tier-item {
      background: rgba(11,37,28,0.92);
      border: 1px solid rgba(212,175,55,0.4);
      border-radius: 6px;
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .tier-item.anim-hide { opacity: 0 !important; transform: translateY(35px) !important; pointer-events: none; }
    .tier-item.reveal { opacity: 1 !important; transform: translateY(0) !important; }
    .tier-rank { font-family: var(--font-serif); font-weight: bold; font-size: 0.95rem; color: var(--gold-l); min-width: 48px; }
    .tier-names { font-size: 0.92rem; font-weight: bold; color: #fff; flex: 1; margin: 0 10px; word-break: break-word; }
    .tier-score { font-family: var(--font-serif); font-weight: bold; font-size: 0.92rem; color: var(--gold); }
    
    /* 全班名冊總表 */
    .roster-sheet { width: 92%; max-width: 840px; background: rgba(9,29,22,0.95); border: 2px solid var(--gold); border-radius: 8px; padding: 14px; margin-bottom: 24px; position: relative; z-index: 20; opacity: 1; transform: translateY(0); transition: all 0.8s ease-out; flex-shrink: 0; }
    .roster-sheet.anim-hide { opacity: 0 !important; transform: translateY(30px) !important; }
    .roster-sheet.active-show { opacity: 1 !important; transform: translateY(0) !important; }
    .roster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .roster-card { background: rgba(255,255,255,0.06); border: 1px solid rgba(212,175,55,0.25); border-radius: 4px; padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; font-size: 0.84rem; }
    
    /* 名冊管理 */
    .mgr-box { max-width: 600px; margin: 16px auto; background: #0b251c; border: 1.5px solid var(--gold); border-radius: 8px; padding: 16px; width: 92%; }
    .mgr-txt { width: 100%; height: 220px; background: #04130d; border: 1px solid var(--border); border-radius: 4px; color: #fff; padding: 10px; font-family: monospace; font-size: 0.9rem; outline: none; margin: 10px 0; }
    
    /* 彈窗樣式 */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; }
    .modal-card { background: #0b251c; border: 2px solid var(--gold); border-radius: 8px; padding: 16px; width: 90%; max-width: 360px; color: #fff; }
    .modal-card input[type="text"], .modal-card input[type="password"] { width: 100%; padding: 8px; background: #04130d; border: 1px solid var(--border); color: #fff; margin: 8px 0; border-radius: 4px; }
  </style>
</head>
<body>
  <!-- 頂部導航列 -->
  <header id="header">
    <div class="brand"><span>⚜️</span> <span>魔導系統</span></div>
    <div class="header-acts">
      <span class="badge" id="tvBadge">🖥️ 離線</span>
      <span class="gem" id="syncGem" title="雲端同步狀態"></span>
      <button class="btn-nav active" id="nav-workspace" onclick="App.switchView('workspace')">後台</button>
      <button class="btn-nav" id="nav-leaderboard" onclick="App.switchView('leaderboard')">榮譽榜</button>
      <button class="btn-nav" id="nav-roster" onclick="App.switchView('roster')">名冊</button>
      <button class="btn-nav" style="border-color:#f39c12; color:#ffd280;" onclick="App.openPwdModal()">🔑 印記</button>
      <button class="btn-nav" style="border-color:#e74c3c; color:#ff9999;" onclick="App.logout()">登出</button>
    </div>
  </header>
  
  <main class="viewport">
    <!-- 學院大門視圖 -->
    <section id="view-gate">
      <div class="gate-portal"><div class="gate-door l"></div><div class="gate-door r"></div></div>
      <div class="gate-card">
        <h2 style="font-family:var(--font-serif); color:var(--gold-l);">魔法學院門扉</h2>
        <div id="gateVer" style="font-size:0.8rem; color:#ffd700; margin:6px 0;">⚜️ 核心版本：加載中 ⚜️</div>
        <div id="gateForm">
          <input type="password" id="pwdIpt" class="pwd-ipt" placeholder="••••" maxlength="8">
          <button class="btn-gold" onclick="App.auth()">驗證導師印記</button>
          <button class="btn-nav" style="width:100%; margin-top:10px; padding:9px;" id="btnStandby" onclick="App.startTvStandby()">🖥️ 電腦大螢幕待命</button>
        </div>
        <div id="gateLinks" style="display:none; flex-direction:column; gap:8px; margin-top:10px;">
          <button class="btn-gold" onclick="App.enter('workspace')">進入課堂後台 ➔</button>
          <button class="btn-gold" onclick="App.enter('leaderboard')">進入榮譽榜單 ➔</button>
          <button class="btn-gold" onclick="App.enter('roster')">進入名冊管理 ➔</button>
        </div>
      </div>
    </section>

    <!-- 課堂工作區視圖 (後台) -->
    <section id="view-workspace" class="panel">
      <!-- 手機外螢幕切換欄位 -->
      <div class="phone-bar">
        <button class="phone-btn active" id="btnPScore" onclick="App.togglePhone('score')">⚔️ 計分面板</button>
        <button class="phone-btn" id="btnPNotes" onclick="App.togglePhone('notes')">📜 備課卷軸</button>
      </div>
      <!-- 班級切換標籤 -->
      <div class="tabs-bar" id="wsTabs"></div>
      <div class="split">
        <!-- 備課筆記卷軸 (左側) -->
        <div class="col-notes" id="colNotes">
          <div class="notes-bar">
            <div style="display:flex; width:100%; gap:4px; align-items:center;">
              <select id="selNoteUnit" style="flex:1; min-width:0; padding:4px; font-size:0.82rem; font-weight:bold;" onchange="App.onNoteUnitChange()"></select>
              <button class="btn-tool" onclick="App.addNoteUnit()" title="新增週次筆記">➕</button>
              <button class="btn-tool" onclick="App.delNoteUnit()" title="刪除此週筆記">🗑️</button>
              <button class="btn-tool" id="btnEditNote" style="background:#27ae60; color:#fff; font-weight:bold;" onclick="App.toggleNoteMode()">📖 閱讀</button>
            </div>
          </div>
          <!-- 富文本工具列 -->
          <div class="notes-tools" id="noteTools">
            <select class="btn-tool" style="padding:1px 2px;" onchange="App.applyFontSize(this.value)">
              <option value="14px">14px</option>
              <option value="16px" selected>16px</option>
              <option value="18px">18px</option>
              <option value="22px">22px</option>
              <option value="26px">26px</option>
            </select>
            <button class="btn-tool" onclick="document.execCommand('bold')"><b>B</b></button>
            <button class="btn-tool" onclick="document.execCommand('italic')"><i>I</i></button>
            <button class="btn-tool" onclick="document.execCommand('underline')"><u>U</u></button>
            <label class="btn-tool" style="display:inline-flex; align-items:center; gap:2px;" title="文字顏色">
              🎨<input type="color" class="tool-color" value="#111111" onchange="document.execCommand('foreColor', false, this.value); App.triggerNoteAutoSave();">
            </label>
            <label class="btn-tool" style="display:inline-flex; align-items:center; gap:2px;" title="螢光底色">
              🖍️<input type="color" class="tool-color" value="#f1c40f" onchange="document.execCommand('hiliteColor', false, this.value); App.triggerNoteAutoSave();">
            </label>
            <button class="btn-tool" onclick="document.execCommand('insertUnorderedList')">• 項目</button>
            <button class="btn-tool" onclick="document.execCommand('insertOrderedList')">1. 編號</button>
            <button class="btn-tool" style="background:#f1c40f; font-weight:bold;" onclick="App.addBookmark()">📍 設進度</button>
            <button class="btn-tool" style="background:#3498db; color:#fff;" onclick="App.openCopyModal()">📤 另存他班</button>
            <span id="noteSaveTag" style="font-size:0.7rem; color:#27ae60; display:none;">✔ 已存</span>
            <button class="btn-tool" style="background:#27ae60; color:#fff; font-weight:bold;" onclick="App.saveNote(false)">💾 存檔</button>
          </div>
          <div class="notes-box" id="noteEditor" contenteditable="false"></div>
        </div>

        <!-- 學生計分面板 (右側) -->
        <div class="col-score" id="colScore">
          <div class="guide-banner">

        <p style="font-size:0.75rem; color:#9cb5ab; margin-bottom:8px;">長度需為 4～8 位英數字。儲存後，大螢幕廣播通訊將自動與新印記綁定隔離！</p>
        <label style="font-size:0.75rem; color:#bdc3c7;">目前印記：</label>
        <div id="curPwdDisplay" style="font-size:0.88rem; color:var(--gold); font-family:monospace; margin-bottom:6px;">••••</div>
        <label style="font-size:0.75rem; color:#bdc3c7;">輸入新印記：</label>
        <input type="text" id="newPwdIpt" maxlength="8" placeholder="例: 8888 或 ab1234">

          <button class="btn-tool" onclick="App.closePwdModal()">取消</button>

  <script>
    /*
    ================================================================================
    🚨🚨🚨 【唯一設定區】請在此貼上您的 Google Apps Script 部署網址 (/exec) 🚨🚨🚨
    ================================================================================
    */
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxhgE9QmJTsMAl7USJrAKc5Ez8iU458L84BPzrSOPJTfOaVPFapD2TFmsgglrIbk-2XsA/exec";
    /*
    ================================================================================
    */
    const VERSION = "v3.4.1";
    
    // 🌟 音效合成器 (Web Audio 原生合成)
    const SoundFx = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      },
      playStepNote(freq = 440) {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.28, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.19);
      },
      playDrum() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(32, now + 0.35);
        gain.gain.setValueAtTime(0.7, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.36);

        const osc2 = this.ctx.createOscillator();
        const gain2 = this.ctx.createGain();
        osc2.type = 'square';
        osc2.frequency.setValueAtTime(80, now);
        osc2.frequency.exponentialRampToValueAtTime(20, now + 0.15);
        gain2.gain.setValueAtTime(0.3, now);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc2.connect(gain2);
        gain2.connect(this.ctx.destination);
        osc2.start(now);
        osc2.stop(now + 0.16);
      },
      playFanfare() {
        this.init();
        const now = this.ctx.currentTime;
        const notes = [
          { f: 261.63, start: 0, dur: 0.15 },
          { f: 392.00, start: 0.14, dur: 0.15 },
          { f: 523.25, start: 0.28, dur: 0.18 },
          { f: 659.25, start: 0.44, dur: 0.2 },
          { f: 783.99, start: 0.62, dur: 0.8 }
        ];
        notes.forEach(n => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(n.f, now + n.start);
          gain.gain.setValueAtTime(0, now + n.start);
          gain.gain.linearRampToValueAtTime(0.35, now + n.start + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + n.start + n.dur);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + n.start);
          osc.stop(now + n.start + n.dur + 0.05);
        });
      }
    };

    const App = {
      curClass: "", weight: 1, rankType: "weekly", lbWeek: "第1週",
      isTv: false, isNoteEdit: false, activeNoteId: null,
      noteDirty: false, noteTimer: null, longFired: false,
      mqttClient: null, mqttConnected: false, lastTriggerId: 0,
      data: { classes: [], students: [], notes: [], curWeek: "第1週", weeks: ["第1週"], pwd: "8888", buf: {} },

      init() {
        document.getElementById('gateVer').innerText = `⚜️ 核心版本：${VERSION} ⚜️`;
        this.migrateAndLoadStorage();
        if (sessionStorage.getItem('magic_auth') === 'true') {
          this.authSuccess();
        }
        this.renderTabs();
        this.renderCards();
        this.initLbWeeks();
        this.initNotePaste();
        this.initCanvasConfetti();
        this.initMqttBroker();
        this.fetchCloud();
      },

      getIsolatedTopic() {
        const pwdStr = String(this.data.pwd || "8888").trim();
        let hash = 0;
        for (let i = 0; i < pwdStr.length; i++) {
          hash = ((hash << 5) - hash) + pwdStr.charCodeAt(i);
          hash |= 0;
        }
        return `magic_academy/raycro_${Math.abs(hash)}_room`;
      },

      migrateAndLoadStorage() {
        const currentRaw = localStorage.getItem('magic_v341');
        if (currentRaw) {
          try {
            const p = JSON.parse(currentRaw);
            if (p && p.classes && p.classes.length > 0) {
              this.data = p;
              this.curClass = this.data.classes[0];
              this.normalizeNotesStructure();
              return;
            }
          } catch(e) {}
        }

        const legacyKeys = ['magic_v340', 'magic_v330', 'magic_v320', 'magic_v310', 'magic_v300', 'magic_v290'];
        for (let i = 0; i < legacyKeys.length; i++) {
          const raw = localStorage.getItem(legacyKeys[i]);
          if (raw) {
            try {
              const legacy = JSON.parse(raw);
              if (legacy && (legacy.notes || legacy.students)) {
                this.data.classes = legacy.classes || [];
                this.data.students = legacy.students || [];
                this.data.notes = legacy.notes || [];
                this.data.curWeek = legacy.curWeek || legacy.currentWeekKey || "第1週";
                this.data.weeks = legacy.weeks || legacy.allWeekKeys || ["第1週"];
                this.data.pwd = legacy.pwd || legacy.adminPassword || "8888";
                this.data.buf = legacy.buf || {};
                if (legacy.classes && legacy.classes.length > 0) this.curClass = legacy.classes[0];
                this.normalizeNotesStructure();
                this.saveStorage();
                return;
              }
            } catch(e) {}
          }
        }
      },

      normalizeNotesStructure() {
        if (!this.data.notes) this.data.notes = [];
        this.data.notes.forEach(n => {
          if (!n.weekKey) {
            const m = (n.dateTitle || '').match(/第\s*\d+\s*週/);
            n.weekKey = m ? m[0].replace(/\s+/g, '') : "第1週";
          }
        });
      },
      saveStorage() { localStorage.setItem('magic_v341', JSON.stringify(this.data)); },

      auth() {
        const p = document.getElementById('pwdIpt').value.trim();
        if (p === (this.data.pwd || '8888')) {
          sessionStorage.setItem('magic_auth', 'true');
          this.authSuccess();
        } else {
          alert('導師印記不符！');
        }
      },
      authSuccess() {
        document.getElementById('gateForm').style.display = 'none';
        document.getElementById('gateLinks').style.display = 'flex';
      },
      enter(view) {
        SoundFx.init();
        const gate = document.getElementById('view-gate');
        gate.classList.add('open');
        setTimeout(() => {
          gate.style.display = 'none';
          document.getElementById('header').classList.add('auth');
          this.switchView(view);
        }, 600);
      },
      logout() {
        sessionStorage.removeItem('magic_auth');
        location.reload();
      },

      openPwdModal() {
        document.getElementById('curPwdDisplay').innerText = this.data.pwd || '8888';
        document.getElementById('newPwdIpt').value = '';
        document.getElementById('pwdModal').style.display = 'flex';
      },
      closePwdModal() {
        document.getElementById('pwdModal').style.display = 'none';
      },
      async saveAdminPwd() {
        const val = document.getElementById('newPwdIpt').value.trim();
        if (!val || val.length < 4 || val.length > 8) {
          return alert('印記長度必須為 4～8 位英數字！');
        }
        if (!/^[a-zA-Z0-9]+$/.test(val)) {
          return alert('印記只允許英文字母與數字組合！');
        }

        const oldTopic = this.getIsolatedTopic();
        this.data.pwd = val;
        this.saveStorage();
        this.closePwdModal();

        if (this.mqttClient && this.mqttConnected) {
          try {
            this.mqttClient.unsubscribe(oldTopic);
            const newTopic = this.getIsolatedTopic();
            this.mqttClient.subscribe(newTopic);
          } catch(e) {}
        }

        alert(`🔑 導師印記已更新為：${val}\n專屬廣播頻道已自動完成重新加密隔離！`);

        fetch(GAS_API_URL, {
          method: 'POST', mode: 'cors', headers: {'Content-Type': 'text/plain'},
          body: JSON.stringify({ action: 'update_admin_password', password: val })
        });
      },

      switchView(v) {
        if (this.noteDirty && v !== 'workspace') this.saveNote(true);
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.btn-nav').forEach(b => b.classList.remove('active'));
        
        const targetNav = document.getElementById(`nav-${v}`);
        if (targetNav) targetNav.classList.add('active');

        const el = document.getElementById('view-' + v);
        if (el) el.classList.add('active');
        
        if (v === 'workspace') { this.renderCards(); this.renderTabs(); this.initNotes(); }
        if (v === 'leaderboard') {
          this.loadLeaderboard();
          const stage = document.getElementById('lbScrollStage');
          if (stage) stage.scrollTop = 0;
        }
        if (v === 'roster') { this.loadRosterText(); }
      },

      togglePhone(m) {
        document.getElementById('colScore').style.display = (m === 'score') ? 'flex' : 'none';
        document.getElementById('colNotes').classList.toggle('phone-on', m === 'notes');
        document.getElementById('btnPScore').classList.toggle('active', m === 'score');
        document.getElementById('btnPNotes').classList.toggle('active', m === 'notes');
        if (m === 'notes') this.scrollBookmark();
      },

      renderTabs() {
        ['wsTabs', 'rosterTabs'].forEach(tid => {
          const bar = document.getElementById(tid);
          if (!bar) return;
          bar.innerHTML = "";
          this.data.classes.forEach(c => {
            const hasBuf = Object.keys(this.data.buf).some(k => k.startsWith(`${c}_`) && this.data.buf[k] !== 0);
            const b = document.createElement('button');
            b.className = `tab-pill ${c === this.curClass ? 'active' : ''}`;
            b.innerText = `${c} 班${hasBuf ? ' •' : ''}`;
            b.onclick = () => {
              if (this.noteDirty) this.saveNote(true);
              this.curClass = c;
              this.renderTabs();
              this.renderCards();
              this.initNotes();
              this.loadRosterText();
            };
            bar.appendChild(b);
          });
          const add = document.createElement('button');
          add.className = 'tab-pill';
          add.innerText = '➕ 新增';
          add.onclick = () => this.addClass();
          bar.appendChild(add);
        });
      },

      renderCards() {
        const g = document.getElementById('stGrid');
        if (!g) return;
        g.innerHTML = "";
        const list = this.data.students.filter(s => s.classId === this.curClass).sort((a,b) => a.seatNo - b.seatNo);
        const w = this.data.curWeek || "第1週";
        list.forEach(s => {
          const k = `${s.classId}_${w}_${s.seatNo}`;
          const delta = this.data.buf[k] || 0;
          const total = (s.totalScore || 0) + delta;
          const c = document.createElement('div');
          c.className = 'card';
          c.id = `card_${s.seatNo}`;
          c.innerHTML = `
            <span class="card-seat">#${s.seatNo}</span>
            ${(s.weeklyBonus > 0) ? `<span class="card-star">⭐+${s.weeklyBonus}</span>` : ''}
            <div class="card-name">${s.name}</div>
            <div class="card-score" id="cScore_${s.seatNo}">${delta >= 0 ? `+${delta}` : delta}</div>
            <div style="font-size:0.72rem; color:#9cb5ab;" id="cTotal_${s.seatNo}">總分: ${total}</div>
          `;
          let t;
          c.onmousedown = c.ontouchstart = () => {
            this.longFired = false;
            t = setTimeout(() => { this.longFired = true; this.setBonus(s); }, 1100);
          };
          c.onmouseup = c.ontouchend = () => clearTimeout(t);
          c.onclick = () => {
            if (this.longFired) return;
            const newDelta = (this.data.buf[k] || 0) + this.weight;
            this.data.buf[k] = newDelta;
            this.saveStorage();
            const scEl = document.getElementById(`cScore_${s.seatNo}`);
            const totEl = document.getElementById(`cTotal_${s.seatNo}`);
            if (scEl) scEl.innerText = newDelta >= 0 ? `+${newDelta}` : newDelta;
            if (totEl) totEl.innerText = `總分: ${(s.totalScore || 0) + newDelta}`;
            this.updateSettleUI();
          };
          g.appendChild(c);
        });
        this.updateSettleUI();
      },

      setWeight(w) {
        this.weight = w;
        document.querySelectorAll('.chip').forEach(c => {
          const targetText = w > 0 ? `+${w}` : `${w}`;
          c.classList.toggle('active', c.innerText.trim() === targetText);
        });
      },

      setBonus(s) {
        const val = prompt(`【設定幹部每週固定加分】\n#${s.seatNo} ${s.name}\n輸入每週加分點數：`, s.weeklyBonus || 0);
        if (val === null) return;
        const b = Math.max(0, parseInt(val, 10) || 0);
        s.weeklyBonus = b;
        this.saveStorage();
        this.renderCards();
        fetch(GAS_API_URL, {
          method: 'POST', mode: 'cors', headers: {'Content-Type': 'text/plain'},
          body: JSON.stringify({ action: 'update_student_bonus', classId: this.curClass, seatNo: s.seatNo, weeklyBonus: b })
        });
      },

      promptEditWeek() {
        const cur = this.data.curWeek || "第1週";
        const w = prompt(`【切換或輸入自訂教學週次】\n目前為：${cur}\n現有週次：${(this.data.weeks||[]).join(', ')}\n請輸入欲操作的週次：`, cur);
        if (!w || !w.trim()) return;
        const clean = w.trim().replace('周', '週');
        if (!this.data.weeks.includes(clean)) this.data.weeks.push(clean);
        this.data.curWeek = clean;
        this.saveStorage();
        this.renderCards();
        this.initLbWeeks();
        this.initNotes();
        fetch(GAS_API_URL, {
          method: 'POST', mode: 'cors', headers: {'Content-Type': 'text/plain'},
          body: JSON.stringify({ action: 'save_current_week', weekKey: clean })
        });
      },

      updateSettleUI() {
        const b = document.getElementById('btnSettle');
        const tag = document.getElementById('bannerWeek');
        const w = this.data.curWeek || "第1週";
        if (tag) tag.innerText = `【${w}】 ✏️`;
        const hasDirty = Object.keys(this.data.buf).some(k => k.startsWith(`${this.curClass}_${w}_`) && this.data.buf[k] !== 0);
        if (b) {
          b.innerText = `☁️ 結算${w}${hasDirty ? '*' : ''}`;
          b.classList.toggle('dirty', hasDirty);
        }
      },

      async settleScores() {
        const w = this.data.curWeek || "第1週";
        const modified = [];
        const prefix = `${this.curClass}_${w}_`;
        this.data.students.filter(s => s.classId === this.curClass).forEach(s => {
          const delta = this.data.buf[`${prefix}${s.seatNo}`] || 0;
          if (delta !== 0) modified.push({ seatNo: s.seatNo, name: s.name, deltaScore: delta });
        });
        if (modified.length === 0) return alert(`【${this.curClass} 班】在【${w}】無未結算分數！`);

        const b = document.getElementById('btnSettle');
        b.innerText = "⏳ 結算中...";
        try {
          const res = await fetch(GAS_API_URL, {
            method: 'POST', mode: 'cors', headers: {'Content-Type': 'text/plain'},
            body: JSON.stringify({ action: 'settle_incremental_scores', classId: this.curClass, incrementalList: modified, weekKey: w })
          });
          const json = await res.json();
          if (json.status === 'success') {
            modified.forEach(m => { this.data.buf[`${prefix}${m.seatNo}`] = 0; });
            (json.updatedStudents || []).forEach(u => {
              const st = this.data.students.find(s => s.classId === this.curClass && s.seatNo === u.seatNo);
              if (st) {
                if (!st.weekScores) st.weekScores = {};
                st.weekScores[w] = u.weeklyScore;
                if (u.totalScore !== undefined) st.totalScore = u.totalScore;
              }
            });
            this.saveStorage();
            this.renderCards();
            b.innerText = `✔ ${w}已結算`;
            setTimeout(() => this.updateSettleUI(), 2500);
          } else { alert(json.message || '結算失敗'); }
        } catch(e) {
          alert('網路逾時，分數已安全保留於本機！');
          this.updateSettleUI();
        }
      },

      /*
      ======================================================================
      備課筆記模組
      ======================================================================
      */
      initNotes() {
        const sel = document.getElementById('selNoteUnit');
        if (!sel || !this.curClass) return;
        sel.innerHTML = "";

        let classNotes = this.data.notes.filter(n => n.classId === this.curClass);
        if (classNotes.length === 0) {
          const def = {
            classId: this.curClass,
            noteId: `${this.curClass}_w1`,
            weekKey: "第1週",
            dateTitle: "第1週",
            content: '<div><b>📌 本週重點：</b></div><ul><li>課程任務 1：</li></ul>'
          };
          this.data.notes.unshift(def);
          this.saveStorage();
          classNotes.push(def);
        }

        classNotes.sort((a, b) => {
          const nA = parseInt((a.weekKey || '').replace(/\D/g, ''), 10) || 0;
          const nB = parseInt((b.weekKey || '').replace(/\D/g, ''), 10) || 0;
          return nB - nA;
        });

        classNotes.forEach(n => {
          const opt = document.createElement('option');
          opt.value = n.noteId;
          opt.innerText = `【${n.weekKey}】`;
          sel.appendChild(opt);
        });

        if (!this.activeNoteId || !classNotes.some(n => n.noteId === this.activeNoteId)) {
          this.activeNoteId = classNotes[0].noteId;
        }
        sel.value = this.activeNoteId;
        this.renderNoteContent();
      },

      onNoteUnitChange() {
        if (this.noteDirty) this.saveNote(true);
        this.activeNoteId = document.getElementById('selNoteUnit').value;
        this.renderNoteContent();
      },

      renderNoteContent() {
        const n = this.data.notes.find(x => x.noteId === this.activeNoteId);
        const editor = document.getElementById('noteEditor');
        if (n && editor) {
          editor.innerHTML = n.content || '';
          this.noteDirty = false;
          setTimeout(() => this.scrollBookmark(), 200);
        }
      },

      toggleNoteMode() {
        this.isNoteEdit = !this.isNoteEdit;
        const btn = document.getElementById('btnEditNote');
        const tools = document.getElementById('noteTools');
        const editor = document.getElementById('noteEditor');
        if (this.isNoteEdit) {
          btn.innerText = "✏️ 編輯中";
          btn.style.background = "#d35400";
          tools.classList.add('on');
          editor.contentEditable = "true";
        } else {
          if (this.noteDirty) this.saveNote(true);
          btn.innerText = "📖 閱讀中";
          btn.style.background = "#27ae60";
          tools.classList.remove('on');
          editor.contentEditable = "false";
          this.scrollBookmark();
        }
      },

      applyFontSize(px) {
        document.execCommand('fontSize', false, '7');
        const fonts = document.getElementById('noteEditor').getElementsByTagName('font');
        for (let i = 0; i < fonts.length; i++) {
          if (fonts[i].size === '7') {
            fonts[i].removeAttribute('size');
            fonts[i].style.fontSize = px;
          }
        }
        this.triggerNoteAutoSave();
      },

      addBookmark() {
        const s = window.getSelection();
        if (!s || !s.rangeCount) return alert('請先在筆記中選取文字或游標位置！');
        
        const old = document.getElementById('noteEditor').querySelectorAll('.marker');
        old.forEach(el => {
          const badge = el.querySelector('.marker-badge'); if (badge) badge.remove();
          const p = el.parentNode; while (el.firstChild) p.insertBefore(el.firstChild, el); el.remove();
        });

        const r = s.getRangeAt(0);
        const sp = document.createElement('span');
        sp.className = 'marker';
        sp.innerHTML = `<span class="marker-badge">📍 進度</span>`;
        if (!r.collapsed) sp.appendChild(r.extractContents());
        r.insertNode(sp);
        s.removeAllRanges();
        this.triggerNoteAutoSave();
      },

      scrollBookmark() {
        const m = document.getElementById('noteEditor').querySelector('.marker');
        if (m) m.scrollIntoView({ behavior: 'smooth', block: 'center' });
      },

      addNoteUnit() {
        const curW = this.data.curWeek || "第1週";
        const wName = prompt('請輸入要建立的週次名稱 (例: 第2週)：', curW);
        if (!wName || !wName.trim()) return;
        const cleanW = wName.trim().replace('周', '週');

        const existing = this.data.notes.find(n => n.classId === this.curClass && n.weekKey === cleanW);
        if (existing) {
          alert(`【${this.curClass} 班】已有【${cleanW}】筆記，已自動切換至該週！`);
          this.activeNoteId = existing.noteId;
          this.initNotes();
          return;
        }

        const newNote = {
          classId: this.curClass,
          noteId: `${this.curClass}_w_${Date.now()}`,
          weekKey: cleanW,
          dateTitle: cleanW,
          content: `<div><b>📌 【${cleanW}】重點：</b></div><ul><li>任務 1：</li></ul>`
        };
        this.data.notes.unshift(newNote);
        this.saveStorage();
        this.activeNoteId = newNote.noteId;
        this.initNotes();
        this.saveNote(true);
      },

      delNoteUnit() {
        const list = this.data.notes.filter(n => n.classId === this.curClass);
        if (list.length <= 1) return alert('本班至少需保留一週筆記，無法刪除！');
        const n = this.data.notes.find(x => x.noteId === this.activeNoteId);
        if (!confirm(`確定要刪除【${n.weekKey}】筆記？`)) return;

        const delId = this.activeNoteId;
        this.data.notes = this.data.notes.filter(n => n.noteId !== delId);
        this.saveStorage();
        this.activeNoteId = null;
        this.initNotes();
        fetch(GAS_API_URL, {
          method: 'POST', mode: 'cors', headers: {'Content-Type': 'text/plain'},
          body: JSON.stringify({ action: 'archive_note', data: { noteId: delId } })
        });
      },

      triggerNoteAutoSave() {
        this.noteDirty = true;
        clearTimeout(this.noteTimer);
        this.noteTimer = setTimeout(() => { this.saveNote(true); }, 2500);
      },

      initNotePaste() {
        const ed = document.getElementById('noteEditor');
        if (!ed) return;
        ed.addEventListener('paste', (e) => {
          if (!this.isNoteEdit) return;
          e.preventDefault();
          const text = (e.clipboardData || window.clipboardData).getData('text/plain');
          if (!text) return;
          const clean = text.split(/\r?\n/).map(l => l.trim() ? `<div>${l.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>` : `<div><br></div>`).join('');
          document.execCommand('insertHTML', false, clean);
          this.triggerNoteAutoSave();
        });
        ed.addEventListener('input', () => this.triggerNoteAutoSave());
      },

      async saveNote(silent = false) {
        clearTimeout(this.noteTimer);
        const ed = document.getElementById('noteEditor');
        const n = this.data.notes.find(x => x.noteId === this.activeNoteId);
        if (!n || !ed) return;

        n.content = ed.innerHTML;
        this.noteDirty = false;
        this.saveStorage();

        const tag = document.getElementById('noteSaveTag');
        if (silent && tag) {
          tag.style.display = 'inline';
          setTimeout(() => { tag.style.display = 'none'; }, 2000);
        } else if (!silent) {
          alert('💾 筆記已成功儲存！');
        }

        fetch(GAS_API_URL, {
          method: 'POST', mode: 'cors', headers: {'Content-Type': 'text/plain'},
          body: JSON.stringify({ action: 'save_notes', data: n })
        });
      },

      openCopyModal() {
        const curN = this.data.notes.find(x => x.noteId === this.activeNoteId);
        if (!curN) return;
        document.getElementById('copyTitleIpt').value = curN.weekKey;
        const box = document.getElementById('copyClassBoxes');
        box.innerHTML = "";
        const others = this.data.classes.filter(c => c !== this.curClass);
        if (others.length === 0) return alert('目前僅有單一班級，無需複製至他班！');
        others.forEach(c => {
          const l = document.createElement('label');
          l.style.fontSize = '0.82rem';
          l.innerHTML = `<input type="checkbox" name="cpClass" value="${c}" checked> 【${c}班】`;
          box.appendChild(l);
        });
        document.getElementById('copyModal').style.display = 'flex';
      },
      closeCopyModal() { document.getElementById('copyModal').style.display = 'none'; },
      toggleCopyAll() {
        const cbs = document.querySelectorAll('input[name="cpClass"]');
        const all = Array.from(cbs).every(c => c.checked);
        cbs.forEach(c => c.checked = !all);
      },
      execCopy() {
        const targetW = document.getElementById('copyTitleIpt').value.trim();
        if (!targetW) return alert('週次名稱不可為空！');
        const targets = Array.from(document.querySelectorAll('input[name="cpClass"]:checked')).map(c => c.value);
        if (targets.length === 0) return alert('請至少勾選一個目標班級！');

        const temp = document.createElement('div');
        temp.innerHTML = document.getElementById('noteEditor').innerHTML;
        temp.querySelectorAll('.marker').forEach(m => {
          const b = m.querySelector('.marker-badge'); if (b) b.remove();
          const p = m.parentNode; while(m.firstChild) p.insertBefore(m.firstChild, m); m.remove();
        });
        const cleanContent = temp.innerHTML;

        const toSend = [];
        targets.forEach(cid => {
          const newN = { classId: cid, noteId: `${cid}_w_${Date.now()}_${Math.random().toString(36).substring(2,6)}`, weekKey: targetW, dateTitle: targetW, content: cleanContent };
          this.data.notes.unshift(newN);
          toSend.push(newN);
        });
        this.saveStorage();
        this.closeCopyModal();
        alert(`✨ 成功派發至 ${targets.length} 個班級！`);

        fetch(GAS_API_URL, {
          method: 'POST', mode: 'cors', headers: {'Content-Type': 'text/plain'},
          body: JSON.stringify({ action: 'batch_save_notes', notesList: toSend })
        });
      },

      /*
      ======================================================================
      榮譽榜單模組 (🌟 徹底修復：生成時強制賦予 anim-hide，杜絕穿幫)
      ======================================================================
      */
      initLbWeeks() {
        const sel = document.getElementById('selLbWeek');
        if (!sel) return;
        sel.innerHTML = "";
        const all = (this.data.weeks && this.data.weeks.length > 0) ? this.data.weeks : ["第1週"];
        const curIdx = all.indexOf(this.data.curWeek || "第1週");
        let def = this.data.curWeek || "第1週";
        if (curIdx > 0) def = all[curIdx - 1];
        else if (all.length > 1) def = all[0];
        this.lbWeek = def;

        all.forEach(w => {
          const opt = document.createElement('option');
          opt.value = w;
          opt.innerText = (w === this.data.curWeek) ? `${w} (進行中)` : `${w} (結算榜)`;
          sel.appendChild(opt);
        });
        sel.value = this.lbWeek;
      },
      onLbWeekChange() { this.lbWeek = document.getElementById('selLbWeek').value; this.loadLeaderboard(); },
      onLbClassChange() { this.curClass = document.getElementById('selLbClass').value; this.loadLeaderboard(); },
      toggleRankType() {
        this.rankType = (this.rankType === 'weekly') ? 'total' : 'weekly';
        document.getElementById('btnToggleRank').innerText = `【${this.rankType === 'weekly' ? '週排行榜' : '總排行榜'}】`;
        document.getElementById('selLbWeek').style.display = (this.rankType === 'weekly') ? 'inline-block' : 'none';
        this.loadLeaderboard();
      },

      // 🌟 加載榜單資料：生成卡片時強制預設隱藏 anim-hide，待動畫喚醒
      loadLeaderboard() {
        const selC = document.getElementById('selLbClass');
        if (selC) {
          selC.innerHTML = "";
          this.data.classes.forEach(c => {
            const o = document.createElement('option'); o.value = c; o.innerText = `${c} 班`; selC.appendChild(o);
          });
          selC.value = this.curClass;
        }

        const isW = (this.rankType === 'weekly');
        const targetW = this.lbWeek || this.data.curWeek || "第1週";

        // 更新按鈕與週次選擇器狀態
        const btnRank = document.getElementById('btnToggleRank');
        if (btnRank) btnRank.innerText = `【${isW ? '週排行榜' : '總排行榜'}】`;
        const selW = document.getElementById('selLbWeek');
        if (selW) selW.style.display = isW ? 'inline-block' : 'none';

        const list = this.data.students.filter(s => s.classId === this.curClass).map(s => {
          let sc = 0;
          if (isW) {
            const base = (s.weekScores && s.weekScores[targetW] !== undefined) ? Number(s.weekScores[targetW]) : 0;
            const delta = (targetW === this.data.curWeek) ? (Number(this.data.buf[`${s.classId}_${targetW}_${s.seatNo}`]) || 0) : 0;
            sc = base + (Number(s.weeklyBonus) || 0) + delta;
          } else {
            const delta = Number(this.data.buf[`${s.classId}_${this.data.curWeek}_${s.seatNo}`]) || 0;
            sc = (Number(s.totalScore) || 0) + delta;
          }
          return { ...s, sc: Math.floor(isNaN(sc) ? 0 : sc) };
        }).sort((a,b) => b.sc - a.sc || a.seatNo - b.seatNo);

        const tiers = Array.from(new Set(list.map(s => s.sc))).sort((a,b) => b - a);
        const t1 = tiers[0] !== undefined ? list.filter(s => s.sc === tiers[0]) : [];
        const t2 = tiers[1] !== undefined ? list.filter(s => s.sc === tiers[1]) : [];
        const t3 = tiers[2] !== undefined ? list.filter(s => s.sc === tiers[2]) : [];

        document.getElementById('pn1').innerText = t1.map(s => s.name).join('、') || '無';
        document.getElementById('ps1').innerText = t1.length ? `${tiers[0]} 分` : '-- 分';
        document.getElementById('pn2').innerText = t2.map(s => s.name).join('、') || '無';
        document.getElementById('ps2').innerText = t2.length ? `${tiers[1]} 分` : '-- 分';
        document.getElementById('pn3').innerText = t3.map(s => s.name).join('、') || '無';
        document.getElementById('ps3').innerText = t3.length ? `${tiers[2]} 分` : '-- 分';

        const hall = document.getElementById('tierHall');
        if (hall) {
          hall.innerHTML = "";
          if (!isW) {
            hall.classList.add('active-hall');
            for (let idx = 3; idx < 10; idx++) {
              if (tiers[idx] !== undefined) {
                const subStudents = list.filter(s => s.sc === tiers[idx]);
                const item = document.createElement('div');
                // 🔒 核心關鍵：生成初始直接賦予 anim-hide，絕不提前裸露在畫面上！
                item.className = 'tier-item anim-hide';
                item.id = `tier_item_${idx + 1}`;
                item.innerHTML = `
                  <div class="tier-rank">第 ${idx + 1} 名</div>
                  <div class="tier-names">${subStudents.map(s => `#${s.seatNo}${s.name}`).join('、 ')}</div>
                  <div class="tier-score">${tiers[idx]} 分</div>
                `;
                hall.appendChild(item);
              }
            }
          } else {
            hall.classList.remove('active-hall');
          }
        }

        const rg = document.getElementById('rosterGrid');
        rg.innerHTML = "";
        list.slice().sort((a,b) => a.seatNo - b.seatNo).forEach(s => {
          const rank = list.findIndex(x => x.sc === s.sc) + 1;
          const d = document.createElement('div');
          d.className = 'roster-card';
          d.innerHTML = `<div style="display:flex; justify-content:space-between;"><b>#${s.seatNo} ${s.name}</b><span>第${rank}名</span></div><div style="color:var(--gold-l); font-weight:bold;">${s.sc} 分</div>`;
          rg.appendChild(d);
        });

        const stEl = document.getElementById('sheetTitle');
        if (stEl) {
          stEl.innerText = isW ? `【${targetW}】全班學員成績名冊 (週得分+幹部加分)` : `全班學員總成績名冊 (總分累積)`;
        }
      },

      /*
      ======================================================================
      🌟 滿血揭榜動畫 (方案 A 倒序動畫引擎・嚴格重繪刷新 Flush 守門)
      ======================================================================
      */
      startRevealTheater() {
        SoundFx.init();
        const p1 = document.getElementById('pCol1');
        const p2 = document.getElementById('pCol2');
        const p3 = document.getElementById('pCol3');
        const sheet = document.getElementById('rosterSheet');
        const hall = document.getElementById('tierHall');
        const stage = document.getElementById('lbScrollStage');
        const isTotal = (this.rankType === 'total');

        if (stage) stage.scrollTo({ top: 0, behavior: 'smooth' });

        // 重置前三名與全班名冊
        [p1, p2, p3].forEach(p => { p.classList.remove('reveal'); p.classList.add('anim-hide'); });
        sheet.classList.remove('active-show');
        sheet.classList.add('anim-hide');

        // 取得並重置第 4～10 名梯隊卡片
        const tierItems = Array.from(document.querySelectorAll('.tier-item'));
        tierItems.forEach(t => {
          t.classList.remove('reveal');
          t.classList.add('anim-hide');
        });

        // 🌟 強制觸發重繪 (Reflow Flush)，確保瀏覽器完成幾何層更新
        if (hall) void hall.offsetHeight;

        let currentDelay = 350;

        // 🌟 總排行榜：依序由最後一個梯隊（例如第10名）倒序滑入至第4名
        if (isTotal && tierItems.length > 0) {
          const reversedTiers = tierItems.slice().reverse();
          reversedTiers.forEach((item, i) => {
            setTimeout(() => {
              SoundFx.playStepNote(380 + (i * 38));
              item.classList.remove('anim-hide');
              item.classList.add('reveal');
            }, currentDelay);
            currentDelay += 240; // 每 0.24 秒穩健揭曉一位
          });
          currentDelay += 450; // 蓄力停頓，迎來領獎台高潮
        }

        // 升起第 3 名 (伴隨低音戰鼓)
        setTimeout(() => {
          SoundFx.playDrum();
          p3.classList.remove('anim-hide');
          p3.classList.add('reveal');
        }, currentDelay);
        currentDelay += 1000;

        // 升起第 2 名 (伴隨低音戰鼓)
        setTimeout(() => {
          SoundFx.playDrum();
          p2.classList.remove('anim-hide');
          p2.classList.add('reveal');
        }, currentDelay);
        currentDelay += 1100;

        // 冠軍誕生：升起第 1 名、爆發勝利號角與金色彩帶粒子
        setTimeout(() => {
          SoundFx.playFanfare();
          p1.classList.remove('anim-hide');
          p1.classList.add('reveal');
          this.shootConfetti();

          // 終曲平滑導航捲動
          setTimeout(() => {
            sheet.classList.remove('anim-hide');
            sheet.classList.add('active-show');
          }, 1500);

          setTimeout(() => {
            if (stage && sheet) {
              sheet.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }, 1800);
        }, currentDelay);
      },

      /*
      ======================================================================
      通訊協議 (時間門閥防護 + 專屬加密頻道隔離 + 完整重繪時序)
      ======================================================================
      */
      initMqttBroker() {
        const brokerHost = "broker.hivemq.com";
        const brokerPort = 8884;
        const clientId = "magic_client_" + Math.random().toString(16).substr(2, 8);
        const topic = this.getIsolatedTopic();

        try {
          this.mqttClient = new Paho.MQTT.Client(brokerHost, brokerPort, clientId);
          this.mqttClient.onConnectionLost = (resp) => {
            this.mqttConnected = false;
            this.updateTvStatusUI(false);
            setTimeout(() => this.initMqttBroker(), 4000);
          };
          this.mqttClient.onMessageArrived = (message) => {
            try {
              const msg = JSON.parse(message.payloadString);
              if (msg && msg.appId === "magic_raycro_2026") {
                if (msg.action === 'REVEAL' && this.isTv && msg.triggerId > this.lastTriggerId) {
                  this.lastTriggerId = msg.triggerId;
                  this.curClass = msg.classId;
                  this.rankType = msg.period;
                  this.lbWeek = msg.weekKey;
                  // 🌟 確保先載入最新狀態與預設隱藏節點，再開門啟動動畫！
                  this.loadLeaderboard();
                  this.enter('leaderboard');
                  setTimeout(() => this.startRevealTheater(), 650);
                } else if (msg.action === 'CLOSE' && this.isTv && msg.triggerId > this.lastTriggerId) {
                  location.reload();
                }
              }
            } catch(e) {}
          };

          this.mqttClient.connect({
            useSSL: true,
            timeout: 5,
            onSuccess: () => {
              this.mqttConnected = true;
              this.updateTvStatusUI(true);
              this.mqttClient.subscribe(topic);
            },
            onFailure: () => {
              this.mqttConnected = false;
              this.updateTvStatusUI(false);
            }
          });
        } catch(e) {
          this.mqttConnected = false;
        }
      },

      updateTvStatusUI(on) {
        const b = document.getElementById('tvBadge');
        if (b) {
          b.className = `badge ${on ? 'on' : ''}`;
          b.innerText = on ? "🖥️ 在線 (專屬加密通道)" : "🖥️ 離線 (轉為輪詢)";
        }
      },

      startTvStandby() {
        SoundFx.init();
        this.isTv = true;
        this.lastTriggerId = Date.now(); // 🔒 嚴格時間門閥鎖定

        document.getElementById('btnStandby').innerText = "🟢 電腦大螢幕待命中 (專屬加密通道)";
        document.getElementById('btnStandby').disabled = true;
        this.updateTvStatusUI(this.mqttConnected);

        setInterval(async () => {
          if (!this.isTv) return;
          try {
            const res = await fetch(`${GAS_API_URL}?action=poll_remote_trigger&t=${Date.now()}`);
            const json = await res.json();
            if (json.status === 'success' && json.trigger && json.trigger.t > this.lastTriggerId) {
              this.lastTriggerId = json.trigger.t;
              if (json.trigger.action === 'REVEAL') {
                this.curClass = json.trigger.classId;
                this.rankType = json.trigger.period;
                this.lbWeek = json.trigger.weekKey;
                this.loadLeaderboard();
                this.enter('leaderboard');
                setTimeout(() => this.startRevealTheater(), 650);
              } else if (json.trigger.action === 'CLOSE') {
                location.reload();
              }
            }
          } catch(e) {}
        }, 3000);
      },

      broadcastReveal() {
        const triggerId = Date.now();
        const payload = {
          appId: "magic_raycro_2026",
          action: 'REVEAL',
          classId: this.curClass,
          period: this.rankType,
          weekKey: this.lbWeek,
          triggerId: triggerId
        };

        if (this.mqttClient && this.mqttConnected) {
          const msg = new Paho.MQTT.Message(JSON.stringify(payload));
          msg.destinationName = this.getIsolatedTopic();
          this.mqttClient.send(msg);
        }

        fetch(GAS_API_URL, {
          method: 'POST', mode: 'cors', headers: {'Content-Type': 'text/plain'},
          body: JSON.stringify({ action: 'set_remote_trigger', triggerData: { ...payload, t: triggerId } })
        });

        alert(`📢 已向大螢幕極速發送揭榜指令！【${this.curClass}班 / ${this.rankType === 'weekly' ? this.lbWeek : '總排行榜'}】`);
      },

      broadcastClose() {
        const triggerId = Date.now();
        const payload = { appId: "magic_raycro_2026", action: 'CLOSE', triggerId: triggerId };
        if (this.mqttClient && this.mqttConnected) {
          const msg = new Paho.MQTT.Message(JSON.stringify(payload));
          msg.destinationName = this.getIsolatedTopic();
          this.mqttClient.send(msg);
        }
        fetch(GAS_API_URL, {
          method: 'POST', mode: 'cors', headers: {'Content-Type': 'text/plain'},
          body: JSON.stringify({ action: 'set_remote_trigger', triggerData: { action: 'CLOSE', t: triggerId } })
        });
        alert('🚪 已命令電腦關門待命！');
      },

      /*
      ======================================================================
      名冊管理 (智慧平移保護歷史成績)
      ======================================================================
      */
      loadRosterText() {
        document.getElementById('rosterTitle').innerText = `【${this.curClass} 班】名冊管理`;
        const list = this.data.students.filter(s => s.classId === this.curClass).sort((a,b) => a.seatNo - b.seatNo);
        document.getElementById('rosterTxt').value = list.map(s => `${s.seatNo} ${s.name}`).join('\n');
      },
      saveRoster() {
        const lines = document.getElementById('rosterTxt').value.trim().split('\n');
        const parsed = [];
        lines.forEach(l => {
          const p = l.trim().split(/[\s\t,]+/);
          if (p.length >= 2) {
            const seat = parseInt(p[0], 10);
            const name = p[1];
            if (!isNaN(seat) && name) {
              const old = this.data.students.find(s => s.classId === this.curClass && s.seatNo === seat);
              parsed.push({
                classId: this.curClass,
                seatNo: seat,
                name: name,
                weeklyBonus: old ? (old.weeklyBonus || 0) : 0,
                baseScore: old ? (old.baseScore || 0) : 0,
                totalScore: old ? (old.totalScore || 0) : 0,
                weekScores: old ? (old.weekScores || {}) : {}
              });
            }
          }
        });
        if (parsed.length === 0) return alert('名冊解析失敗，請確認每行輸入「座號 姓名」！');
        
        this.data.students = this.data.students.filter(s => s.classId !== this.curClass).concat(parsed);
        this.saveStorage();
        this.renderCards();

        fetch(GAS_API_URL, {
          method: 'POST', mode: 'cors', headers: {'Content-Type': 'text/plain'},
          body: JSON.stringify({ action: 'update_roster', classId: this.curClass, students: parsed })
        });
        alert(`✨ ${this.curClass} 班名冊更新成功，歷史週次成績已完整受到保護！`);
      },
      addClass() {
        const c = prompt('請輸入新班級代號 (例: 502)：');
        if (!c || this.data.classes.includes(c.trim())) return;
        const cid = c.trim();
        this.data.classes.push(cid);
        this.curClass = cid;
        this.saveStorage();
        this.renderTabs();
        this.renderCards();
        fetch(GAS_API_URL, {
          method: 'POST', mode: 'cors', headers: {'Content-Type': 'text/plain'},
          body: JSON.stringify({ action: 'create_class', classId: cid })
        });
      },
      delClass() {
        if (!confirm(`確定刪除【${this.curClass} 班】？`)) return;
        const target = this.curClass;
        this.data.classes = this.data.classes.filter(c => c !== target);
        this.data.students = this.data.students.filter(s => s.classId !== target);
        this.curClass = this.data.classes[0] || "";
        this.saveStorage();
        this.renderTabs();
        this.renderCards();
        fetch(GAS_API_URL, {
          method: 'POST', mode: 'cors', headers: {'Content-Type': 'text/plain'},
          body: JSON.stringify({ action: 'delete_class', classId: target, permanent: false })
        });
      },

      /*
      ======================================================================
      極速雲端同步與防覆蓋鎖 (SWR 機制)
      ======================================================================
      */
      async fetchCloud() {
        const gem = document.getElementById('syncGem');
        if (gem) gem.className = 'gem pend';
        try {
          const res = await fetch(`${GAS_API_URL}?action=fetch_all&t=${Date.now()}`);
          const json = await res.json();
          if (json.status === 'success' && json.classes && json.classes.length > 0) {
            if (this.data.classes.length === 0) {
              this.data.classes = json.classes;
              this.curClass = this.data.classes[0];
            }
            if (json.allWeekKeys && json.allWeekKeys.length > 0) this.data.weeks = json.allWeekKeys;
            if (json.currentWeekKey && !this.data.curWeek) this.data.curWeek = json.currentWeekKey;
            
            if (json.password && json.password !== this.data.pwd) {
              this.data.pwd = json.password;
              if (this.mqttClient && this.mqttConnected) {
                try {
                  this.mqttClient.subscribe(this.getIsolatedTopic());
                } catch(e) {}
              }
            }

            if (!this.isNoteEdit && !this.noteDirty) {
              if (json.notes && json.notes.length > 0) {
                this.data.notes = json.notes;
                this.normalizeNotesStructure();
              }
            }

            const cloudSt = json.students || [];
            if (this.data.students.length === 0) {
              this.data.students = cloudSt;
            } else {
              cloudSt.forEach(cs => {
                const loc = this.data.students.find(s => s.classId === cs.classId && s.seatNo === cs.seatNo);
                if (loc) {
                  loc.name = cs.name;
                  loc.weeklyBonus = cs.weeklyBonus || 0;
                  loc.baseScore = cs.baseScore || 0;
                  loc.totalScore = cs.totalScore || 0;
                  loc.weekScores = cs.weekScores || {};
                } else {
                  this.data.students.push(cs);
                }
              });
            }

            this.saveStorage();
            this.renderTabs();
            this.renderCards();
            this.initLbWeeks();
            this.initNotes();
            if (gem) gem.className = 'gem';
          }
        } catch(e) {
          if (gem) gem.className = 'gem err';
        }
      },

      /*
      ======================================================================
      全螢幕金色彩帶粒子引擎 (Canvas Confetti)
      ======================================================================
      */
      initCanvasConfetti() {
        const cvs = document.getElementById('confettiCanvas');
        if (!cvs) return;
        cvs.width = window.innerWidth;
        cvs.height = window.innerHeight;
        window.addEventListener('resize', () => { cvs.width = window.innerWidth; cvs.height = window.innerHeight; });
      },
      shootConfetti() {
        const cvs = document.getElementById('confettiCanvas');
        if (!cvs) return;
        const ctx = cvs.getContext('2d');
        const sparks = [];
        const pal = ['#ffd700', '#f7e49a', '#ffffff', '#2ecc71', '#d4af37'];
        for (let i = 0; i < 110; i++) {
          sparks.push({
            x: cvs.width / 2, y: cvs.height * 0.45,
            vx: (Math.random() - 0.5) * 18, vy: (Math.random() - 0.8) * 16,
            size: Math.random() * 5 + 3, color: pal[Math.floor(Math.random() * pal.length)], life: 1
          });
        }
        function step() {
          ctx.clearRect(0, 0, cvs.width, cvs.height);
          let running = false;
          sparks.forEach(p => {
            p.x += p.vx; p.y += p.vy; p.vy += 0.28; p.life -= 0.012;
            if (p.life > 0) {
              running = true;
              ctx.save();
              ctx.globalAlpha = p.life;
              ctx.fillStyle = p.color;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            }
          });
          if (running) requestAnimationFrame(step);
        }
        step();
      }
    };

    window.addEventListener('DOMContentLoaded', () => App.init());
  </script>
