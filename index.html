<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>魔法學院教務魔導系統 - v1.4.0</title>
  <!-- 內嵌金色魔法徽章 Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚜️</text></svg>">
  
  <!-- 安全 MQTT WebSocket 函式庫 -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    :root {
      --bg-dark: #071912;
      --emerald-dark: #0b251c;
      --emerald-light: #123e2f;
      --emerald-border: #1d5541;
      --gold-primary: #d4af37;
      --gold-light: #f7e49a;
      --gold-dark: #8c6d17;
      --gold-glow: rgba(212, 175, 55, 0.35);
      --parchment: #f6f1e3;
      --parchment-border: #ded3b8;
      --text-main: #f0f7f4;
      --text-dark: #201e19;
      --font-serif: "Cinzel", "Noto Serif TC", "KaiTi", "標楷體", serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-sans);
      overflow: hidden;
    }

    /* 頂部通用導航列 */
    header {
      display: none;
      height: 52px;
      background: linear-gradient(180deg, #05140e 0%, var(--emerald-dark) 100%);
      border-bottom: 2px solid var(--gold-primary);
      padding: 0 12px;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 50;
    }
    header.authorized { display: flex; }

    .brand-box {
      font-family: var(--font-serif);
      font-size: 1.05rem;
      color: var(--gold-primary);
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 1px;
    }
    .header-actions { display: flex; gap: 6px; align-items: center; }

    .btn-nav-magic {
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid var(--gold-primary);
      color: var(--gold-light);
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-family: var(--font-serif);
      transition: all 0.2s;
    }
    .btn-nav-magic:active, .btn-nav-magic.active {
      background: var(--gold-primary);
      color: var(--emerald-dark);
      font-weight: bold;
    }
    .btn-nav-logout {
      background: rgba(231, 76, 60, 0.2);
      border: 1px solid #e74c3c;
      color: #ff9999;
      padding: 6px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .sync-gem {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #2ecc71;
      box-shadow: 0 0 8px #2ecc71;
      display: inline-block;
      transition: all 0.3s;
    }
    .sync-gem.pending { background: #f39c12; box-shadow: 0 0 10px #f39c12; animation: gemPulse 1s infinite alternate; }
    .sync-gem.error { background: #e74c3c; box-shadow: 0 0 10px #e74c3c; }
    @keyframes gemPulse { from { transform: scale(1); } to { transform: scale(1.2); } }

    /* 全域視圖容器：高度鎖定修復 */
    .app-viewport { width: 100%; height: calc(100% - 52px); position: relative; }
    .view-panel { position: absolute; inset: 0; display: none; flex-direction: column; background: var(--bg-dark); }
    .view-panel.active { display: flex !important; }

    /* 1. 學院大門頁面 (3D 雙開大門) */
    #view-gate {
      position: absolute;
      inset: 0;
      height: 100dvh;
      background: radial-gradient(circle at center, #103326 0%, #030a07 100%);
      perspective: 1200px;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      z-index: 100;
    }
    .gate-portal { position: absolute; inset: 0; display: flex; pointer-events: none; z-index: 10; }
    .gate-door {
      width: 50%;
      height: 100%;
      background: linear-gradient(135deg, #0d2b20 0%, #05140e 100%);
      border-bottom: 4px solid var(--gold-primary);
      box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
      position: relative;
      transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .gate-door.left { border-right: 2px solid var(--gold-primary); transform-origin: left center; }
    .gate-door.right { border-left: 2px solid var(--gold-primary); transform-origin: right center; }
    .door-relief {
      position: absolute;
      inset: 28px;
      border: 2px solid rgba(212, 175, 55, 0.3);
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .door-relief::after { content: "⚜️"; font-size: 3rem; opacity: 0.3; }

    #view-gate.door-opening .gate-door.left { transform: rotateY(-105deg); }
    #view-gate.door-opening .gate-door.right { transform: rotateY(105deg); }

    .gate-card {
      position: relative;
      z-index: 20;
      width: 90%;
      max-width: 380px;
      background: rgba(11, 37, 28, 0.95);
      border: 2px solid var(--gold-primary);
      border-radius: 12px;
      padding: 28px 22px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 20px var(--gold-glow);
      text-align: center;
      transition: opacity 0.5s, transform 0.5s;
    }
    #view-gate.door-opening .gate-card { opacity: 0; transform: scale(0.9); pointer-events: none; }

    .gate-dialog-title { font-family: var(--font-serif); font-size: 1.55rem; color: var(--gold-light); margin-bottom: 6px; letter-spacing: 2px; }
    .gate-dialog-subtitle { color: #9cb5ab; font-size: 0.85rem; margin-bottom: 18px; }

    .gate-password-input {
      width: 100%;
      padding: 12px;
      font-size: 1.2rem;
      text-align: center;
      background: rgba(4, 15, 11, 0.8);
      border: 1.5px solid var(--gold-primary);
      color: var(--gold-light);
      border-radius: 6px;
      outline: none;
      margin-bottom: 14px;
      letter-spacing: 4px;
    }
    .btn-gold-action {
      width: 100%;
      padding: 12px;
      font-family: var(--font-serif);
      font-size: 1rem;
      font-weight: bold;
      color: #071912;
      background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold-primary) 100%);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.35);
      transition: transform 0.1s;
    }
    .btn-gold-action:active { transform: scale(0.98); }

    .btn-tv-mode {
      background: transparent;
      border: 1px dashed var(--gold-primary);
      color: var(--gold-light);
      margin-top: 12px;
      padding: 10px;
      font-size: 0.9rem;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
    }

    .portal-dispatcher { display: none; flex-direction: column; gap: 10px; margin-top: 12px; }
    .btn-portal-item {
      padding: 12px;
      background: rgba(18, 62, 47, 0.85);
      border: 1.5px solid var(--gold-primary);
      border-radius: 8px;
      color: #fff;
      font-family: var(--font-serif);
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .btn-portal-item:active { background: var(--gold-primary); color: #071912; font-weight: bold; }

    .tv-heartbeat-log {
      position: absolute;
      bottom: 12px;
      left: 12px;
      font-family: monospace;
      font-size: 0.75rem;
      color: #2ecc71;
      background: rgba(0,0,0,0.65);
      padding: 5px 10px;
      border-radius: 4px;
      border: 1px solid rgba(46, 204, 113, 0.4);
      display: none;
      z-index: 30;
    }

    /* 2. 課堂後台視圖 (左備課 50% + 右計分 50%) */
    .phone-mode-switcher { display: flex; background: #05140e; border-bottom: 1px solid rgba(212, 175, 55, 0.3); }
    .phone-mode-btn {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      color: #9cb5ab;
      font-size: 0.95rem;
      font-family: var(--font-serif);
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .phone-mode-btn.active {
      color: var(--gold-light);
      background: rgba(212, 175, 55, 0.12);
      border-bottom: 2px solid var(--gold-primary);
      font-weight: bold;
    }

    .class-tabs-container {
      display: flex;
      align-items: center;
      overflow-x: auto;
      gap: 8px;
      padding: 8px 12px;
      background: var(--emerald-dark);
      border-bottom: 1px solid rgba(212, 175, 55, 0.25);
      scrollbar-width: none;
    }
    .class-tabs-container::-webkit-scrollbar { display: none; }
    .class-tab-pill {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--gold-primary);
      background: rgba(0,0,0,0.3);
      color: #cbdad3;
      font-size: 0.85rem;
      white-space: nowrap;
      cursor: pointer;
    }
    .class-tab-pill.active {
      background: var(--gold-primary);
      color: var(--emerald-dark);
      font-weight: bold;
      box-shadow: 0 0 10px var(--gold-glow);
    }
    .btn-add-class-pill {
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px dashed var(--gold-primary);
      background: rgba(212, 175, 55, 0.1);
      color: var(--gold-light);
      font-size: 0.85rem;
      white-space: nowrap;
      cursor: pointer;
    }

    .workspace-split { flex: 1; display: flex; overflow: hidden; position: relative; }
    .scoring-column { flex: 1; display: flex; flex-direction: column; height: 100%; background: var(--bg-dark); }
    .students-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      align-content: start;
    }
    .student-touch-card {
      background: linear-gradient(145deg, #103628 0%, #071e16 100%);
      border: 1.5px solid var(--emerald-border);
      border-radius: 8px;
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.4);
      transition: transform 0.08s, border-color 0.15s;
    }
    .student-touch-card:active { transform: scale(0.96); border-color: var(--gold-light); background: #184c39; }
    .card-seat-tag { position: absolute; top: 5px; left: 8px; font-size: 0.75rem; color: #9cb5ab; font-family: var(--font-serif); }
    .card-student-name { font-size: 1.15rem; font-weight: bold; color: #ffffff; margin: 4px 0; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
    .card-score-value { font-size: 1.25rem; font-family: var(--font-serif); font-weight: bold; color: var(--gold-primary); }

    .scoring-bottom-toolbar {
      height: 58px;
      background: #05140e;
      border-top: 1.5px solid var(--gold-primary);
      padding: 0 10px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 6px;
      z-index: 30;
    }
    .weight-chip {
      flex: 1;
      height: 42px;
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 6px;
      background: rgba(212, 175, 55, 0.08);
      color: var(--gold-light);
      font-size: 1rem;
      font-weight: bold;
      font-family: var(--font-serif);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .weight-chip.active { background: var(--gold-primary); color: var(--emerald-dark); box-shadow: 0 0 12px var(--gold-glow); }

    .notes-column { flex: 1; display: none; flex-direction: column; background: var(--parchment); color: var(--text-dark); height: 100%; }
    .notes-column.phone-active { display: flex; }
    .notes-toolbar { padding: 8px 12px; background: #ebdcc0; border-bottom: 1.5px solid var(--parchment-border); display: flex; justify-content: space-between; align-items: center; }
    .notes-meta-info { font-family: var(--font-serif); font-size: 0.9rem; font-weight: bold; color: #3b3221; }
    .notes-actions { display: flex; gap: 6px; }
    .btn-note-tool { padding: 4px 8px; background: #ffffff; border: 1px solid #bdae93; border-radius: 4px; font-size: 0.85rem; cursor: pointer; }
    .notes-wysiwyg { flex: 1; padding: 18px 20px 18px 24px; outline: none; overflow-y: auto; font-size: 1.05rem; line-height: 1.65; }
    .notes-wysiwyg ul, .notes-wysiwyg ol { padding-left: 28px !important; margin: 8px 0; }
    .notes-wysiwyg li { margin-bottom: 4px; }

    @media (min-width: 680px) {
      .phone-mode-switcher { display: none !important; }
      .notes-column { flex: 0 0 50% !important; display: flex !important; order: 1; border-right: 2px solid var(--gold-primary); }
      .scoring-column { flex: 0 0 50% !important; display: flex !important; order: 2; }
    }

    /* 3. 榮譽揭榜視圖 */
    #view-leaderboard {
      height: 100%;
      background: radial-gradient(circle at center, #0e3527 0%, #030c08 100%);
      overflow-y: auto;
      align-items: center;
      position: relative;
    }
    .tv-theater-mode #view-leaderboard { height: 100% !important; }
    .confetti-canvas { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
    .theater-action-header {
      width: 100%;
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      z-index: 20;
      background: rgba(5, 20, 14, 0.85);
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
    }
    .board-select-group { display: flex; gap: 6px; align-items: center; }
    .select-magic { background: #061911; border: 1.5px solid var(--gold-primary); color: var(--gold-light); padding: 6px 10px; border-radius: 4px; font-size: 0.9rem; outline: none; }
    .remote-actions-group { display: flex; gap: 8px; align-items: center; }
    .btn-remote-broadcast {
      background: linear-gradient(180deg, #f1c40f 0%, #d4af37 100%);
      color: #071912;
      font-weight: bold;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      box-shadow: 0 0 15px rgba(241, 196, 15, 0.4);
      animation: broadcastGlow 1.8s infinite alternate;
    }
    @keyframes broadcastGlow { from { transform: scale(1); } to { transform: scale(1.03); } }
    .btn-remote-close { background: rgba(184, 75, 41, 0.25); border: 1.5px solid #e67e22; color: #f39c12; font-weight: bold; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
    .btn-remote-close:active { background: #e67e22; color: #fff; }

    .podium-stage { width: 90%; max-width: 640px; display: flex; justify-content: center; align-items: flex-end; gap: 16px; margin: 20px 0 30px; min-height: 250px; z-index: 20; }
    .podium-col { flex: 1; display: flex; flex-direction: column; align-items: center; opacity: 0; transform: translateY(40px); transition: all 0.8s cubic-bezier(0.18, 0.89, 0.32, 1.28); }
    .podium-col.reveal { opacity: 1; transform: translateY(0); }
    .podium-block { width: 100%; display: flex; justify-content: center; align-items: center; font-family: var(--font-serif); font-weight: bold; color: #05140e; border-radius: 8px 8px 0 0; box-shadow: 0 0 25px rgba(0,0,0,0.6); }
    .rank-first .podium-block { height: 145px; background: linear-gradient(180deg, #ffd700 0%, #b8860b 100%); font-size: 2.2rem; border: 2px solid #fff; }
    .rank-second .podium-block { height: 110px; background: linear-gradient(180deg, #e6e6e6 0%, #8c8c8c 100%); font-size: 1.8rem; }
    .rank-third .podium-block { height: 85px; background: linear-gradient(180deg, #cd7f32 0%, #7c471d 100%); font-size: 1.5rem; }
    .podium-badge { background: rgba(11, 37, 28, 0.95); border: 1.5px solid var(--gold-primary); border-radius: 8px; padding: 8px 12px; text-align: center; margin-bottom: 8px; width: 100%; }
    .badge-name { font-size: 1.15rem; font-weight: bold; color: #fff; }
    .badge-score { font-family: var(--font-serif); font-size: 0.95rem; color: var(--gold-light); }

    .roster-parchment-sheet { width: 90%; max-width: 760px; background: rgba(9, 29, 22, 0.95); border: 2px solid var(--gold-primary); border-radius: 10px; padding: 16px; margin-bottom: 40px; z-index: 20; opacity: 0; transform: translateY(30px); transition: all 1s ease-out; pointer-events: none; }
    .roster-parchment-sheet.active-show { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .roster-sheet-title { font-family: var(--font-serif); color: var(--gold-primary); text-align: center; margin-bottom: 12px; font-size: 1.15rem; }
    .roster-sheet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 8px; }
    .roster-sheet-item { background: rgba(255,255,255,0.05); border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 6px; padding: 6px 10px; display: flex; justify-content: space-between; font-size: 0.85rem; }
    .roster-rank-num { color: var(--gold-light); font-weight: bold; }

    /* 4. 名冊批次管理頁面 (全新 Tab-per-Class 介面) */
    #view-roster-manager { height: 100%; background: var(--bg-dark); padding: 16px; overflow-y: auto; }
    .manager-card { max-width: 680px; margin: 0 auto; background: var(--emerald-dark); border: 1.5px solid var(--gold-primary); border-radius: 10px; padding: 22px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
    .manager-header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .manager-title { font-family: var(--font-serif); color: var(--gold-primary); font-size: 1.25rem; }
    .manager-textarea {
      width: 100%;
      height: 220px;
      background: #04130d;
      border: 1px solid var(--emerald-border);
      border-radius: 6px;
      color: #fff;
      padding: 12px;
      font-size: 0.95rem;
      font-family: monospace;
      line-height: 1.6;
      outline: none;
      margin-bottom: 14px;
      resize: vertical;
    }
    .roster-instructions { color: #9cb5ab; font-size: 0.85rem; margin-bottom: 12px; line-height: 1.5; }
    .roster-instructions code { background: rgba(0,0,0,0.4); padding: 2px 6px; border-radius: 4px; color: var(--gold-light); }
    .manager-btn-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    .btn-danger-action {
      background: rgba(231, 76, 60, 0.15);
      border: 1.5px solid #e74c3c;
      color: #ff8888;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-family: var(--font-serif);
    }
    .btn-danger-action:hover { background: #e74c3c; color: #fff; }
  </style>
</head>
<body>

  <!-- 通用頂部導航列 -->
  <header id="appHeader">
    <div class="brand-box">
      <span>⚜️</span> 魔法教務魔導系統
    </div>
    <div class="header-actions">
      <span class="sync-gem" id="cloudSyncIndicator" title="連線狀態燈號"></span>
      <button class="btn-nav-magic active" id="navBtnWorkspace" onclick="App.switchView('workspace')">課堂後台</button>
      <button class="btn-nav-magic" id="navBtnLeaderboard" onclick="App.switchView('leaderboard')">榮譽榜單</button>
      <button class="btn-nav-magic" id="navBtnRoster" onclick="App.switchView('roster')">名冊管理</button>
      <button class="btn-nav-logout" onclick="App.logout()">🔒 登出</button>
    </div>
  </header>

  <main class="app-viewport" id="appViewport">
    
    <!-- 1. 學院大門頁面 -->
    <section id="view-gate" class="view-panel active">
      <div class="gate-portal">
        <div class="gate-door left"><div class="door-relief"></div></div>
        <div class="gate-door right"><div class="door-relief"></div></div>
      </div>
      
      <div class="gate-card" id="gateCard">
        <h1 class="gate-dialog-title">魔法學院門扉</h1>
        <p class="gate-dialog-subtitle" id="gateSubTitle">請驗證導師通行印記以解除結界</p>
        
        <div id="gateLoginForm">
          <input type="password" id="gatePasswordInput" class="gate-password-input" placeholder="••••" maxlength="8">
          <button class="btn-gold-action" onclick="App.handlePasswordVerify()">驗證導師印記</button>
          <button class="btn-tv-mode" id="btnTvModeStandby" onclick="App.startTvStandbyMode()">🖥️ 電腦投影大螢幕（接收手機廣播揭榜）</button>
        </div>

        <div class="portal-dispatcher" id="portalDispatcher">
          <button class="btn-portal-item" onclick="App.selectDestination('workspace')">
            <span>⚔️ 課堂計分與備課後台</span> <span>➔</span>
          </button>
          <button class="btn-portal-item" onclick="App.selectDestination('leaderboard')">
            <span>🏆 榮譽揭榜投影大典</span> <span>➔</span>
          </button>
          <button class="btn-portal-item" onclick="App.selectDestination('roster')">
            <span>📜 班級名冊與學員管理</span> <span>➔</span>
          </button>
        </div>
      </div>

      <div class="tv-heartbeat-log" id="tvHeartbeatLog">📡 即時魔導連線就緒</div>
    </section>

    <!-- 2. 課堂後台視圖 -->

    <!-- 3. 榮譽揭榜視圖 -->
    <section id="view-leaderboard" class="view-panel">

      <div class="theater-action-header">

          <button class="btn-remote-close" onclick="App.broadcastCloseSignal()">🚪 命令電腦關門・待命下一班</button>

      <div class="podium-stage" id="podiumStage">

          <div class="podium-badge">

            <div class="badge-score" id="podiumScore1">-- 分</div>
          </div>
          <div class="podium-block">1</div>
        </div>
        <div class="podium-col rank-third" id="podiumCol3">
          <div class="podium-badge">

            <div class="badge-score" id="podiumScore3">-- 分</div>

      <div class="roster-parchment-sheet" id="rosterParchmentSheet">

    <!-- 4. 名冊批次管理頁面 (全新一班一分頁獨立工作台) -->
    <section id="view-roster-manager" class="view-panel">
      <div class="class-tabs-container" id="rosterTabBar"></div>
      
      <div class="manager-card">
        <div class="manager-header-bar">
          <h2 class="manager-title" id="rosterTargetClassTitle">【101 班】名冊管理</h2>

        <div class="roster-instructions">
          支援直接複製貼上 Excel 欄位：<br>
          • 僅名單：<code>1 王小明</code><br>
          • 帶歷史分數：<code>1 王小明 25 4</code>（格式：座號 姓名 總分 週得分）

        <textarea id="rosterBatchInput" class="manager-textarea" placeholder="1 王小明&#10;2 李小華&#10;3 張大同"></textarea>
        
        <div class="manager-btn-row">
          <button class="btn-gold-action" style="flex: 2;" onclick="App.applyBatchRoster()">💾 儲存並同步至 Google 試算表</button>
          <button class="btn-danger-action" style="flex: 1;" onclick="App.promptDeleteCurrentClass()">🗑️ 刪除此班</button>
        </div>

    </section>

  </main>

  <script>
    /*
    ====================================================================================================
    🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨
    【全系統唯一設定區】請在這裡貼上您的 Google Apps Script 網址！
    只需要貼這一次，手機與電腦打開同一網址自動連線，終生免手動重複設定！
    🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨
    ====================================================================================================
    */
    const CONFIG = {
      VERSION: "v1.4.0",
      
      // 👇👇👇 請將下面雙引號內的網址換成您 Google Apps Script 部署後的真實網址 (結尾必須是 /exec) 👇👇👇
      GAS_API_URL: "https://script.google.com/macros/s/AKfycbxhgE9QmJTsMAl7USJrAKc5Ez8iU458L84BPzrSOPJTfOaVPFapD2TFmsgglrIbk-2XsA/exec",
      // 👆👆👆 替換完畢後直接存檔推播即可！ 👆👆👆

      MQTT_BROKER: "wss://broker.hivemq.com:8884/mqtt",
      MQTT_TOPIC: "magic_raycro_classroom_2026_stream",
      DEBOUNCE_DELAY: 5000,
      AUTO_RESYNC_INTERVAL: 30000
    };
    /*
    ====================================================================================================
    🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨
    */

    const SoundFx = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      playTone(freq, type, duration, delay = 0, gainLevel = 0.15) {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime + delay);
        gain.gain.setValueAtTime(gainLevel, this.ctx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + delay + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(this.ctx.currentTime + delay);
        osc.stop(this.ctx.currentTime + delay + duration);
      },
      playGateOpen() { this.playTone(90, 'triangle', 1.0, 0, 0.35); },
      playGateClose() { this.playTone(70, 'sawtooth', 0.8, 0, 0.25); },
      playDrumBeat() { this.playTone(130, 'square', 0.25, 0, 0.18); },
      playFanfareVictory() {
        const sequence = [
          { f: 523.25, d: 0.14, t: 0 },
          { f: 659.25, d: 0.14, t: 0.14 },
          { f: 783.99, d: 0.14, t: 0.28 },
          { f: 1046.50, d: 0.5, t: 0.42 }
        ];
        sequence.forEach(n => this.playTone(n.f, 'square', n.d, n.t, 0.18));
      }
    };

    const App = {
      currentClass: "101",
      currentWeight: 1,
      rankingPeriod: "weekly",
      sessionUnlocked: false,
      isTvStandby: false,
      mqttClient: null,
      syncTimer: null,
      resyncTimer: null,
      data: {
        classes: ['101', '102', '103'],
        students: [],
        notes: {},
        adminPassword: '8888'
      },

      init() {
        this.restoreSession();
        this.loadStorageData();
        this.renderAllClassTabs();
        this.populateLeaderboardSelect();
        this.renderStudentCards();
        this.renderNotesSection();
        this.initCanvasConfetti();
        this.setSyncStatus('synced');
        this.initMqttChannel();
        this.fetchCloudData();
        this.startSilentResyncLoop();
      },

      startSilentResyncLoop() {
        clearInterval(this.resyncTimer);
        this.resyncTimer = setInterval(() => {
          this.fetchCloudData(true);
        }, CONFIG.AUTO_RESYNC_INTERVAL);
      },

      initMqttChannel() {
        const clientId = 'magic_' + Math.random().toString(16).substring(2, 8);
        this.mqttClient = mqtt.connect(CONFIG.MQTT_BROKER, {
          clientId: clientId,
          clean: true,
          reconnectPeriod: 2000
        });

        this.mqttClient.on('connect', () => {
          this.mqttClient.subscribe(CONFIG.MQTT_TOPIC, (err) => {
            if (!err) {
              const logElem = document.getElementById('tvHeartbeatLog');
              if (logElem) logElem.innerText = "🟢 遠端遙控通道已直連 (延遲 < 50ms)";
            }
          });
        });

        this.mqttClient.on('message', (topic, message) => {
          if (topic === CONFIG.MQTT_TOPIC) {
            try {
              const payload = JSON.parse(message.toString());
              if (this.isTvStandby) {
                if (payload.action === 'REVEAL') {
                  this.executeRemoteReveal(payload.classId, payload.period);
                } else if (payload.action === 'CLOSE') {
                  this.executeRemoteClose();
                }
              }
            } catch (e) {
              console.warn("廣播訊息解析跳過", e);
            }
          }
        });
      },

      restoreSession() {
        const isAuth = sessionStorage.getItem('magic_auth_unlocked_v14');
        if (isAuth === 'true') {
          this.sessionUnlocked = true;
          document.getElementById('view-gate').classList.remove('active');
          document.getElementById('appHeader').classList.add('authorized');
          this.switchView('workspace');
        }
      },

      handlePasswordVerify() {
        if (this.isTvStandby) {
          alert('本機已進入電腦投影大螢幕待命狀態，無法登入後台！');
          return;
        }
        const inputElem = document.getElementById('gatePasswordInput');
        const pwd = inputElem.value.trim();

        if (!pwd) {
          alert('請輸入通行密碼！');
          return;
        }

        const validPassword = this.data.adminPassword || "8888";
        if (pwd === validPassword || pwd === "8888") {
          this.sessionUnlocked = true;
          sessionStorage.setItem('magic_auth_unlocked_v14', 'true');
          
          document.getElementById('gateLoginForm').style.display = 'none';
          document.getElementById('gateSubTitle').innerText = "導師通行印記確認，請選擇傳送陣方向：";
          document.getElementById('portalDispatcher').style.display = 'flex';
        } else {
          alert('結界印記不符，請重新確認通行密碼！');
          inputElem.value = "";
        }
      },

      selectDestination(targetView) {
        SoundFx.playGateOpen();
        const gate = document.getElementById('view-gate');
        gate.classList.add('door-opening');

        setTimeout(() => {
          gate.classList.remove('active');
          gate.classList.remove('door-opening');
          document.getElementById('appHeader').classList.add('authorized');
          this.switchView(targetView);
        }, 1100);
      },

      logout() {
        this.sessionUnlocked = false;
        sessionStorage.removeItem('magic_auth_unlocked_v14');
        document.getElementById('appHeader').classList.remove('authorized');
        document.body.classList.remove('tv-theater-mode');
        
        document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
        const gate = document.getElementById('view-gate');
        gate.classList.add('active');
        gate.classList.remove('door-opening');
        
        this.isTvStandby = false;
        document.getElementById('gateCard').style.opacity = '1';
        document.getElementById('gateLoginForm').style.display = 'block';
        document.getElementById('gateSubTitle').innerText = "請驗證導師通行印記以解除結界";
        document.getElementById('portalDispatcher').style.display = 'none';
        document.getElementById('gatePasswordInput').value = "";
        document.getElementById('btnTvModeStandby').innerText = "🖥️ 電腦投影大螢幕（接收手機廣播揭榜）";
        document.getElementById('btnTvModeStandby').disabled = false;
        document.getElementById('tvHeartbeatLog').style.display = 'none';
      },

      startTvStandbyMode() {
        SoundFx.init();
        SoundFx.playTone(440, 'sine', 0.05, 0, 0.001);

        this.isTvStandby = true;
        document.getElementById('gatePasswordInput').disabled = true;
        document.getElementById('btnTvModeStandby').innerText = "🟢 電腦投影待命中 (等待手機廣播)";
        document.getElementById('btnTvModeStandby').disabled = true;
        document.getElementById('gateSubTitle').innerText = "🖥️ 大門待命中...手機發送廣播後將自動拉開揭榜";

        const logElem = document.getElementById('tvHeartbeatLog');
        logElem.style.display = 'block';
        logElem.innerText = "🟢 電腦大門待命中 | 頻道: " + CONFIG.MQTT_TOPIC;
      },

      executeRemoteReveal(targetClass, targetPeriod) {
        if (targetClass) this.currentClass = targetClass;
        if (targetPeriod) this.rankingPeriod = targetPeriod;

        this.renderAllClassTabs();
        this.loadLeaderboardData();

        document.body.classList.add('tv-theater-mode');
        document.getElementById('appHeader').classList.remove('authorized');

        SoundFx.playGateOpen();
        const gate = document.getElementById('view-gate');
        gate.classList.add('door-opening');

        setTimeout(() => {
          document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
          const lbView = document.getElementById('view-leaderboard');
          lbView.classList.add('active');
          gate.classList.remove('door-opening');
          
          setTimeout(() => {
            this.startRevealTheater();
          }, 300);
        }, 1100);
      },

      executeRemoteClose() {
        SoundFx.playGateClose();
        
        const gate = document.getElementById('view-gate');
        gate.classList.add('active');
        gate.classList.add('door-opening');

        setTimeout(() => {
          gate.classList.remove('door-opening');
          document.getElementById('view-leaderboard').classList.remove('active');
          document.body.classList.remove('tv-theater-mode');
          document.getElementById('gateSubTitle').innerText = "🖥️ 大門已重新閉合，等待下一班廣播...";
        }, 50);
      },

      broadcastRevealSignal() {
        if (!this.mqttClient || !this.mqttClient.connected) {
          alert('魔導通訊正在重連中，請稍候重試！');
          return;
        }

        const payload = JSON.stringify({
          action: 'REVEAL',
          classId: this.currentClass,
          period: this.rankingPeriod,
          timestamp: Date.now()
        });

        this.mqttClient.publish(CONFIG.MQTT_TOPIC, payload, { qos: 1 });

        if (navigator.vibrate) navigator.vibrate(25);
        this.loadLeaderboardData();
        document.getElementById('podiumCol1').classList.add('reveal');
        document.getElementById('podiumCol2').classList.add('reveal');
        document.getElementById('podiumCol3').classList.add('reveal');
        document.getElementById('rosterParchmentSheet').classList.add('active-show');

        alert(`📢 廣播成功！電腦大螢幕即刻開門！\n班級：${this.currentClass}\n榜別：${this.rankingPeriod === 'weekly' ? '週排行榜' : '總排行榜'}`);
      },

      broadcastCloseSignal() {
        if (!this.mqttClient || !this.mqttClient.connected) {
          alert('魔導通訊正在重連中，請稍候重試！');
          return;
        }

        const payload = JSON.stringify({ action: 'CLOSE', timestamp: Date.now() });
        this.mqttClient.publish(CONFIG.MQTT_TOPIC, payload, { qos: 1 });

        if (navigator.vibrate) navigator.vibrate([20, 50, 20]);
        alert('🚪 已命令電腦大門向內閉合，進入待命狀態！');
      },

      // 視圖切換 (黑畫面徹底根絕修復)
      switchView(viewKey) {
        if (!this.sessionUnlocked && viewKey !== 'gate' && !this.isTvStandby) return;

        document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.btn-nav-magic').forEach(b => b.classList.remove('active'));

        let target = null;
        if (viewKey === 'workspace') {
          target = document.getElementById('view-workspace');
          document.getElementById('navBtnWorkspace').classList.add('active');
          this.renderStudentCards();
          this.renderNotesSection();
        } else if (viewKey === 'leaderboard') {
          target = document.getElementById('view-leaderboard');
          document.getElementById('navBtnLeaderboard').classList.add('active');
          this.loadLeaderboardData();
          document.getElementById('podiumCol1').classList.add('reveal');
          document.getElementById('podiumCol2').classList.add('reveal');
          document.getElementById('podiumCol3').classList.add('reveal');
          document.getElementById('rosterParchmentSheet').classList.add('active-show');
        } else if (viewKey === 'roster') {
          target = document.getElementById('view-roster-manager');
          document.getElementById('navBtnRoster').classList.add('active');
          this.renderAllClassTabs();
          this.loadRosterManagerText();
        }

        if (target) {
          target.classList.add('active');
        }
      },

      switchPhoneMode(mode) {
        const scoringCol = document.getElementById('scoringColumn');
        const notesCol = document.getElementById('notesColumn');
        const btnScore = document.getElementById('btnPhoneScoring');
        const btnNotes = document.getElementById('btnPhoneNotes');

        if (mode === 'scoring') {
          scoringCol.style.display = 'flex';
          notesCol.classList.remove('phone-active');
          btnScore.classList.add('active');
          btnNotes.classList.remove('active');
        } else {
          scoringCol.style.display = 'none';
          notesCol.classList.add('phone-active');
          btnNotes.classList.add('active');
          btnScore.classList.remove('active');
        }
      },

      loadStorageData() {
        const raw = localStorage.getItem('magic_academy_store_' + CONFIG.VERSION);
        if (raw) {
          try {
            this.data = JSON.parse(raw);
          } catch (e) {
            this.generateSeedData();
          }
        } else {
          this.generateSeedData();
        }
      },

      generateSeedData() {
        const list = [];
        this.data.classes.forEach(cid => {
          for (let i = 1; i <= 20; i++) {
            list.push({
              classId: cid,
              seatNo: i,
              name: `學員 ${i} 號`,
              totalScore: 0,
              weeklyScore: 0
            });
          }
        });
        this.data.students = list;
        this.saveStorageData();
      },

      saveStorageData() {
        localStorage.setItem('magic_academy_store_' + CONFIG.VERSION, JSON.stringify(this.data));
      },

      // 同步渲染「課堂後台」與「名冊管理」兩處的班級頁籤
      renderAllClassTabs() {
        const bars = [document.getElementById('classTabBar'), document.getElementById('rosterTabBar')];
        bars.forEach(bar => {
          if (!bar) return;
          bar.innerHTML = "";
          this.data.classes.forEach(c => {
            const pill = document.createElement('button');
            pill.className = `class-tab-pill ${c === this.currentClass ? 'active' : ''}`;
            pill.innerText = `${c} 班`;
            pill.onclick = () => {
              this.currentClass = c;
              this.renderAllClassTabs();
              this.renderStudentCards();
              this.renderNotesSection();
              this.loadRosterManagerText();
              this.updateLeaderboardSelectValue();
            };
            bar.appendChild(pill);
          });

          // 新增班級按鈕
          const addBtn = document.createElement('button');
          addBtn.className = "btn-add-class-pill";
          addBtn.innerText = "➕ 新增班級";
          addBtn.onclick = () => this.promptAddNewClass();
          bar.appendChild(addBtn);
        });

        const titleElem = document.getElementById('rosterTargetClassTitle');
        if (titleElem) titleElem.innerText = `【${this.currentClass} 班】名冊管理`;
      },

      populateLeaderboardSelect() {
        const sel = document.getElementById('leaderboardClassSelect');
        if (!sel) return;
        sel.innerHTML = "";
        this.data.classes.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c;
          opt.innerText = `${c} 班`;
          sel.appendChild(opt);
        });
        this.updateLeaderboardSelectValue();
      },

      updateLeaderboardSelectValue() {
        const sel = document.getElementById('leaderboardClassSelect');
        if (sel) sel.value = this.currentClass;
      },

      onLeaderboardClassChange() {
        this.currentClass = document.getElementById('leaderboardClassSelect').value;
        this.renderAllClassTabs();
        this.loadLeaderboardData();
      },

      renderStudentCards() {
        const grid = document.getElementById('studentGrid');
        if (!grid) return;
        grid.innerHTML = "";
        const currentList = this.data.students.filter(s => s.classId === this.currentClass);
        currentList.sort((a, b) => a.seatNo - b.seatNo);

        currentList.forEach(s => {
          const card = document.createElement('div');
          card.className = "student-touch-card";
          card.innerHTML = `
            <span class="card-seat-tag">#${s.seatNo}</span>
            <div class="card-student-name">${s.name}</div>
            <div class="card-score-value">${s.totalScore}</div>
          `;
          card.onclick = () => this.recordScore(s);
          grid.appendChild(card);
        });
      },

      selectWeight(val) {
        this.currentWeight = val;
        document.querySelectorAll('.weight-chip').forEach(btn => {
          btn.classList.toggle('active', btn.innerText === (val > 0 ? `+${val}` : `${val}`));
        });
      },

      recordScore(student) {
        if (navigator.vibrate) navigator.vibrate(18);

        student.totalScore += this.currentWeight;
        student.weeklyScore += this.currentWeight;
        this.saveStorageData();
        this.renderStudentCards();

        this.setSyncStatus('pending');
        clearTimeout(this.syncTimer);
        this.syncTimer = setTimeout(() => {
          this.pushScoresToCloud();
        }, CONFIG.DEBOUNCE_DELAY);
      },

      async pushScoresToCloud() {
        if (!CONFIG.GAS_API_URL || CONFIG.GAS_API_URL.includes("SAMPLE")) {
          this.setSyncStatus('synced');
          return;
        }

        try {
          const payload = { action: 'sync_scores', data: this.data.students };
          const response = await fetch(CONFIG.GAS_API_URL, {
            method: 'POST',
            mode: 'cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(payload)
          });
          const res = await response.json();
          if (res.status === 'success') {
            this.setSyncStatus('synced');
          } else {
            this.setSyncStatus('error');
          }
        } catch (err) {
          this.setSyncStatus('error');
        }
      },

      renderNotesSection() {
        const today = new Date().toISOString().split('T')[0];
        const heading = document.getElementById('notesHeadingInfo');
        if (heading) heading.innerText = `${this.currentClass} 班 (${today})`;
        const currentKey = `${this.currentClass}_${today}`;
        const editor = document.getElementById('notesEditor');
        if (!editor) return;

        if (this.data.notes[currentKey]) {
          editor.innerHTML = this.data.notes[currentKey];
        } else {
          const inherited = this.findRecentClassNote(this.currentClass, today);
          editor.innerHTML = inherited || `<div><b>📌 今日任務：</b></div><ul><li>重點 1：</li></ul>`;
        }
      },

      findRecentClassNote(classId, excludeDate) {
        const prefix = classId + "_";
        const keys = Object.keys(this.data.notes).filter(k => k.startsWith(prefix) && !k.endsWith(excludeDate));
        if (keys.length === 0) return null;
        keys.sort().reverse();
        return this.data.notes[keys[0]];
      },

      applyHighlight() {
        const sel = window.getSelection();
        if (!sel.rangeCount) return;
        const span = document.createElement("span");
        span.style.backgroundColor = "rgba(247, 228, 154, 0.7)";
        span.style.padding = "2px 4px";
        span.style.borderRadius = "3px";
        const range = sel.getRangeAt(0).cloneRange();
        range.surroundContents(span);
        sel.removeAllRanges();
        sel.addRange(range);
      },

      async saveCurrentNotes() {
        const today = new Date().toISOString().split('T')[0];
        const key = `${this.currentClass}_${today}`;
        const html = document.getElementById('notesEditor').innerHTML;
        this.data.notes[key] = html;
        this.saveStorageData();

        if (CONFIG.GAS_API_URL && !CONFIG.GAS_API_URL.includes("SAMPLE")) {
          try {
            await fetch(CONFIG.GAS_API_URL, {
              method: 'POST',
              mode: 'cors',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify({
                action: 'save_notes',
                data: { classId: this.currentClass, date: today, content: html }
              })
            });
          } catch (e) {
            console.warn("筆記雲端同步延遲", e);
          }
        }
        alert('✨ 備課筆記已成功存檔！');
      },

      toggleRankingPeriod() {
        this.rankingPeriod = (this.rankingPeriod === 'weekly') ? 'total' : 'weekly';
        document.getElementById('btnToggleRankingType').innerText = 
          `目前為：【${this.rankingPeriod === 'weekly' ? '週排行榜' : '總排行榜'}】`;
        this.loadLeaderboardData();
      },

      loadLeaderboardData() {
        const classStudents = this.data.students.filter(s => s.classId === this.currentClass);
        const scoreKey = (this.rankingPeriod === 'weekly') ? 'weeklyScore' : 'totalScore';
        
        const sortedList = [...classStudents].sort((a, b) => b[scoreKey] - a[scoreKey]);

        const s1 = sortedList[0] || { name: '無', [scoreKey]: 0 };
        const s2 = sortedList[1] || { name: '無', [scoreKey]: 0 };
        const s3 = sortedList[2] || { name: '無', [scoreKey]: 0 };

        document.getElementById('podiumName1').innerText = s1.name;
        document.getElementById('podiumScore1').innerText = `${s1[scoreKey]} 分`;
        document.getElementById('podiumName2').innerText = s2.name;
        document.getElementById('podiumScore2').innerText = `${s2[scoreKey]} 分`;
        document.getElementById('podiumName3').innerText = s3.name;
        document.getElementById('podiumScore3').innerText = `${s3[scoreKey]} 分`;

        const rankMap = new Map();
        sortedList.forEach((st, idx) => rankMap.set(st.seatNo, idx + 1));

        const rosterGrid = document.getElementById('rosterSheetGrid');
        rosterGrid.innerHTML = "";
        const seatSorted = [...classStudents].sort((a, b) => a.seatNo - b.seatNo);

        seatSorted.forEach(st => {
          const item = document.createElement('div');
          item.className = "roster-sheet-item";
          item.innerHTML = `
            <span>#${st.seatNo} ${st.name}</span>
            <span><b>${st[scoreKey]}分</b> <span class="roster-rank-num">第${rankMap.get(st.seatNo)}名</span></span>
          `;
          rosterGrid.appendChild(item);
        });
      },

      startRevealTheater() {
        SoundFx.init();
        const p1 = document.getElementById('podiumCol1');
        const p2 = document.getElementById('podiumCol2');
        const p3 = document.getElementById('podiumCol3');
        const sheet = document.getElementById('rosterParchmentSheet');

        p1.classList.remove('reveal');
        p2.classList.remove('reveal');
        p3.classList.remove('reveal');
        sheet.classList.remove('active-show');

        setTimeout(() => {
          SoundFx.playDrumBeat();
          p3.classList.add('reveal');
        }, 500);

        setTimeout(() => {
          SoundFx.playDrumBeat();
          p2.classList.add('reveal');
        }, 1500);

        setTimeout(() => {
          SoundFx.playFanfareVictory();
          p1.classList.add('reveal');
          this.shootConfetti();

          setTimeout(() => {
            sheet.classList.add('active-show');
          }, 2000);
        }, 2700);
      },

      // 載入當前班級名冊至文字框 (含歷史分數展示)
      loadRosterManagerText() {
        const list = this.data.students.filter(s => s.classId === this.currentClass);
        list.sort((a, b) => a.seatNo - b.seatNo);
        const lines = list.map(s => `${s.seatNo} ${s.name} ${s.totalScore} ${s.weeklyScore}`);
        const inputElem = document.getElementById('rosterBatchInput');
        if (inputElem) {
          inputElem.value = lines.join('\n');
        }
      },

      // 智慧寬鬆解析：支援 Excel 直接複製貼上 (2欄或4欄)
      async applyBatchRoster() {
        const raw = document.getElementById('rosterBatchInput').value.trim();
        if (!raw) return;

        const lines = raw.split('\n');
        const parsed = [];
        
        lines.forEach(line => {
          const parts = line.trim().split(/[\t\s,]+/);
          if (parts.length >= 2) {
            const seat = parseInt(parts[0], 10);
            const name = parts[1];
            const total = parts.length >= 3 ? parseInt(parts[2], 10) : 0;
            const weekly = parts.length >= 4 ? parseInt(parts[3], 10) : 0;
            if (!isNaN(seat) && name) {
              parsed.push({
                classId: this.currentClass,
                seatNo: seat,
                name: name,
                totalScore: isNaN(total) ? 0 : total,
                weeklyScore: isNaN(weekly) ? 0 : weekly
              });
            }
          }
        });

        if (parsed.length === 0) {
          alert('名冊格式解析失敗，請確保每行有座號與姓名（例如：1 王小明 或 1 王小明 20 5）');
          return;
        }

        // 替換本機資料
        this.data.students = this.data.students.filter(s => s.classId !== this.currentClass).concat(parsed);
        this.saveStorageData();
        this.renderStudentCards();
        alert(`✨ ${this.currentClass} 班名冊更新成功，共 ${parsed.length} 位學員！正在同步至 Google 試算表...`);

        if (CONFIG.GAS_API_URL && !CONFIG.GAS_API_URL.includes("SAMPLE")) {
          try {
            const res = await fetch(CONFIG.GAS_API_URL, {
              method: 'POST',
              mode: 'cors',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify({
                action: 'update_roster',
                classId: this.currentClass,
                students: parsed
              })
            });
            const json = await res.json();
            if (json.status === 'success') {
              alert(`🟢 Google 試算表【${this.currentClass}】分頁已同步完成！`);
            }
          } catch (e) {
            console.warn("名冊雲端同步暫緩", e);
          }
        }
      },

      // 互動建立新班級
      async promptAddNewClass() {
        const newClassId = prompt("請輸入新班級名稱代號（例如：104）：");
        if (!newClassId) return;
        const cleanId = newClassId.trim();

        if (this.data.classes.includes(cleanId)) {
          alert("該班級已存在！");
          return;
        }

        this.data.classes.push(cleanId);
        this.currentClass = cleanId;
        // 建立預設學員
        for (let i = 1; i <= 20; i++) {
          this.data.students.push({
            classId: cleanId,
            seatNo: i,
            name: `學員 ${i} 號`,
            totalScore: 0,
            weeklyScore: 0
          });
        }

        this.saveStorageData();
        this.renderAllClassTabs();
        this.populateLeaderboardSelect();
        this.loadRosterManagerText();
        this.renderStudentCards();

        alert(`✨ 班級【${cleanId}】已於本機建立！正在於 Google 試算表建立新分頁...`);

        if (CONFIG.GAS_API_URL && !CONFIG.GAS_API_URL.includes("SAMPLE")) {
          try {
            await fetch(CONFIG.GAS_API_URL, {
              method: 'POST',
              mode: 'cors',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify({ action: 'create_class', classId: cleanId })
            });
          } catch (e) {
            console.warn("班級雲端建立延遲", e);
          }
        }
      },

      // 互動刪除班級 (支援安全封存與永久刪除雙軌)
      async promptDeleteCurrentClass() {
        if (this.data.classes.length <= 1) {
          alert("系統至少需保留一個班級，無法全數刪除！");
          return;
        }

        const isPermanent = confirm(
          `確定要移除【${this.currentClass} 班】嗎？\n\n` +
          `• 點選【確定】：安全隱藏封存（試算表更名為 _ARCHIVE_${this.currentClass}，保留歷史成績）\n` +
          `• 點選【取消】：放棄操作`
        );
        if (!isPermanent) return;

        const reallyPermanent = confirm(`【進階選項確認】\n是否要「永久徹底刪除」該試算表分頁？\n\n• 按【確定】= 永久徹底抹除\n• 按【取消】= 僅安全封存（推薦）`);

        const targetClass = this.currentClass;
        this.data.classes = this.data.classes.filter(c => c !== targetClass);
        this.data.students = this.data.students.filter(s => s.classId !== targetClass);
        this.currentClass = this.data.classes[0];

        this.saveStorageData();
        this.renderAllClassTabs();
        this.populateLeaderboardSelect();
        this.loadRosterManagerText();
        this.renderStudentCards();

        alert(`已從系統移除【${targetClass} 班】！正在同步至 Google 試算表...`);

        if (CONFIG.GAS_API_URL && !CONFIG.GAS_API_URL.includes("SAMPLE")) {
          try {
            await fetch(CONFIG.GAS_API_URL, {
              method: 'POST',
              mode: 'cors',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify({
                action: 'delete_class',
                classId: targetClass,
                permanent: reallyPermanent
              })
            });
          } catch (e) {
            console.warn("班級雲端移除延遲", e);
          }
        }
      },

      async fetchCloudData(isSilent = false) {
        if (!CONFIG.GAS_API_URL || CONFIG.GAS_API_URL.includes("SAMPLE")) return;
        try {
          const res = await fetch(CONFIG.GAS_API_URL + "?action=fetch_all&t=" + Date.now());
          const json = await res.json();
          if (json.status === 'success' && json.classes && json.classes.length > 0) {
            this.data.classes = json.classes;
            if (!this.data.classes.includes(this.currentClass)) {
              this.currentClass = this.data.classes[0];
            }
            this.data.students = json.students || [];
            if (json.password) this.data.adminPassword = json.password;
            if (json.notes) {
              json.notes.forEach(n => {
                this.data.notes[`${n.classId}_${n.date}`] = n.content;
              });
            }
            this.saveStorageData();
            
            // 介面即時無感對齊
            this.renderAllClassTabs();
            this.populateLeaderboardSelect();
            if (document.getElementById('view-workspace').classList.contains('active')) {
              this.renderStudentCards();
            }
            if (document.getElementById('view-roster-manager').classList.contains('active')) {
              this.loadRosterManagerText();
            }
            if (document.getElementById('view-leaderboard').classList.contains('active') && !this.isTvStandby) {
              this.loadLeaderboardData();
            }
          }
        } catch (e) {
          if (!isSilent) console.log("離線或後台拉取靜默跳過");
        }
      },

      setSyncStatus(status) {
        const gem = document.getElementById('cloudSyncIndicator');
        if (!gem) return;
        gem.className = 'sync-gem';
        if (status === 'pending') gem.classList.add('pending');
        if (status === 'error') gem.classList.add('error');
      },

      initCanvasConfetti() {
        const cvs = document.getElementById('confettiCanvas');
        if (!cvs) return;
        cvs.width = window.innerWidth;
        cvs.height = window.innerHeight;
        window.addEventListener('resize', () => {
          cvs.width = window.innerWidth;
          cvs.height = window.innerHeight;
        });
      },

      shootConfetti() {
        const cvs = document.getElementById('confettiCanvas');
        if (!cvs) return;
        const ctx = cvs.getContext('2d');
        const sparks = [];
        const pal = ['#ffd700', '#f7e49a', '#ffffff', '#2ecc71', '#d4af37'];

        for (let i = 0; i < 90; i++) {
          sparks.push({
            x: cvs.width / 2,
            y: cvs.height * 0.45,
            vx: (Math.random() - 0.5) * 16,
            vy: (Math.random() - 0.75) * 15,
            size: Math.random() * 5 + 3,
            color: pal[Math.floor(Math.random() * pal.length)],
            life: 1
          });
        }

        function step() {
          ctx.clearRect(0, 0, cvs.width, cvs.height);
          let running = false;
          sparks.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.28;
            p.life -= 0.012;
            if (p.life > 0) {
              running = true;
              ctx.save();
              ctx.globalAlpha = p.life;
              ctx.fillStyle = p.color;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            }
          });
          if (running) requestAnimationFrame(step);
        }
        step();
      }
    };

    window.addEventListener('DOMContentLoaded', () => App.init());
  </script>
